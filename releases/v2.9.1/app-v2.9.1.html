/* Exacte sessietafelinhoud: leeg = geen Hero, geen speler-seat en geen inactive seat. */
function b432SessionTableHasContent(s){if(!s)return false;const x=b43NormalizeSessionTable(deepClone(s));return !!x.heroSeat||(x.players||[]).some(p=>p.seat)||(x.inactiveSeats||[]).length>0}
function b432SessionTableValid(s){if(!b432SessionTableHasContent(s))return false;const x=b43NormalizeSessionTable(deepClone(s)),active=new Set(b43SessionActiveSeats(x));return !!x.heroSeat&&active.has(String(x.heroSeat))}
b43SessionTableConfigured=function(s){return b432SessionTableValid(s)};

/* Sessie-scherm biedt geen parallelle directe Hero-seatselector meer; Tafelindeling is de structurele seatroute. */
const rSessionB432Base=rSession;rSession=function(){const html=rSessionB432Base(),tpl=document.createElement('template');tpl.innerHTML=html;const heroLabel=[...tpl.content.querySelectorAll('label')].find(x=>x.textContent.trim()==='Mijn seat');if(heroLabel)heroLabel.parentElement?.remove();return tpl.innerHTML};

/* Handtafel toont exacte H-/S-inactiefstatus en blijft positiegedreven zodra Button bekend is. */
b43HandSeatState=function(d,seat){seat=String(seat);if(d.useSessionTable&&(d.sessionInactiveSeats||[]).includes(seat))return{kind:'sessionInactive',label:'S-inactief'};if(!b43HandActiveSeats(d,currentSession()).includes(seat))return{kind:'handInactive',label:'H-inactief'};if(String(d.heroSeat||'')===seat)return{kind:'hero',label:'Hero'};const v=(d.villains||[]).find(x=>String(x.seat||'')===seat&&!x.b43HandInactive);if(v)return{kind:'villain',label:v.name||'Villain',villain:v};return{kind:'anonymous',label:'Niemand'}};
b43TableButtons=function(model,mode){const count=Number(model.tableSeats)||9,coords=rc8SeatGeometry(count);return coords.map((q,i)=>{const seat=String(i+1),st=model.state(seat),inactive=['inactive','sessionInactive','handInactive'].includes(st.kind),pos=model.positionBySeat?.[seat]||'',selected=String(model.selected||'')===seat;let cl='wz-seat';if(st.kind==='hero')cl+=' hero';if(st.kind==='villain')cl+=' v27-villain';if(st.kind==='anonymous')cl+=' b432-anonymous';if(pos==='SB')cl+=' sb';if(pos==='BB')cl+=' bb';if(inactive)cl+=st.kind==='sessionInactive'?' b43-session-inactive':' b43-hand-inactive';if(selected)cl+=' v27-selected';let text;if(st.kind==='sessionInactive')text='S-inactief';else if(st.kind==='handInactive')text='H-inactief';else if(st.kind==='inactive')text='Inactief';else text=(mode==='session'||mode==='button')?`Seat ${seat}`:(pos||`Seat ${seat}`);const sub=inactive?'':(st.kind==='hero'?'Ik':st.kind==='villain'?st.label:'');const dealer=model.buttonSeat&&String(model.buttonSeat)===seat?'<span class="v27-dealer-dot">D</span>':'';return`<button type="button" class="${cl}" style="left:${q.x}px;top:${q.y}px" ${model.data}="${seat}" ${model.disable?.(seat,st)?'disabled':''}>${dealer}<span>${esc(text)}</span>${sub?`<small>${esc(sub.length>12?sub.slice(0,11)+'…':sub)}</small>`:''}</button>`}).join('')};

b43OpenSessionTable=function(){const s=currentSession();if(!s)return;const snap=b43NormalizeSessionTable(deepClone(s));UI.sessionTableTx={sid:s.id,tableSeats:Number(snap.tableSeats)||9,heroSeat:String(snap.heroSeat||''),inactiveSeats:[...(snap.inactiveSeats||[])].map(String),players:deepClone(snap.players||[]),seatDetail:'',error:''};UI.screen='tableLayout';render()};
b43SessionSeatOpen=function(seat){if(!UI.sessionTableTx)return;UI.sessionTableTx.seatDetail=String(seat);render()};
function b432SessionContextClose(){if(UI.sessionTableTx){UI.sessionTableTx.seatDetail='';render()}}
b43SessionMoveHero=function(seat){const tx=UI.sessionTableTx;seat=String(seat);tx.inactiveSeats=tx.inactiveSeats.filter(x=>x!==seat);tx.players.forEach(p=>{if(String(p.seat)===seat)p.seat=''});tx.heroSeat=seat;tx.error='';tx.seatDetail='';render()};
b43SessionAssignPlayer=function(seat,player){const tx=UI.sessionTableTx;seat=String(seat);tx.inactiveSeats=tx.inactiveSeats.filter(x=>x!==seat);if(String(tx.heroSeat)===seat)tx.heroSeat='';tx.players.forEach(p=>{if(String(p.seat)===seat||String(p.id)===String(player.id))p.seat=''});let p=tx.players.find(x=>String(x.id)===String(player.id));if(!p){p={id:player.id,name:player.name||'',notes:'',seat:''};tx.players.push(p)}p.seat=seat;tx.seatDetail='';render()};
function b432SessionTxHasContent(tx){return !!tx?.heroSeat||(tx?.players||[]).some(p=>p.seat)||(tx?.inactiveSeats||[]).length>0}
b43SessionTableAction=function(act){const tx=UI.sessionTableTx;if(!tx)return;const seat=String(tx.seatDetail||'');if(act==='cancel'){UI.sessionTableTx=null;UI.screen='session';return render()}if(act==='done'){const active=b43Seats(tx.tableSeats).filter(x=>!tx.inactiveSeats.includes(x));if(active.length<2){tx.error='Minimaal twee seats moeten actief blijven.';return render()}if(b432SessionTxHasContent(tx)&&(!tx.heroSeat||!active.includes(String(tx.heroSeat)))){tx.error='Selecteer eerst de Hero-seat.\nEen tafelindeling met ingevulde seats kan alleen worden opgeslagen als Hero aan een actieve seat is toegewezen.';return render()}const s=DB.sessions.find(x=>x.id===tx.sid);if(!s)return;s.heroSeat=tx.heroSeat;s.inactiveSeats=[...tx.inactiveSeats];s.players=deepClone(tx.players);b43NormalizeSessionTable(s);UI.sessionTableTx=null;UI.screen='session';save();return render()}if(act==='clearAll'){tx.heroSeat='';tx.players.forEach(p=>p.seat='');tx.inactiveSeats=[];tx.seatDetail='';tx.error='';return render()}if(!seat)return;if(act==='close')return b432SessionContextClose();if(act==='hero')return b43SessionMoveHero(seat);if(act==='villain'){UI.f6PickerTarget={kind:'sessionTable',seat,search:''};return render()}if(act==='empty'){if(String(tx.heroSeat)===seat)tx.heroSeat='';tx.players.forEach(p=>{if(String(p.seat)===seat)p.seat=''});tx.inactiveSeats=tx.inactiveSeats.filter(x=>x!==seat);tx.seatDetail='';return render()}if(act==='inactive'){if(String(tx.heroSeat)===seat)tx.heroSeat='';tx.players.forEach(p=>{if(String(p.seat)===seat)p.seat=''});if(!tx.inactiveSeats.includes(seat))tx.inactiveSeats.push(seat);tx.seatDetail='';return render()}if(act==='active'){tx.inactiveSeats=tx.inactiveSeats.filter(x=>x!==seat);tx.seatDetail='';return render()}};
function b432SessionContext(){const tx=UI.sessionTableTx;if(!tx?.seatDetail)return'';const seat=String(tx.seatDetail),st=b43SessionTxState(seat);let acts=[];if(st.kind==='anonymous')acts=[['hero','Hero toevoegen'],['villain','Villain toevoegen'],['inactive','Inactief maken']];if(st.kind==='hero')acts=[['villain','Villain toevoegen'],['empty','Leeg maken'],['inactive','Inactief maken']];if(st.kind==='villain')acts=[['hero','Hero toevoegen'],['villain','Andere Villain toevoegen'],['empty','Leeg maken'],['inactive','Inactief maken']];if(st.kind==='inactive')acts=[['active','Actief maken'],['hero','Hero toevoegen'],['villain','Villain toevoegen']];return`<div class="overlay b432-seat-overlay"><div class="b432-seat-card"><div class="b432-overlay-head"><div><h2>Seat ${esc(seat)}</h2><div class="note">${st.kind==='villain'?'Gevuld door: '+esc(st.label):st.kind==='hero'?'Hero':st.kind==='inactive'?'Inactief':'Geen speler toegevoegd'}</div></div><button type="button" class="btn sub small" data-b432-session-context-close="1">Sluiten</button></div><div class="b43-seat-actions">${acts.map(([a,l])=>`<button class="btn sub" data-b43-table-action="${a}">${l}</button>`).join('')}</div></div></div>`}
b43SessionTableScreen=function(){const tx=UI.sessionTableTx,s=tx&&DB.sessions.find(x=>x.id===tx.sid);if(!tx||!s)return rSession();const visual=b43TableVisual({tableSeats:tx.tableSeats,state:b43SessionTxState,positionBySeat:{},selected:tx.seatDetail,data:'data-b43-session-seat'},'session');const err=tx.error?`<div class="b432-inline-error"><b>${esc(String(tx.error).split('\n')[0])}</b>${esc(String(tx.error).split('\n').slice(1).join(' '))}</div>`:'';return`<div class="panel b432-session-panel"><div class="v27-question">Tafelindeling</div><div class="b432-setup-sub">Tik op een seat om de actuele sessietafel aan te passen.</div>${err}${visual}<div class="b432-session-actions"><button class="btn sub wide" data-b43-table-action="clearAll">Tafel leegmaken</button><button class="btn sub" data-b43-table-action="cancel">Annuleren</button><button class="btn" data-b43-table-action="done">Gereed</button></div></div>${b432SessionContext()}`};

function b432SessionSnapshot(){const s=currentSession();return s?b43NormalizeSessionTable(deepClone(s)):null}
function b432InfoTableOverlay(){const s=b432SessionSnapshot();if(!s||!b432SessionTableValid(s))return'';const visual=b43TableVisual({tableSeats:s.tableSeats,state:seat=>b43SessionSeatState(s,seat),positionBySeat:{},selected:'',data:'data-b432-info-seat',disable:()=>true},'session');return`<div class="overlay b432-info-overlay"><div class="b432-info-card"><div class="b432-overlay-head"><h2>Tafelindeling sessie</h2><button type="button" class="btn sub small" data-b432-info-close="1">Sluiten</button></div><div class="note">Informatief. Wijzigingen voor deze hand maak je in Tafel & spelers.</div>${visual}</div></div>`}
function b43ConfigTableChoice(){const d=UI.draft,s=currentSession(),valid=b432SessionTableValid(b432SessionSnapshot()||s);if(!valid&&d.useSessionTable)b43ApplySessionTableChoice(d,s,false);return`<div class="b43-config-row ${valid?'':'b432-config-disabled'}"><div class="v271-main-label">Tafelindeling sessie gebruiken?</div><div class="seg"><button class="${d.useSessionTable?'on':''}" data-b43-use-session-table="yes" ${valid?'':'disabled'}>Ja</button><button class="${!d.useSessionTable?'on':''}" data-b43-use-session-table="no" ${valid?'':'disabled'}>Nee</button></div>${valid?`<button type="button" class="btn sub small" style="margin-top:8px" data-b432-info-open="1">Tafelindeling bekijken</button>`:''}</div>${valid?'':`<div class="b432-config-note">Geen tafelindeling ingevoerd bij sessie.</div>`}`}
v27Config=function(){const d=UI.draft,s=currentSession(),cash=s.type==='cash',blindContext=cash?`${d.sb!==''?money(s,d.sb):'—'} / ${d.bb!==''?money(s,d.bb):'—'}`:'';const overlay=UI.wz?.b432InfoTable?b432InfoTableOverlay():'';if(cash)return`<div class="panel"><div class="v27-question">Basisgegevens</div>${b43ConfigTableChoice()}<div class="v272-readonly-context">Blinds: <b>${esc(blindContext)}</b></div><label class="v271-check-row"><input type="checkbox" data-wz-sbna ${d.sbNA?'checked':''}><span>SB n.v.t.</span></label>${v271HandStraddleConfig()}${wzErr()}</div>${overlay}`;/* Technische toelichting: herstel de bestaande v2.7 BBA-state in de runtime-effectieve Basisgegevens-renderer; geen tweede statebron. */return`<div class="panel"><div class="v27-question">Basisgegevens</div>${b43ConfigTableChoice()}<div class="grid3 v27b22-blind-grid"><div><label>SB</label><input data-rc8-tournament-chip="sb" data-v27b22-blind="sb" inputmode="decimal" value="${esc(rc8Build12FormatTournamentChip(d.sb))}"></div><div><label>BB</label><input data-rc8-tournament-chip="bb" data-v27b22-blind="bb" inputmode="decimal" value="${esc(rc8Build12FormatTournamentChip(d.bb))}"></div><div><label>BBA</label><input data-rc8-tournament-chip="ante" data-v27b22-blind="ante" inputmode="decimal" value="${d.bbaEnabled?esc(rc8Build12FormatTournamentChip(d.ante)):''}" ${d.bbaEnabled?'':'disabled'}></div></div><div class="v27b22-shared-blind-suffix">${v27b21Historical()?'':v27b21SuffixMarkup('mtt','tournament-blinds')}</div><label class="v271-check-row"><input type="checkbox" data-wz-bba ${d.bbaEnabled?'checked':''}><span>Big Blind Ante actief</span></label><label class="v271-check-row"><input type="checkbox" data-wz-sbna ${d.sbNA?'checked':''}><span>SB n.v.t.</span></label>${wzErr()}</div>${overlay}`};

function b432VillainDetailOpen(target){

  const seat=raw.slice(5),historical=!!(UI.editTx&&d1Historical());

  w.b432VillainLink={seat,playerId:'',name:'',saveLibrary:false,explicitUnknown:false};
