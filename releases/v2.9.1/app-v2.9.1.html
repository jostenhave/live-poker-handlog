function deepClone(v){return JSON.parse(JSON.stringify(v))}
function normalizePlayerName(v){return String(v||'').trim().replace(/\s+/g,' ').toLocaleLowerCase('nl-NL')}
function safeStorageSet(k,v){try{localStorage.setItem(k,v);return true}catch(e){STORAGE_AVAILABLE=false;return false}}
function validateDatabaseShape(db){if(!db||typeof db!=='object'||Array.isArray(db))throw new Error('De database heeft geen geldige hoofdstructuur.');if(!Array.isArray(db.sessions))throw new Error('De sessiegegevens hebben geen geldige structuur.');if(!Array.isArray(db.playerLibrary))throw new Error('De spelersgegevens hebben geen geldige structuur.');if(!db.prefs||typeof db.prefs!=='object'||Array.isArray(db.prefs))throw new Error('De instellingen hebben geen geldige structuur.');db.sessions.forEach((s,i)=>{if(!s||typeof s!=='object'||!Array.isArray(s.hands)||!Array.isArray(s.players))throw new Error('Sessie '+(i+1)+' is beschadigd.');});return true}
function migrateObject(input){const previous=DB;DB=deepClone(input);migrate(false);const out=deepClone(DB);DB=previous;return out}
function persistNow(){const target=EMERGENCY_MODE?EMERGENCY_KEY:KEY;return safeStorageSet(target,JSON.stringify(DB))}

function load(){let raw=null,source=KEY;try{raw=localStorage.getItem(KEY);if(!raw){for(const k of OLDKEYS){raw=localStorage.getItem(k);if(raw){source=k;break}}}if(!raw){DB={schemaVersion:SCHEMA_VERSION,sessions:[],playerLibrary:[],prefs:{verbosity:'full'}};migrate();render();return}const parsed=JSON.parse(raw);validateDatabaseShape(parsed);DB=parsed;migrate();if(source!==KEY)persistNow();render()}catch(e){RECOVERY_RAW=raw||'';RECOVERY_REASON=e&&e.message?e.message:'De opgeslagen gegevens kunnen niet worden gelezen.';UI.screen='recovery';render()}}
function makeBackup(categories){const c=categories||{players:true,sessions:true,settings:true},present=[];const data={};if(c.players){present.push('players');data.players=deepClone(DB.playerLibrary||[])}if(c.sessions){present.push('sessions');data.sessions=deepClone(DB.sessions||[])}if(c.settings){present.push('settings');data.settings=deepClone(DB.prefs||{})}return{metadata:{backupVersion:BACKUP_VERSION,schemaVersion:SCHEMA_VERSION,appVersion:APP_VERSION,exportDate:new Date().toISOString(),categories:present},data}}

function assertUniqueIds(records,label){
  const seen=new Set();
  records.forEach((r,i)=>{
    if(!r||typeof r!=='object'||Array.isArray(r))throw new Error(label+' '+(i+1)+' is geen geldig record.');
    if(!String(r.id||'').trim())throw new Error(label+' '+(i+1)+' heeft geen geldige ID.');
    if(seen.has(r.id))throw new Error(label+' bevat een dubbele ID: '+r.id+'.');
    seen.add(r.id);
  });
}
function validateBackupRecords(b){
  const cats=b.metadata.categories||[];
  if(cats.includes('players')){
    assertUniqueIds(b.data.players,'Speler');
    b.data.players.forEach((p,i)=>{if(!String(p.name||'').trim())throw new Error('Speler '+(i+1)+' heeft geen naam.');});
  }
  if(cats.includes('sessions')){
    assertUniqueIds(b.data.sessions,'Sessie');
    const availablePlayers=new Set((b.data.players||[]).map(p=>p.id));
    b.data.sessions.forEach((s,si)=>{
      if(!Array.isArray(s.players)||!Array.isArray(s.hands))throw new Error('Sessie '+(si+1)+' heeft geen geldige spelers- of handenlijst.');
      assertUniqueIds(s.players,'Sessiespeler in sessie '+(si+1));
      assertUniqueIds(s.hands,'Hand in sessie '+(si+1));
      const sessionPlayerIds=new Set(s.players.map(p=>p.id));
      s.players.forEach(p=>availablePlayers.add(p.id));
      s.hands.forEach((h,hi)=>{
        if(Object.prototype.hasOwnProperty.call(h,'sessionId')&&String(h.sessionId)!==String(s.id))throw new Error('Hand '+(hi+1)+' in sessie '+(si+1)+' verwijst naar een andere sessie.');
        if(!h.streets||typeof h.streets!=='object'||Array.isArray(h.streets))throw new Error('Hand '+(hi+1)+' in sessie '+(si+1)+' heeft geen geldige actielijst.');
        if(h.villains!==undefined&&!Array.isArray(h.villains))throw new Error('Hand '+(hi+1)+' in sessie '+(si+1)+' heeft geen geldige villainlijst.');
        (h.villains||[]).forEach((v,vi)=>{
          if(!v||typeof v!=='object'||Array.isArray(v))throw new Error('Villain '+(vi+1)+' in hand '+(hi+1)+' is ongeldig.');
          if(v.playerId&&!sessionPlayerIds.has(v.playerId))throw new Error('Villain '+(vi+1)+' in hand '+(hi+1)+' verwijst niet naar een speler in dezelfde sessie.');
        });
      });
    });
  }
}
function validateBackup(b,requireFull=false){
  if(!b||typeof b!=='object'||Array.isArray(b)||!b.metadata||!b.data)throw new Error('Dit bestand is geen geldige Live Poker Handlog-back-up.');
  if(!Number.isInteger(Number(b.metadata.backupVersion))||Number(b.metadata.backupVersion)<1)throw new Error('De back-upversie ontbreekt of is ongeldig.');
  if(!Number.isInteger(Number(b.metadata.schemaVersion))||Number(b.metadata.schemaVersion)<1)throw new Error('De schema-versie ontbreekt of is ongeldig.');
  if(!Array.isArray(b.metadata.categories))throw new Error('De metadata met categorieën ontbreekt.');
  const allowed=['players','sessions','settings'],cats=b.metadata.categories;
  if(!cats.length||cats.some(x=>!allowed.includes(x))||new Set(cats).size!==cats.length)throw new Error('De categorieaanduiding in de back-up is ongeldig.');
  if(Number(b.metadata.backupVersion)>BACKUP_VERSION||Number(b.metadata.schemaVersion)>SCHEMA_VERSION)throw new Error('Deze back-up is gemaakt met een nieuwere, nog niet ondersteunde versie.');
  if(requireFull&&!allowed.every(x=>cats.includes(x)))throw new Error('Voor volledig herstel is een back-up met spelers, sessies én instellingen vereist.');
  if(cats.includes('players')&&!Array.isArray(b.data.players))throw new Error('De spelerscategorie is beschadigd.');
  if(cats.includes('sessions')&&!Array.isArray(b.data.sessions))throw new Error('De sessiecategorie is beschadigd.');
  if(cats.includes('settings')&&(!b.data.settings||typeof b.data.settings!=='object'||Array.isArray(b.data.settings)))throw new Error('De instellingencategorie is beschadigd.');
  if(!cats.includes('players')&&Object.prototype.hasOwnProperty.call(b.data,'players'))throw new Error('De inhoud en categorieaanduiding voor spelers komen niet overeen.');
  if(!cats.includes('sessions')&&Object.prototype.hasOwnProperty.call(b.data,'sessions'))throw new Error('De inhoud en categorieaanduiding voor sessies komen niet overeen.');
  if(!cats.includes('settings')&&Object.prototype.hasOwnProperty.call(b.data,'settings'))throw new Error('De inhoud en categorieaanduiding voor instellingen komen niet overeen.');
  validateBackupRecords(b);

function wzKnownStack(actor){
  const d=UI.draft,s=currentSession(),bb=num(d.bb);
  if(actor==='ik'){
    if(s.type==='cash')return d.heroStackChips!==''?num(d.heroStackChips):null;
    if(d.heroStackChips!==''&&bb)return num(d.heroStackChips)/bb;
    if(d.heroStackBB!=='')return num(d.heroStackBB);
    return null;
  }
  const pos=wzPosOf(actor),v=(d.villains||[]).find(x=>x.pos===pos);
  if(!v)return null;
  if(s.type==='cash')return v.stackChips!==''?num(v.stackChips):null;
  if(v.stackChips!==''&&bb)return num(v.stackChips)/bb;
  if(v.stackBB!=='')return num(v.stackBB);
  return null;
}
function wzUnitToBase(amt,unit,pot){
  if(amt===''||amt==null)return null;
  const d=UI.draft,s=currentSession(),bb=num(d.bb),n=num(amt);
  if(unit==='%')return pot*n/100;
  if(s.type==='cash')return unit==='bb'?n*bb:n;
  return unit==='chips'?(bb?n/bb:null):n;
}




function wzLegalActions(){
  const w=UI.wz,state=wzReplayStreet(w.street),ps=state.actors[w.actor];
  if(!ps||ps.status!=='active')return[];
  const eps=1e-7;
  const toCall=Math.max(0,state.currentBet-ps.contribution),stack=wzStreetStartStack(w.actor,w.street),remaining=stack==null?null:Math.max(0,stack-ps.contribution);
  const out=[];
  if(toCall>eps){
    out.push(['fold','Fold']);
    if(remaining==null||remaining>0)out.push(['call','Call']);
    if(ps.raiseRight&&(remaining==null||remaining>toCall+eps))out.push(['raise','Raise']);
  }else{
    out.push(['check','Check']);
    if(state.currentBet<=eps)out.push(['bet','Bet']);
    else if(ps.raiseRight&&(remaining==null||remaining>0))out.push(['raise','Raise']);
  }

  // All-in is toegestaan als het uitsluitend een call is of wanneer de actor nog raiserechten heeft.
  // Bij een onbekende resterende stack en gesloten raiserechten blijft All-in verborgen om
  // een mogelijk ongeldige raise niet aan te bieden.
  const allInIsCall=remaining!=null&&remaining>0&&remaining<=toCall+eps;
  const allInIsLegalRaise=ps.raiseRight&&(remaining==null||remaining>0);
  if(allInIsCall||allInIsLegalRaise)out.push(['allin','All-in']);

  return out;
}

}

function wzInitialStreetState(st){
  const d=UI.draft,s=currentSession(),actors=wzOrder(st);
  const state={
    street:st,actors:{},currentBet:0,lastFullRaise:0,lastAggressor:null,
    actedSinceRaise:new Set(),pending:[],closed:false
  };
  actors.forEach(a=>state.actors[a]={status:'active',contribution:0,raiseRight:true,acted:false});
  if(st==='pf'){
    const bbValue=s.type==='cash'?num(d.bb):1;
    const sbValue=s.type==='cash'?num(d.sb):(num(d.bb)?num(d.sb)/num(d.bb):0.5);
    const sbActor=wzActor(d.players===2?'BTN/SB':'SB');
    const bbActor=wzActor('BB');
    if(!d.sbNA&&state.actors[sbActor])state.actors[sbActor].contribution=sbValue;
    if(state.actors[bbActor])state.actors[bbActor].contribution=bbValue;
    state.currentBet=bbValue;
    state.lastFullRaise=bbValue; // minimale openingsverhoging vóór vrijwillige actie

    const straddles=handStraddles(s,d);
    straddles.forEach(x=>{
      const actor=wzActor(x.pos);
      const level=s.type==='cash'?num(x.amount):(num(d.bb)?num(x.amount)/num(d.bb):0);
      if(state.actors[actor])state.actors[actor].contribution=level;
      if(level>state.currentBet){
        state.lastFullRaise=level;
        state.currentBet=level;
        state.lastAggressor=actor;
      }
    });
  }
  return state;
}

function wzReplayStreet(st,limit=null){
  const d=UI.draft,state=wzInitialStreetState(st),arr=d.streets[st]||[];
  const max=limit==null?arr.length:Math.max(0,Math.min(limit,arr.length));

  for(let i=0;i<max;i++){
    const a=arr[i],actor=a.pos,ps=state.actors[actor];
    if(!ps||ps.status!=='active')continue;

    const toCall=Math.max(0,state.currentBet-ps.contribution);

    if(a.act==='fold'){
      ps.status='folded';ps.acted=true;state.actedSinceRaise.add(actor);continue;
    }
    if(a.act==='check'){
      ps.acted=true;state.actedSinceRaise.add(actor);continue;
    }
    if(a.act==='call'){
      let add=toCall;
      const stack=wzStreetStartStack(actor,st);
      if(stack!=null)add=Math.min(add,Math.max(0,stack-ps.contribution));
      ps.contribution+=add;ps.acted=true;state.actedSinceRaise.add(actor);
      if(stack!=null&&Math.abs(ps.contribution-stack)<1e-7)ps.status='allin';
      continue;
    }

    if(['bet','raise','allin','jam'].includes(a.act)){
      const stack=wzStreetStartStack(actor,st);
      let target=wzUnitToBase(a.amt,a.unit,analyze(currentSession(),d).potStart?.[st]||0);

      if((a.act==='allin'||a.act==='jam')&&(target==null||target===0)&&stack!=null)target=stack;
      if(target==null){
        ps.status='allin';ps.acted=true;state.actedSinceRaise.add(actor);continue;
      }
      if(stack!=null)target=Math.min(target,stack);

      const previousBet=state.currentBet;
      const raiseSize=Math.max(0,target-previousBet);
      ps.contribution=Math.max(ps.contribution,target);
      ps.acted=true;

      if(target>previousBet+1e-7){
        const requiredIncrement=previousBet<=1e-7
          ? target
          : Math.max(state.lastFullRaise, 0);
        const fullRaise=previousBet<=1e-7 || raiseSize+1e-7>=requiredIncrement;

        if(fullRaise){
          state.lastFullRaise=previousBet<=1e-7?target:raiseSize;
          Object.entries(state.actors).forEach(([x,v])=>{
            if(v.status==='active'&&x!==actor)v.raiseRight=true;
          });
          state.actedSinceRaise=new Set([actor]);
        }else{
          // Korte raise/all-in: spelers die sinds de laatste volledige raise al hebben gehandeld
          Object.entries(state.actors).forEach(([x,v])=>{
            if(v.status==='active'&&state.actedSinceRaise.has(x))v.raiseRight=false;
          });
          state.actedSinceRaise.add(actor);
        }

        state.currentBet=target;
        state.lastAggressor=actor;
      }else{
        state.actedSinceRaise.add(actor);
      }

      if(a.act==='allin'||a.act==='jam'||(stack!=null&&Math.abs(ps.contribution-stack)<1e-7)){
        ps.status='allin';
      }
    }
  }

  const active=Object.entries(state.actors).filter(([,v])=>v.status==='active');
  state.pending=active
    .filter(([,v])=>!v.acted||v.contribution+1e-7<state.currentBet)
    .map(([a])=>a);
  state.closed=state.pending.length===0;
  return state;
}

/* Cross-street stackregistratie: telt een actor se inleg op over alle straten
   tot en met de opgegeven straat, zodat "resterende stack" ook postflop klopt. */
function wzTotalContribution(actor, uptoStreet){
  const order=['pf','flop','turn','river'];
  let total=0;
  for(const st of order){
    const state=wzReplayStreet(st);
    total += state.actors[actor] ? state.actors[actor].contribution : 0;
    if(st===uptoStreet) break;
  }
  return total;
}

/* Fysieke forced-stackdepletie die bewust buiten de reguliere betting commitment blijft.
   SB/BB/straddles zitten al in wzInitialStreetState()/wzTotalContribution(). Alleen de BBA
   is pot-/stackgeld zonder streetcommitment en wordt daarom hier centraal toegevoegd. */
function wzForcedStackDepletion(actor){
  const d=UI.draft,s=currentSession();
  if(s.type==='cash'||!d.bbaEnabled)return 0;
  const bbaActor=wzActor('BB');
  if(actor!==bbaActor)return 0;
  const bb=num(d.bb),ante=num(d.ante);
  return bb>0&&ante>0?ante/bb:0;
}
function wzPhysicalContribution(actor, uptoStreet){
  return wzTotalContribution(actor,uptoStreet)+wzForcedStackDepletion(actor);
}
function wzRemainingStack(actor, street){
  const known=wzKnownStack(actor);
  if(known==null) return null;
  return Math.max(0, known - wzPhysicalContribution(actor, street));
}

/* Stack bij binnenkomst van een straat: reguliere bijdragen uit eerdere straten plus
   fysieke forced-stackdepletie (BBA) worden afgetrokken. BBA blijft buiten streetcommitment. */
function wzStreetStartStack(actor, street){
  const known=wzKnownStack(actor);
  if(known==null) return null;
  const order=['pf','flop','turn','river'];
  const idx=order.indexOf(street);
  const priorStreet=idx>0?order[idx-1]:null;
  const priorInvested=priorStreet?wzTotalContribution(actor,priorStreet):0;
  return Math.max(0, known-priorInvested-wzForcedStackDepletion(actor));
}

}

function wzResumeAfterStructuralEdit(st,index,originalAction=null){
  const d=UI.draft,w=UI.wz,arr=d.streets[st];

  d.streets[st]=arr.slice(0,index);
  w.street=st;
  w.review=st;
  w.order=wzOrder(st).filter(a=>{
    const prior=['pf','flop','turn','river']
      .filter(x=>STREET_INDEX[x]<STREET_INDEX[st])
      .flatMap(x=>d.streets[x]||[]);
    return !prior.some(x=>x.pos===a&&['fold','allin','jam'].includes(x.act));
  });
  w.pending=actor?[actor]:[];
  w.actor=actor||w.order[0]||'';
  w.selected=originalAction?originalAction.act:'';

function wzSave(){
  const s=currentSession(),d=UI.draft,w=UI.wz,dup=wzDuplicateCardErrors();
  if(dup.length){w.error=dup.join(' ');return render()}

  const boardMsg=boardMissingCardsSaveMessage(d,w);
  if(boardMsg){w.error=boardMsg;return render()}

  const v=validateHandFlow(s,d);
  if(v.errors.length){w.error=v.errors.join(' ');return render()}

  d.implicitFolds=v.derived.implicit;
  d.potReliable=!v.derived.unknownAllins.length;
  d.unknownAllInPositions=v.derived.unknownAllins;
  syncHeroStack(d);
  d.villains.forEach(x=>{syncVStack(d,x);updateSessionPlayerFromHand(s,x)});

  const all=Object.values(d.streets).flat();
  const heroFold=all.some(a=>a.pos==='ik'&&a.act==='fold');
  const live=wzAll().filter(a=>!all.some(x=>x.pos===a&&x.act==='fold'));

  if(heroFold){d.outcome='fold';d.winner=''}
  else if(live.length===1&&live[0]==='ik'){d.outcome='win';d.winner='hero'}
  else if(w.editingExisting&&w.winners.length===0&&w.originalOutcome){
    // Behoud een ongewijzigde oudere uitkomst/winnaar wanneer de opgeslagen data
    d.outcome=w.originalOutcome;
    d.winner=w.originalWinner;
  }else{
    if(!w.winners.length){w.error='Selecteer minimaal één winnaar.';return render()}
    if(w.winners.length>1){d.outcome='chop';d.winner='chop'}
    else if(w.winners[0]==='ik'){d.outcome='win';d.winner='hero'}
    else{
      d.outcome='lose';
      const p=wzPosOf(w.winners[0]),vi=d.villains.find(x=>x.pos===p);
      d.winner=vi?vi.id:'pos:'+p;
    }
  }

  d.activeStreet=w.street||d.activeStreet||'pf';
  /* Technische toelichting: registeredAt wordt éénmalig gezet bij de eerste succesvolle definitieve opslag; edits behouden bestaande metadata. */
  const existing=s.hands.find(x=>x.id===d.id);
  if(d.status==='definitive'&&!d.registeredAt&&(!existing||existing.status==='concept'))d.registeredAt=Date.now();
  const i=s.hands.findIndex(x=>x.id===d.id);
  if(i>=0)s.hands[i]=d;else s.hands.unshift(d);
  /* Technische toelichting: handwizard-save behoudt de sessietafel; alleen echte legacyhands zonder activeSeats houden de oude Hero-seat-sync. */
  if(!Array.isArray(d.activeSeats))s.heroSeat=d.heroSeat;
  save();UI.wz=null;go('share',s.id,d.id);
}

function formatChipsRC5(v){
  if(v===''||v==null||String(v).trim()==='')return'';
  const p=parseChipValue(v);if(!p.valid)return String(v??'');const n=p.value;
  const trim=x=>x.toLocaleString('nl-NL',{minimumFractionDigits:0,maximumFractionDigits:2});
  if(Math.abs(n)>=1000000)return trim(n/1000000)+'M';
  if(Math.abs(n)>=1000)return trim(n/1000)+'K';
  return trim(n);
}

function rc7RoundBCurrentPot(street,state){
 const d=UI.draft,s=currentSession();
 const prior=num(analyze(s,d).potStart?.[street]||0);
 const currentContrib=Object.values(state.actors||{}).reduce((sum,p)=>sum+num(p?.contribution||0),0);
 /* Technische toelichting: potStart bevat sinds de huidige potengine preflop de forced bets al.
    Trek daarom alleen de betting-state-basisbijdragen af; zo worden SB/BB/straddles niet dubbel geteld
    en blijft de vrijwillige bijdrage tijdens de lopende straat wel zichtbaar. De BBA zit al in potStart. */
 const initial=wzInitialStreetState(street);
 const initialContrib=Object.values(initial.actors||{}).reduce((sum,p)=>sum+num(p?.contribution||0),0);
 return prior+Math.max(0,currentContrib-initialContrib);
}

function rc7RoundC3IsVoluntaryInvestment(action){

function rc7RoundC3ReportPreflop(actions){
 const voluntarilyInvested=new Set();
 const result=[];
 for(const action of actions||[]){
  if(action?.act==='fold'){

   continue;

  if(rc7RoundC3IsVoluntaryInvestment(action))voluntarilyInvested.add(action.pos);
 }
 return result;
}

 return st==='pf'?'flop':st==='flop'?'turn':st==='turn'?'river':'';
}
function rc7RoundC5RemainingStreets(st){
 if(st==='pf')return['flop','turn','river'];
 if(st==='flop')return['turn','river'];
 if(st==='turn')return['river'];
 return[];
}
function rc7RoundC5ActorRemainingStack(actor,playerState){
 const stack=wzKnownStack(actor);
 if(stack==null)return null;
 return Math.max(0,stack-num(playerState?.contribution||0));
}
function getClosedAllInRunoutState(hand=UI.draft,session=currentSession(),wizardState=UI.wz){
 const triggerStreet=wizardState?.review||wizardState?.street||'pf';
 const remainingStreets=rc7RoundC5RemainingStreets(triggerStreet);
 if(!remainingStreets.length)return{closed:false,triggerStreet,remainingStreets:[],activePlayers:[],playersWhoCanStillBet:[],unknownAllins:[],reason:'no remaining board streets'};
 const state=wzReplayStreet(triggerStreet);
 const entries=Object.entries(state.actors||{});
 const inHand=entries.filter(([,p])=>p.status!=='folded');
 const activePlayers=inHand.map(([a])=>a);
 if(inHand.length<2)return{closed:false,triggerStreet,remainingStreets:[],activePlayers,playersWhoCanStillBet:[],unknownAllins:[],reason:'fewer than two players remain'};
 if(!state.closed)return{closed:false,triggerStreet,remainingStreets:[],activePlayers,playersWhoCanStillBet:[],unknownAllins:[],reason:'current betting round is not closed'};
 const unknownAllins=wzUnknownAllins(triggerStreet);
 if(unknownAllins.length)return{closed:false,triggerStreet,remainingStreets:[],activePlayers,playersWhoCanStillBet:[],unknownAllins,reason:'unknown all-in amount'};
 const allinPlayers=inHand.filter(([,p])=>p.status==='allin').map(([a])=>a);
 if(!allinPlayers.length)return{closed:false,triggerStreet,remainingStreets:[],activePlayers,playersWhoCanStillBet:[],unknownAllins:[],reason:'no all-in player remains'};
 const playersWhoCanStillBet=[];
 for(const [actor,p] of inHand){
  if(p.status!=='active')continue;
  const remaining=rc7RoundC5ActorRemainingStack(actor,p);
  // Onbekende stack is conservatief: deze speler kan mogelijk nog inzetten.
  if(remaining==null||remaining>1e-7)playersWhoCanStillBet.push(actor);
 }
 if(playersWhoCanStillBet.length>1)return{closed:false,triggerStreet,remainingStreets:[],activePlayers,playersWhoCanStillBet,unknownAllins:[],reason:'multiple players can still bet a side pot'};
 return{closed:true,triggerStreet,remainingStreets,activePlayers,playersWhoCanStillBet,unknownAllins:[],reason:'all remaining betting is closed'};
}

}

 return`<div class="overlay" data-runout-picker-close><div class="picker"><div class="rankgrid">${RANKS.map(r=>`<button class="${UI.runoutPickRank===r?'on':''}" ${r!=='?'&&['s','h','d','c'].every(s=>blocked(r+s))?'disabled':''} data-runout-rank="${r}">${r}</button>`).join('')}</div><div class="suitgrid">${['s','h','d','c','?'].map(s=>{const card=UI.runoutPickRank?UI.runoutPickRank+s:'';return`<button class="${sClass(s)}" ${!UI.runoutPickRank||s!=='?'&&UI.runoutPickRank!=='?'&&blocked(card)?'disabled':''} data-runout-suit="${s}"><span>${SUITS[s]}</span></button>`}).join('')}</div><div class="note">Onbekende kaart kan met ? worden gelogd. Een grijze, niet-aantikbare kaart is al elders in deze hand vastgelegd (bijvoorbeeld bij de holecards van Hero of een Villain, of bij een van de board-kaarten).</div><div class="row" style="margin-top:12px"><button class="btn sub small" data-runout-clear>Wis kaart</button><button class="btn sub small" data-runout-picker-close>Sluiten</button></div></div></div>`;
}
function validateRunoutBoard(){
 const w=UI.wz,d=UI.draft,required=rc7RoundC5RequiredIndexes(w.runoutStreets||[]);
 const draft=(w.runoutBoardDraft||[]).slice();
 const errors={};
 for(const i of required)if(!draft[i])errors[i]='Kies deze boardkaart.';
 const known=new Map();
 const addKnown=(card,label)=>{
  if(!card||card.includes('?'))return;
  if(known.has(card))return false;
  known.set(card,label);return true;
 };
 (d.heroCards||[]).forEach(c=>addKnown(c,'Hero-holecards'));
 (d.villains||[]).forEach(v=>(v.cards||[]).forEach(c=>addKnown(c,'bekende villain-holecards')));
 draft.forEach((card,i)=>{
  if(!card||card.includes('?'))return;
  if(known.has(card))errors[i]=`Deze kaart is al gebruikt bij ${known.get(card)}.`;
  else known.set(card,'het board');
 });
 w.runoutErrors=errors;
 if(Object.keys(errors).length){
  w.error='Controleer de gemarkeerde boardkaarten.';
  render();
  requestAnimationFrame(()=>document.querySelector('.wz-runout-card-error')?.scrollIntoView({block:'center',behavior:'smooth'}));
  return false;
 }
 w.error='';
 return true;
}

function d1Checkpoint(){

 let id=step;
 if(step==='action')id=`${street}:action:${actionCount}`;
 else if(step==='review')id=`${review}:review`;
 else if(step==='board')id=`${street}:board`;
 else if(step==='runout')id=`runout:${w.runoutFromStreet||review||street}`;
 else if(step==='finish')id='finish';
 return{
  id,step,street,review,
  actionCount:step==='action'?actionCount:null,
  generation:nav.generation,
  label:step==='action'?`${street.toUpperCase()} · actie ${actionCount+1}`:
        step==='review'?`${review.toUpperCase()} · controle`:
        step==='board'?`${street[0].toUpperCase()+street.slice(1)} · board`:
        step==='runout'?'Volledige runout':

 const cp=d1Checkpoint();if(!cp)return;
 const current=nav.trail[nav.cursor];
 if(d1SameCheckpoint(current,cp))return;
 if(nav.cursor<nav.trail.length-1)nav.trail=nav.trail.slice(0,nav.cursor+1);

function d1OrderForStreet(st){

  for(const a of d.streets[prior]||[])if(['fold','allin','jam'].includes(a.act))unavailable.add(a.pos);

  order=order.filter(a=>!excluded.has(a));

/* D1.1: centrale captureguard vóór alle D1-mutatiehandlers en vóór bubblehandlers. */
function d11HistoricalMutationGuard(event){
 if(!UI.wz||!d1Historical())return false;
 const target=event.target instanceof Element?event.target:null;
 if(!target)return false;

 const allowed=target.closest(
  '[data-historical-command],' +
  '[data-d1-prev],[data-d1-next],[data-d1-begin],[data-d1-end],[data-wz-close],' +
  '[data-d2-edit-here],[data-d2-confirm-branch],[data-d2-cancel-branch],' +
  '.d1-nav-footer'
 );
 if(allowed)return false;

 const mutatingTarget=target.closest(
  'input,select,textarea,button,[data-pick],[data-set-render],[data-path],[contenteditable],[role="button"],form'
 );
 if(!mutatingTarget && !['submit','keydown'].includes(event.type))return false;

 event.preventDefault();
 event.stopImmediatePropagation();
 return true;
}

['click','input','change','keydown','submit'].forEach(type=>{
 document.addEventListener(type,d11HistoricalMutationGuard,true);
});

const wzSaveD2Base=wzSave;
function d23Stable(value){return JSON.stringify(value)}
function d23CommitProof(tx,s,id,beforeRecord,beforeScreen,beforeCount){
 const afterRecord=s?.hands?.[tx.sourceIndex];
 if(!afterRecord||afterRecord.id!==id)return false;
 if((s.hands||[]).length!==beforeCount)return false;

 const expected=deepClone(UI.draft);
 const afterJson=d23Stable(afterRecord);
 const expectedJson=d23Stable(expected);
 if(afterJson!==expectedJson)return false;

 const dirty=d23Stable(tx.original)!==expectedJson;
 const changed=d23Stable(beforeRecord)!==afterJson;
 if(dirty&&!changed)return false;

 const leftEditor=UI.screen&&UI.screen!==beforeScreen;
 return !!leftEditor;
}
wzSave=function(){
 const tx=UI.editTx;
 if(!tx)return wzSaveD2Base();

 const beforeRecord=deepClone(s?.hands?.[tx.sourceIndex]);

 const result=wzSaveD2Base();

 const committed=d23CommitProof(tx,s,id,beforeRecord,beforeScreen,beforeCount);
 if(committed)UI.editTx=null;

 return result;
};

function d26PureClone(value){
 if(value===undefined)return undefined;
 return JSON.parse(JSON.stringify(value));
}
function d26PureEqual(a,b){
 if(Object.is(a,b))return true;
 try{return JSON.stringify(a)===JSON.stringify(b);}catch(_){return false;}
}
function classifyHistoricalEdit(field,before,after,handState){
 const canonical=D26_FIELD_ALIASES[field]||field;
 const rule=D26_FIELD_RULES[canonical];
 const changed=!d26PureEqual(before,after);
 const safeState=d26PureClone(handState);
 if(!rule){
  return{
   field,
   canonicalField:canonical,
   knownField:false,
   hasChanged:changed,
   impactClass:'C',
   requiresConfirmation:changed,
   firstAffectedCheckpoint:null,
   affectedActions:'unknown',
   affectedBoard:'unknown',
   affectedResult:true,
   validationMode:'unknown-conservative',
   special:null,
   message:'Onbekend veld: conservatief als Klasse C behandelen.',
   shadow:true,
   handStateUsed:!!safeState
  };
 }
 let impactClass=rule.impactClass;
 let validationMode=impactClass==='A'?'report':
                    impactClass==='B'?'cards-result':
                    rule.dynamic==='startstack'?'dynamic-startstack':'rebuild-replay';
 if(rule.special==='pot-override')validationMode='pot-override-heavy-validation';
 return{
  field,
  canonicalField:canonical,
  knownField:true,
  hasChanged:changed,
  impactClass,
  requiresConfirmation:changed&&impactClass==='C',
  firstAffectedCheckpoint:rule.checkpoint||null,
  affectedActions:rule.actions===undefined?false:rule.actions,
  affectedBoard:rule.board===undefined?false:rule.board,
  affectedResult:!!rule.result,
  validationMode,
  dynamicAnalysis:rule.dynamic||null,
  special:rule.special||null,
  message:changed?rule.message:'Geen inhoudelijke wijziging.',
  shadow:true,
  handStateUsed:!!safeState
 };
}


const D26_CARD_GROUP_RANK=Object.freeze({
 hero:10,
 villain1:20,
 villain2:30,
 villain:40,
 flop:50,
 turn:60,
 river:70
});

function d26NormalizeCardCode(card){
 if(card==null)return'';
 return String(card).trim().toUpperCase();
}
function d26CardGroupDescriptor(raw){
 const group=raw&&typeof raw==='object'?raw:{};
 const type=String(group.type||'').trim();
 const index=Number.isFinite(Number(group.index))?Number(group.index):null;
 let key='';
 let rank=999;
 let label='Onbekende kaartgroep';
 if(type==='hero'){
  key='hero';rank=D26_CARD_GROUP_RANK.hero;label='Hero';
 }else if(type==='villain'&&index===1){
  key='villain1';rank=D26_CARD_GROUP_RANK.villain1;label='Villain 1';
 }else if(type==='villain'&&index===2){
  key='villain2';rank=D26_CARD_GROUP_RANK.villain2;label='Villain 2';
 }else if(type==='villain'&&index!=null&&index>=3){
  key=`villain:${index}`;rank=D26_CARD_GROUP_RANK.villain+index;label=`Villain ${index}`;
 }else if(type==='flop'){
  key='flop';rank=D26_CARD_GROUP_RANK.flop;label='Flop';
 }else if(type==='turn'){
  key='turn';rank=D26_CARD_GROUP_RANK.turn;label='Turn';
 }else if(type==='river'){
  key='river';rank=D26_CARD_GROUP_RANK.river;label='River';
 }
 return Object.freeze({type,index,key,rank,label});
}
function d26CompareCardGroups(a,b){
 const ga=d26CardGroupDescriptor(a),gb=d26CardGroupDescriptor(b);
 if(ga.rank!==gb.rank)return ga.rank-gb.rank;
 return ga.key.localeCompare(gb.key);
}
function d26CardLocationKey(location){
 const loc=location&&typeof location==='object'?location:{};
 const group=d26CardGroupDescriptor(loc.group);
 const slot=Number.isFinite(Number(loc.slot))?Number(loc.slot):0;
 return `${group.key}#${slot}`;
}
function d26PureCardSnapshot(value){
 if(value===undefined)return undefined;
 return JSON.parse(JSON.stringify(value));
}

/*
 Input:
 {
   card,
   source:{group:{type,index?},slot},
   placements:[{card,group:{type,index?},slot}],
   explicitUserEdit:boolean,
   trigger:'picker'|'open'|'render'|'navigation'|'import'|'migration'|'replay'
 }

 Output action:
 - accept: kaart is vrij
 - accept-same-slot: zelfde kaart staat al in dezelfde slot
 - accept-nonphysical: onbekende ?-kaart; geen fysieke duplicaatcontrole
 - block-earlier-owner: latere groep probeert kaart uit eerdere groep te kiezen
 - displace-later-owner: eerdere groep kiest kaart uit latere groep; latere kaartlocatie vrijmaken
 - block-same-group: kaart staat al in andere slot binnen dezelfde groep
 - no-op-passive: geen mutatiebesluit buiten expliciete user edit
 */
function decideCardDisplacement(input){
 const safe=d26PureCardSnapshot(input)||{};
 const card=d26NormalizeCardCode(safe.card);
 const source=safe.source||{};
 const sourceGroup=d26CardGroupDescriptor(source.group);
 const sourceKey=d26CardLocationKey(source);
 const placements=Array.isArray(safe.placements)?safe.placements:[];
 const explicit=safe.explicitUserEdit===true;
 const passiveTriggers=new Set(['open','render','navigation','import','migration','replay']);

 if(!explicit||passiveTriggers.has(String(safe.trigger||''))){
  return{
   action:'no-op-passive',
   allowed:false,
   card,
   source:sourceKey,
   displacements:[],
   message:'Geen kaartwijziging uitgevoerd buiten een expliciete gebruikersbewerking.',
   shadow:true
  };
 }
 if(!card||!sourceGroup.key){
  return{
   action:'invalid-input',
   allowed:false,
   card,
   source:sourceKey,
   displacements:[],
   message:'Ongeldige kaart of kaartgroep.',
   shadow:true
  };
 }
 if(card.includes('?')){
  return{
   action:'accept-nonphysical',
   allowed:true,
   card,
   source:sourceKey,
   displacements:[],
   message:'Onbekende kaart kan worden vastgelegd zonder fysieke-kaartduplicaatcontrole.',
   shadow:true
  };
 }

 const matches=placements
  .map((p,order)=>({
   order,
   card:d26NormalizeCardCode(p.card),
   group:d26CardGroupDescriptor(p.group),
   slot:Number.isFinite(Number(p.slot))?Number(p.slot):0,
   locationKey:d26CardLocationKey(p)
  }))
  .filter(p=>p.card===card)
  .sort((a,b)=>d26CompareCardGroups(
    {type:a.group.type,index:a.group.index},
    {type:b.group.type,index:b.group.index}
  )||a.slot-b.slot||a.order-b.order);

 if(matches.some(m=>m.locationKey===sourceKey)){
  return{
   action:'accept-same-slot',
   allowed:true,
   card,
   source:sourceKey,
   displacements:[],
   message:'De kaart staat al op deze locatie.',
   shadow:true
  };
 }

 const sameGroup=matches.find(m=>m.group.key===sourceGroup.key);
 if(sameGroup){
  return{
   action:'block-same-group',
   allowed:false,
   card,
   source:sourceKey,
   owner:sameGroup.locationKey,
   ownerLabel:`${sameGroup.group.label}, kaart ${sameGroup.slot}`,
   displacements:[],
   message:`${card} is binnen ${sourceGroup.label} al gekozen.`,
   shadow:true
  };
 }

 const earlier=matches.find(m=>m.group.rank<sourceGroup.rank);
 if(earlier){
  return{
   action:'block-earlier-owner',
   allowed:false,
   card,
   source:sourceKey,
   owner:earlier.locationKey,
   ownerLabel:`${earlier.group.label}, kaart ${earlier.slot}`,
   displacements:[],
   message:`${card} staat al bij ${earlier.group.label}. Een latere kaartgroep mag een eerdere kaart niet verdringen.`,
   shadow:true
  };
 }

 const later=matches.filter(m=>m.group.rank>sourceGroup.rank);
 if(later.length){
  return{
   action:'displace-later-owner',
   allowed:true,
   card,
   source:sourceKey,
   displacements:later.map(m=>({
    locationKey:m.locationKey,
    groupKey:m.group.key,
    groupLabel:m.group.label,
    slot:m.slot,
    card
   })),
   message:`${card} wordt bij ${later.map(m=>`${m.group.label}, kaart ${m.slot}`).join(' en ')} verwijderd.`,
   shadow:true
  };
 }

 return{
  action:'accept',
  allowed:true,
  card,
  source:sourceKey,
  displacements:[],
  message:'Kaart kan worden gekozen.',
  shadow:true
 };
}


function d26PathToCardLocation(path){
 const p=String(path||'').split('.');
 if(p[0]==='hero')return{group:{type:'hero'},slot:+p[1]+1,path};
 if(p[0]==='v')return{group:{type:'villain',index:+p[1]+1},slot:+p[2]+1,path};
 if(p[0]==='board'){
  const i=+p[1];
  if(i<3)return{group:{type:'flop'},slot:i+1,path};
  if(i===3)return{group:{type:'turn'},slot:1,path};
  if(i===4)return{group:{type:'river'},slot:1,path};
 }
 return{group:{type:'unknown'},slot:0,path};
}
function d26BoardIndexToLocation(index,pathPrefix='board'){
 const i=Number(index);
 const path=`${pathPrefix}.${i}`;
 if(i<3)return{group:{type:'flop'},slot:i+1,path};
 if(i===3)return{group:{type:'turn'},slot:1,path};
 if(i===4)return{group:{type:'river'},slot:1,path};
 return{group:{type:'unknown'},slot:0,path};
}
function d26CollectCardPlacements(draft,boardOverride){
 const d=draft||{};
 const placements=[];
 (d.heroCards||[]).forEach((card,i)=>placements.push({...d26PathToCardLocation(`hero.${i}`),card}));
 (d.villains||[]).forEach((v,vi)=>(v.cards||[]).forEach((card,ci)=>placements.push({...d26PathToCardLocation(`v.${vi}.${ci}`),card})));
 const board=Array.isArray(boardOverride)?boardOverride:(d.board||[]);
 board.forEach((card,i)=>placements.push({...d26BoardIndexToLocation(i),card}));
 return placements;
}
function d26DecisionForPath(path,card,boardOverride){
 return decideCardDisplacement({
  card,
  source:d26PathToCardLocation(path),
  placements:d26CollectCardPlacements(UI.draft,boardOverride),
  explicitUserEdit:true,
  trigger:'picker'
 });
}
function d26CardChoiceBlocked(path,card){
 if(!card||String(card).includes('?'))return false;
 const decision=d26DecisionForPath(path,card);
 return decision.action==='block-earlier-owner'||decision.action==='block-same-group'||decision.action==='invalid-input';
}
function d26LocationKeyToPath(locationKey){
 const [groupKey,slotText]=String(locationKey||'').split('#');
 const slot=Math.max(1,Number(slotText)||1);
 if(groupKey==='hero')return`hero.${slot-1}`;
 if(groupKey==='flop')return`board.${slot-1}`;
 if(groupKey==='turn')return'board.3';
 if(groupKey==='river')return'board.4';
 if(groupKey==='villain1')return`v.0.${slot-1}`;
 if(groupKey==='villain2')return`v.1.${slot-1}`;
 if(groupKey.startsWith('villain:'))return`v.${Math.max(0,Number(groupKey.split(':')[1])-1)}.${slot-1}`;
 return'';
}
function d26ClearCardPath(path,boardTarget){
 const p=String(path||'').split('.');
 if(p[0]==='hero'&&UI.draft?.heroCards)UI.draft.heroCards[+p[1]]=null;
 else if(p[0]==='v'&&UI.draft?.villains?.[+p[1]]?.cards)UI.draft.villains[+p[1]].cards[+p[2]]=null;
 else if(p[0]==='board'){
  const target=Array.isArray(boardTarget)?boardTarget:UI.draft?.board;
  if(target)target[+p[1]]=null;
 }
}
function d26ApplyDecisionDisplacements(decision,boardTarget){
 for(const displacement of decision.displacements||[]){
  const path=d26LocationKeyToPath(displacement.locationKey);
  if(path)d26ClearCardPath(path,boardTarget);
 }
}
function d26ApplyExplicitCardChoice(path,card){
 const decision=d26DecisionForPath(path,card);
 if(!decision.allowed){
  /* Technische toelichting: dubbele-kaartvalidatie staat rood en lokaal in de kaartpicker; de defensieve beslislogica blijft ongewijzigd. */
  const msg=['block-earlier-owner','block-same-group'].includes(decision.action)?'Dezelfde kaart is meer dan één keer ingevuld.':decision.message;
  inlineFeedback(document.querySelector('.picker'),msg);return false;
 }
 d26ApplyDecisionDisplacements(decision);setCard(path,card);
 if(decision.action==='displace-later-owner')inlineFeedback(document.querySelector('.picker'),decision.message,'warn');
 return true;
}
function d26RunoutPath(index){return`board.${Number(index)}`;}
function d26RunoutDecision(index,card){
 const board=UI.wz?.runoutBoardDraft||UI.draft?.board||[];
 return d26DecisionForPath(d26RunoutPath(index),card,board);
}
function d26RunoutCardChoiceBlocked(index,card){
 if(!card||String(card).includes('?'))return false;
 const decision=d26RunoutDecision(index,card);
 return decision.action==='block-earlier-owner'||decision.action==='block-same-group'||decision.action==='invalid-input';
}
function d26ApplyExplicitRunoutCardChoice(index,card){
 const w=UI.wz;
 if(!w||!Array.isArray(w.runoutBoardDraft))return false;
 const decision=d26RunoutDecision(index,card);
 if(!decision.allowed){
  const msg=['block-earlier-owner','block-same-group'].includes(decision.action)?'Dezelfde kaart is meer dan één keer ingevuld.':decision.message;
  inlineFeedback(document.querySelector('.picker'),msg);return false;
 }
 d26ApplyDecisionDisplacements(decision,w.runoutBoardDraft);w.runoutBoardDraft[Number(index)]=card;
 if(decision.action==='displace-later-owner')inlineFeedback(document.querySelector('.picker'),decision.message,'warn');
 return true;
}

function d26ClassAGeneration(){

function d26ApplyClassAEdit(field,before,after,applyMutation){

function d26ApplyClassBPotOverride(){
 if(!UI.editTx||!UI.draft)return false;
 const s=currentSession(),state=d26PotOverrideEditorState(),beforeHand=deepClone(UI.draft);
 const validation=d26ValidateHeavyPotOverride({session:s,hand:beforeHand,rawValue:state.raw});
 if(!validation.allowed){state.error=validation.errors?.[0]||'Controleer en bevestig eerst de handmatig ingevoerde pot.';render();return false}
 if(validation.action==='accept-no-change'){
  state.error='';UI.wz.d26InlineBPot=null;render();return false;
 }
 if(validation.requiresExtremeAcknowledgement&&state.ackExtreme!==true){
  state.error='Controleer en bevestig eerst de handmatig ingevoerde pot.';render();return false;
 }
 const predicted=d26ApplyPotOverrideToHand(beforeHand,validation.normalized);
 if(!predicted.allowed)return false
 const assessment=assessClassBEdit({
  field:'manualPotOverride',
  before:JSON.stringify(d26PotOverrideSnapshot(beforeHand)),
  after:JSON.stringify(d26PotOverrideSnapshot(predicted.hand)),
  handBefore:beforeHand,
  handAfter:predicted.hand,
  explicitUserEdit:true,
  trigger:'historical-pot-override',
  heavyPotValidationPassed:validation.allowed===true&&(!validation.requiresExtremeAcknowledgement||state.ackExtreme===true)
 });
 if(!assessment.allowed)return false
 const actionsBefore=d26ClassBActionsFingerprint(beforeHand);
 const nonPotBefore=d26ClassBNonPotFingerprint(beforeHand);
 const generationBefore=d26ClassAGeneration();
 try{
  UI.draft=deepClone(predicted.hand);
  if(d26ClassBActionsFingerprint(UI.draft)!==actionsBefore)throw new Error('actions-changed');
  if(d26ClassBNonPotFingerprint(UI.draft)!==nonPotBefore)throw new Error('non-pot-state-changed');
  if(d26ClassAGeneration()!==generationBefore)throw new Error('generation-changed');
  UI.editTx.working=UI.draft;UI.editTx.dirty=d2IsDirty();
  UI.wz.d26ClassBPotConfirm={beforeHand,afterHand:deepClone(UI.draft),assessment,validation,predicted};
  return true;
 }catch(_){
  UI.draft=deepClone(beforeHand);UI.editTx.working=UI.draft;UI.editTx.dirty=d2IsDirty();
  
  return false;
 }
}

function d26PrepareHistoricalSaveState(){
 const tx=UI.editTx,w=UI.wz,d=UI.draft;
 if(!tx||!w||!d)return false;

 /* De D2-working-copy opent vanaf setup en had niet altijd de legacy
    savecontext voor een reeds afgeronde hand. Zonder deze context kan
    wzSave() ten onrechte opnieuw om een winnaar vragen. */
 w.editingExisting=true;
 w.originalOutcome=w.originalOutcome||d.outcome||tx.original?.outcome||'';
 w.originalWinner=w.originalWinner||d.winner||tx.original?.winner||'';

 if(!Array.isArray(w.winners))w.winners=[];
 if(!w.winners.length){
  const derived=wzWinnersFromHand(d);
  if(Array.isArray(derived)&&derived.length)w.winners=derived;
 }
 return true;
}

d26SaveHistoricalEditTransaction=function(){
 if(!UI.editTx||!UI.wz||!UI.draft)return false;
 if(d26HistoricalEditHasPendingConfirmation()){
  UI.wz.error='Rond eerst de openstaande bevestiging af.';render();return false;
 }

 const tx=UI.editTx;
 const sid=UI.sid;
 const w=UI.wz,d=UI.draft;
 const snapshot={
  street:w.street,
  review:w.review,
  closePrompt:w.closePrompt,
  navigation:deepClone(w.navigation),
  activeStreet:d.activeStreet,
  error:w.error
 };
 const storedActive=d.activeStreet||w.street||'pf';

 d26PrepareHistoricalSaveState();

 /* wzSave() mag de tijdelijke previewstraat niet als nieuwe handstraat opslaan. */
 w.street=storedActive;
 w.review=storedActive;
 w.closePrompt=false;
 w.error='';

 wzSave();

 const committed=!UI.editTx;
 if(committed){
  /* wzSave() verlaat naar share; historische edit sluit bewust terug naar sessie. */
  UI.wz=null;
  UI.draft=null;
  UI.hid=null;
  go('session',sid);
  toast('Wijzigingen opgeslagen.');
  return true;
 }

 if(UI.wz&&UI.draft){
  UI.wz.street=snapshot.street;
  UI.wz.review=snapshot.review;
  UI.wz.closePrompt=snapshot.closePrompt;
  UI.wz.navigation=deepClone(snapshot.navigation);
  UI.draft.activeStreet=snapshot.activeStreet;
  if(!UI.wz.error)UI.wz.error=snapshot.error||'De wijzigingen konden niet worden opgeslagen.';
  UI.editTx.working=UI.draft;
  UI.editTx.dirty=d2IsDirty();
  render();
 }
 return false;
};

function rc7F4ParseBountyCount(raw){
 const value=String(raw??'').trim();
 if(value==='')return{valid:true,empty:true,value:''};
 if(!/^\d+(?:[.,]\d{1,2})?$/.test(value))return{valid:false,empty:false,value:null};
 const n=Number(value.replace(',','.'));
 return{valid:Number.isFinite(n)&&n>=0,empty:false,value:n};
}
function rc7F4NormalizeCount(value){
 if(value===''||value==null)return'';
 return String(Math.round(Number(value)*100)/100).replace('.',',');
}

d26ResultLiveActors=function(hand){
 /* Technische toelichting: De resultaatresolver baseerde chopkandidaten alleen op Hero + geregistreerde Villains. Voeg ontbrekende live tafelposities toe via de reeds ondersteunde canonieke `pos:<positie>`-identiteit; folds uit acties én preflop-prefix blijven uitgesloten. */
 const d=hand||{},folded=d26ClassBFoldedPositions(d),actors=[],errors=[];
 (d.preflopPrefix?.foldedPositions||[]).forEach(pos=>folded.add(String(pos)));
 const seenActors=new Set(),seenCanonical=new Set();
 const push=c=>{
  if(!c.actor||!c.canonical)return;
  if(seenActors.has(c.actor)||seenCanonical.has(String(c.canonical)))return;
  seenActors.add(c.actor);seenCanonical.add(String(c.canonical));actors.push(c);
 };
 const heroPos=String(d.heroPos||'').trim();
 if(heroPos&&!folded.has('ik')&&!folded.has(heroPos)){
  push({actor:'ik',label:`${heroPos} (Ik)`,canonical:'hero',position:heroPos,villainIndex:null,id:'',playerId:''});
 }
 (d.villains||[]).forEach((v,i)=>{
  const pos=String(v.pos||'').trim();
  if(!pos||folded.has(pos))return;
  const actor=d26ResultActorForPosition(d,pos);
  const canonical=String(v.id||v.playerId||`pos:${pos}`);
  const name=String(v.name||'').trim();
  push({
   actor,
   label:name?`${pos} (${name})`:pos,
   canonical,
   position:pos,
   villainIndex:i,
   id:String(v.id||''),
   playerId:String(v.playerId||'')
  });
 });
 Object.values(d.positionBySeat||{}).forEach(value=>{
  const pos=String(value||'').trim();
  if(!pos||pos===heroPos||folded.has(pos))return;
  const actor=d26ResultActorForPosition(d,pos);
  if(!actor||actor==='ik')return;
  push({actor,label:pos,canonical:`pos:${pos}`,position:pos,villainIndex:null,id:'',playerId:''});
 });
 return{actors,errors};
};

function f65ShareProjection(hand){

/* Technische toelichting: vaste eerste straddle is sessieconfiguratie → levert geen dubbele invoer tijdens handregistratie. */
regularStraddleRows=function(s,h){
  const max=Math.max(0,Number(h.players||9)-2);
  if(s.type!=='cash'||h.straddleType!=='regular'||max===0)return[];
  const count=Math.max(1,Math.min(Number(h.straddleCount)||1,max)),pos=straddlePositions(h),out=[];
  let prev=num(h.bb);
  for(let i=0;i<count;i++){
    const open=i===0?!!s.firstStraddleOpen:!!s.reStraddleOpen;
    let amount=0;
    if(open)amount=num(h.straddleAmounts[i]);
    else if(i===0)amount=num(s.firstStraddleFixed);
    else amount=prev>0?prev*2:0;
    out.push({pos:pos[i]||('UTG+'+i),amount,open,index:i});
    prev=amount;
  }
  return out;
}

const v272SaveSessionBase=saveSession;
saveSession=function(){
 const d=UI.draft;
 if(d?.type==='cash'){
   if(num(d.sb)<=0||num(d.bb)<=0){UI.sessionError='Vul SB en BB in.';return render()}

v27Config=function(){

 if(Number(d.players)>max)d.players=max;

v271HandStraddleConfig=function(){
 const d=UI.draft,s=currentSession(),max=Math.max(0,Number(d.players)-2);
 if(!(s.straddleEnabled||s.btnStraddleEnabled))return'';
 let h=`<div class="v271-hand-straddle"><div class="v271-hand-straddle-title">Straddle deze hand</div><div class="seg"><button class="${!d.straddleType?'on':''}" data-set-render="h.straddleType:">Geen</button>${s.straddleEnabled?`<button class="${d.straddleType==='regular'?'on':''}" data-set-render="h.straddleType:regular" ${max?'':'disabled'}>Regulier</button>`:''}${s.btnStraddleEnabled?`<button class="${d.straddleType==='btn'?'on':''}" data-set-render="h.straddleType:btn">BTN</button>`:''}</div>`;
 if(d.straddleType==='regular'&&max){
   h+=`<label>Aantal straddles</label><select data-path-render="h.straddleCount">${Array.from({length:max},(_,i)=>i+1).map(n=>`<option value="${n}" ${Number(d.straddleCount)===n?'selected':''}>${n}</option>`).join('')}</select>`;
   h+=regularStraddleRows(s,d).map(x=>x.open?`<label>${x.pos} bedrag</label><input class="straddle-amount" data-straddle-amt="${x.index}" data-chip="1" value="${esc(chipDisplay(d.straddleAmounts[x.index]||''))}">`:`<div class="v272-readonly-context">${esc(x.pos)}: <b>${esc(money(s,x.amount))}</b></div>`).join('');
   if(!s.firstStraddleOpen&&num(s.firstStraddleFixed)<=0)h+=`<div class="wz-field-error">Vul eerst in de sessie-instellingen een vaste eerste straddle in.</div>`;
 }
 if(d.straddleType==='btn')h+=s.btnStraddleOpen?`<label>BTN-straddle bedrag</label><input class="straddle-amount" data-straddle-amt="0" data-chip="1" value="${esc(chipDisplay(d.straddleAmounts[0]||''))}">`:num(s.btnStraddleFixed)>0?`<div class="v272-readonly-context">Vaste BTN-straddle: <b>${esc(money(s,s.btnStraddleFixed))}</b></div>`:`<div class="wz-field-error">Vul eerst in de sessie-instellingen een vaste BTN-straddle in.</div>`;
 return h+'</div>';
}

let livePokerUpdateCandidate=null;
let livePokerUpdateRequested=false;

function hideLivePokerUpdateNotice(){
  const notice=document.getElementById('pwaUpdateNotice');
  if(notice)notice.hidden=true;
}

function showLivePokerUpdateNotice(candidate){
  if(!candidate||!candidate.worker)return;
  livePokerUpdateCandidate=candidate;

  let notice=document.getElementById('pwaUpdateNotice');
  if(!notice){
    notice=document.createElement('div');
    notice.id='pwaUpdateNotice';
    notice.className='pwaUpdateNotice';
    notice.setAttribute('role','status');
    notice.setAttribute('aria-live','polite');
    notice.innerHTML=`
      <div class="pwaUpdateTitle">Nieuwe versie beschikbaar</div>
      <div class="pwaUpdateText">Live Poker Handlog kan worden bijgewerkt. Je huidige lokale pokerdata blijft staan. De update wordt pas uitgevoerd nadat je op Nu bijwerken tikt.</div>
      <div class="pwaUpdateActions">
        <button type="button" class="pwaUpdateLater" id="pwaUpdateLater">Later bijwerken</button>
        <button type="button" class="pwaUpdateNow" id="pwaUpdateNow">Nu bijwerken</button>
      </div>`;
    document.body.appendChild(notice);
    notice.querySelector('#pwaUpdateLater').addEventListener('click',hideLivePokerUpdateNotice);
    notice.querySelector('#pwaUpdateNow').addEventListener('click',installLivePokerUpdate);
  }
  notice.hidden=false;
}

async function fetchLivePokerUpdateMetadata(){
  try{
    const response=await fetch('./pwa-update.json?ts='+Date.now(),{cache:'no-store'});
    if(!response.ok)return null;
    const data=await response.json();
    if(!data||typeof data.versionId!=='string'||typeof data.worker!=='string')return null;
    return data;
  }catch(e){
    return null;
  }
}

async function checkLivePokerUpdate(){
  const candidate=await fetchLivePokerUpdateMetadata();
  if(!candidate||candidate.versionId===PWA_VERSION_ID)return;
  showLivePokerUpdateNotice(candidate);
}

function activateWaitingLivePokerWorker(registration,button){
  const waiting=registration.waiting;
  if(!waiting)return false;
  livePokerUpdateRequested=true;
  if(button){
    button.disabled=true;
    button.textContent='Bijwerken…';
  }
  waiting.postMessage({type:'SKIP_WAITING'});
  return true;
}

async function installLivePokerUpdate(){
  const candidate=livePokerUpdateCandidate;
  if(!candidate||!candidate.worker)return;

  const notice=document.getElementById('pwaUpdateNotice');
  const button=notice&&notice.querySelector('#pwaUpdateNow');
  if(button){
    button.disabled=true;
    button.textContent='Voorbereiden…';
  }

  try{
    /* De kandidaat-service-worker wordt bewust pas hier geregistreerd.
       Zolang de gebruiker 'Later bijwerken' kiest, bestaat er dus geen
       nieuwe waiting worker die na het sluiten van de app vanzelf kan activeren. */
    const registration=await navigator.serviceWorker.register(candidate.worker,{
      scope:'./',
      updateViaCache:'none'
    });

    if(activateWaitingLivePokerWorker(registration,button))return;

    const installing=registration.installing;
    if(!installing){
      if(button){
        button.disabled=false;
        button.textContent='Nu bijwerken';
      }
      return;
    }

    installing.addEventListener('statechange',()=>{
      if(installing.state==='installed'){
        activateWaitingLivePokerWorker(registration,button);
      }else if(installing.state==='redundant'&&button){
        button.disabled=false;
        button.textContent='Nu bijwerken';
      }
    });
  }catch(e){
    console.warn('PWA-update installeren mislukt:',e);
    if(button){
      button.disabled=false;
      button.textContent='Nu bijwerken';
    }
  }
}

function registerLivePokerHandlogServiceWorker(){
  if(!('serviceWorker' in navigator))return;
  let reloadingForUpdate=false;

  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(livePokerUpdateRequested&&!reloadingForUpdate){
      reloadingForUpdate=true;
      location.reload();
    }
  });

  window.addEventListener('load',async()=>{
    try{
      
      let registration=await navigator.serviceWorker.getRegistration('./');

      
      if(!registration){
        registration=await navigator.serviceWorker.register('./service-worker-v2.9.1-pwa-1.js',{
          scope:'./',
          updateViaCache:'none'
        });
      }

      await checkLivePokerUpdate();
    }catch(e){
      console.warn('Service worker registratie/updatecontrole mislukt:',e);
    }
  },{once:true});
}
registerLivePokerHandlogServiceWorker();

 const tpl=document.createElement('template');tpl.innerHTML=html;
 /* Technische toelichting: Sessiescherm toont tafelgrootte en seat/positie-uitleg niet meer; sessie bewerken blijft de configuratieroute. */
 const tableLabel=[...tpl.content.querySelectorAll('label')].find(x=>x.textContent.trim()==='Standaard tafelgrootte');
 if(tableLabel){const wrap=tableLabel.parentElement;wrap?.remove()}
 tpl.content.querySelectorAll('.v274-session-helper').forEach(x=>x.remove());
 [...tpl.content.querySelectorAll('.note')].forEach(x=>{const t=x.textContent.trim();if(t==='Seat is de fysieke stoel aan tafel. Positie in de hand kies je per hand.'||t==='Seat = fysieke stoel. Positie kies je per hand.')x.remove()});
 const headings=[...tpl.content.querySelectorAll('h2')],heading=headings.find(x=>x.textContent.trim()==='Handen');if(!heading)return tpl.innerHTML;
 let node=heading.nextSibling;while(node){const next=node.nextSibling;node.remove();node=next}
 const total=(sess.hands||[]).length,visible=sortedHands(sess,filteredHands(sess));
 if(total){const active=b41HandFilterActive(sess.id);heading.insertAdjacentHTML('afterend',`<div class="b4-utils"><div class="b4-utils-left"><button class="b4-util" data-act="b4ToggleHandFilter">${b4FilterIcon()}<span>Filter${active?' ('+visible.length+')':''}</span></button><button class="b4-util" data-act="b4ToggleHandSort">${b4SortIcon()}<span>Sorteren</span></button></div><div class="b4-count">${visible.length} van ${total} handen</div></div>${UI.handFilterPanelSid===sess.id?b4HandFilterPanel(sess):''}${UI.handSortPanelSid===sess.id?b4HandSortPanel(sess):''}`)}
 if(!total){heading.insertAdjacentHTML('afterend','<div class="empty">Nog geen handen.</div>');return tpl.innerHTML}
 if(!visible.length){heading.insertAdjacentHTML('beforeend','');const holder=document.createElement('div');holder.className='empty';holder.innerHTML='Geen handen gevonden met deze filters.<div class="b4-empty-action"><button class="btn sub small" data-act="b4ResetHandFilters">Alle filters wissen</button></div>';tpl.content.append(holder);return tpl.innerHTML}
 visible.forEach(x=>{const cards=b41ListCardsHTML(x.heroCards||[]),concept=x.status==='concept',emoji={win:'✅',lose:'❌',chop:'🤝',fold:'🏳️'}[x.outcome]||'';const card=document.createElement('div');card.className='list';card.innerHTML=`<div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><div data-open-share="${x.id}" role="button" tabindex="0" aria-label="Opgeslagen hand openen" style="flex:1"><div class="t">${concept?'<span class="pill concept-pill">Concept</span> ':''}${emoji} ${esc(x.heroPos||'Onvoltooid')} · ${cards}</div><div class="s">${b4HandDateTimeText(x)}${x.heroStackBB?' · '+fmtBB(x.heroStackBB):''}${x.runoutFrom?' · runout vanaf '+esc(x.runoutFrom):''}</div></div><button class="btn sub small" data-edit="${x.id}">✎</button><button class="btn danger small" data-delete-hand="${x.id}">${UI.confirm==='hand'+x.id?'Zeker?':'×'}</button></div>`;tpl.content.append(card)});
 return tpl.innerHTML
};


/* Technische toelichting: Eén canonieke sessietafelbron (heroSeat + session.players[].seat + inactiveSeats),
   één handsnapshot activeSeats en één fysieke active-seat-positieafleiding. */
const b43Style=document.createElement('style');b43Style.textContent=`
.b43-table-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.b43-table-actions .wide{grid-column:1/-1}
.b43-seat-detail{margin-top:10px}.b43-seat-detail h3{margin:0 0 8px;font-size:.9rem}.b43-seat-state{font-size:.82rem;color:var(--muted);margin-bottom:9px}
.b43-seat-actions{display:grid;gap:7px}.b43-seat-actions .btn{margin:0}.wz-seat.b43-session-inactive,.wz-seat.b43-hand-inactive{opacity:.42!important;filter:saturate(.35)}
.wz-seat.b43-session-inactive span,.wz-seat.b43-hand-inactive span{font-weight:800}.b43-config-row{margin:9px 0;padding:9px;border:1px solid var(--line);border-radius:11px;background:var(--surface3)}
.b43-active-summary{font-size:.8rem;color:var(--muted);margin-top:6px}.b43-table-layout-title{margin:0 0 8px}.b43-table-layout-note{font-size:.76rem;color:var(--muted);margin-bottom:8px}
`;document.head.appendChild(b43Style);

function b43Seats(tableSeats){return Array.from({length:Math.max(2,Math.min(10,Number(tableSeats)||9))},(_,i)=>String(i+1))}
function b43NormalizeSessionTable(s){
 if(!s)return s;const valid=new Set(b43Seats(s.tableSeats));s.inactiveSeats=[...new Set((s.inactiveSeats||[]).map(String).filter(x=>valid.has(x)))];const inactive=new Set(s.inactiveSeats);
 if(!valid.has(String(s.heroSeat||''))||inactive.has(String(s.heroSeat||'')))s.heroSeat='';
 const used=new Set();(s.players||[]).forEach(p=>{const seat=String(p.seat||'');if(!valid.has(seat)||inactive.has(seat)||seat===String(s.heroSeat)||used.has(seat))p.seat='';else{p.seat=seat;used.add(seat)}});return s
}
function b43SessionSeatState(s,seat){seat=String(seat);b43NormalizeSessionTable(s);if((s.inactiveSeats||[]).map(String).includes(seat))return{kind:'inactive',label:'Inactief'};if(String(s.heroSeat||'')===seat)return{kind:'hero',label:'Hero'};const p=(s.players||[]).find(x=>String(x.seat||'')===seat);if(p)return{kind:'villain',label:p.name||'Villain',player:p};return{kind:'anonymous',label:'Niemand'}}
function b43SessionActiveSeats(s){b43NormalizeSessionTable(s);const off=new Set((s.inactiveSeats||[]).map(String));return b43Seats(s.tableSeats).filter(x=>!off.has(x))}
function b43SessionTableConfigured(s){if(!s)return false;b43NormalizeSessionTable(s);return b43SessionActiveSeats(s).length>=2&&(!!s.heroSeat||(s.players||[]).some(p=>p.seat)||(s.inactiveSeats||[]).length>0)}
function b43HandActiveSeats(h,s){
 const physical=b43Seats(h?.tableSeats||s?.tableSeats);
 if(Array.isArray(h?.activeSeats)&&h.activeSeats.length)return h.activeSeats.map(String).filter(x=>physical.includes(x));
 const mapped=Object.keys(h?.positionBySeat||{}).map(String).filter(x=>physical.includes(x));
 if(mapped.length)return[...new Set(mapped)].sort((a,b)=>Number(a)-Number(b));
 const n=Math.max(2,Math.min(physical.length,Number(h?.players)||physical.length));
 const occupied=[String(h?.heroSeat||''),...(h?.villains||[]).map(v=>String(v?.seat||''))].filter(x=>physical.includes(x));
 const out=[...new Set(occupied)];for(const seat of physical){if(out.length>=n)break;if(!out.includes(seat))out.push(seat)}
 return out.sort((a,b)=>Number(a)-Number(b))
}
function b43AssignPositionsFromButton(activeSeats,buttonSeat){const active=[...new Set((activeSeats||[]).map(String))].sort((a,b)=>Number(a)-Number(b)),b=String(buttonSeat||''),ix=active.indexOf(b);if(ix<0)return{};const rotated=[...active.slice(ix),...active.slice(0,ix)],pos=wzPos(active.length),out={};rotated.forEach((seat,i)=>out[seat]=pos[i]);return out}
function b43SyncHandPositions(d){if(!d)return;const active=new Set(b43HandActiveSeats(d,currentSession()));d.players=active.size;if(d.buttonSeat&&!active.has(String(d.buttonSeat)))d.buttonSeat='';d.positionBySeat=d.buttonSeat?b43AssignPositionsFromButton([...active],d.buttonSeat):{};d.heroPos=d.heroSeat&&active.has(String(d.heroSeat))?(d.positionBySeat[d.heroSeat]||''):'';(d.villains||[]).forEach(v=>{v.pos=v.seat&&active.has(String(v.seat))?(d.positionBySeat[v.seat]||''):''})}
function b43HeroAuto(d){return !!(d?.useSessionTable&&d.heroSeat&&b43HandActiveSeats(d,currentSession()).includes(String(d.heroSeat)))}
function b43SessionVillainRecord(p){return{id:uid(),playerId:p.id,name:p.name||'',seat:String(p.seat),pos:'',stackMode:'chips',stackBB:'',stackChips:'',cards:[null,null],note:'',b43SessionLinked:true}}
function b43ApplySessionTableChoice(d,s,use){d.useSessionTable=!!use;d.tableSeats=Number(s.tableSeats)||9;d.buttonSeat='';d.positionBySeat={};d.preflopPrefix=null;if(use){/* Technische toelichting: handsetup leest een genormaliseerde sessiekopie en muteert nooit de sessietafel. */const snap=b43NormalizeSessionTable(deepClone(s));d.sessionInactiveSeats=[...(snap.inactiveSeats||[])].map(String);d.activeSeats=b43SessionActiveSeats(snap);d.heroSeat=d.activeSeats.includes(String(snap.heroSeat||''))?String(snap.heroSeat):'';d.villains=(snap.players||[]).filter(p=>p.seat&&d.activeSeats.includes(String(p.seat))).map(b43SessionVillainRecord)}else{d.sessionInactiveSeats=[];d.activeSeats=b43Seats(s.tableSeats);d.heroSeat='';d.heroPos='';d.villains=[]}d.players=d.activeSeats.length;b43SyncHandPositions(d)}
function b43InitNewHandTable(d,s){const use=b43SessionTableConfigured(s);b43ApplySessionTableChoice(d,s,use);if(UI.wz){UI.wz.b43SeatDetail='';UI.wz.b43SeatManager=false}}
function b43SetUseSessionTable(use){if(!UI.draft||!UI.wz)return;b43ApplySessionTableChoice(UI.draft,currentSession(),use);UI.wz.error='';render()}
function b43HandSetSeatActive(seat,active){const d=UI.draft,s=currentSession();seat=String(seat);if(d.useSessionTable&&(d.sessionInactiveSeats||[]).includes(seat)&&active)return false;const a=new Set(b43HandActiveSeats(d,s));if(active)a.add(seat);else{if(String(d.heroSeat)===seat||a.size<=2)return false;a.delete(seat)}d.activeSeats=[...a].sort((x,y)=>Number(x)-Number(y));if(!active)(d.villains||[]).forEach(v=>{if(String(v.seat)===seat)v.b43HandInactive=true});else(d.villains||[]).forEach(v=>{if(String(v.seat)===seat)delete v.b43HandInactive});b43SyncHandPositions(d);return true}
function b43HandSeatState(d,seat){seat=String(seat);if(d.useSessionTable&&(d.sessionInactiveSeats||[]).includes(seat))return{kind:'sessionInactive',label:'Inactief'};if(!b43HandActiveSeats(d,currentSession()).includes(seat))return{kind:'handInactive',label:'Inactief'};if(String(d.heroSeat||'')===seat)return{kind:'hero',label:'Hero'};const v=(d.villains||[]).find(x=>String(x.seat||'')===seat&&!x.b43HandInactive);if(v)return{kind:'villain',label:v.name||'Villain',villain:v};return{kind:'anonymous',label:'Niemand'}}
function b43TableButtons(model,mode){const count=Number(model.tableSeats)||9,coords=rc8SeatGeometry(count);return coords.map((q,i)=>{const seat=String(i+1),st=model.state(seat),active=!['inactive','sessionInactive','handInactive'].includes(st.kind),pos=model.positionBySeat?.[seat]||'',selected=String(model.selected||'')===seat;let cl='wz-seat';if(st.kind==='hero')cl+=' hero';if(st.kind==='villain')cl+=' v27-villain';if(pos==='SB')cl+=' sb';if(pos==='BB')cl+=' bb';if(!active)cl+=st.kind==='sessionInactive'?' b43-session-inactive':' b43-hand-inactive';if(selected)cl+=' v27-selected';const text=!active?'Inactief':(mode==='session'||mode==='button')?`Seat ${seat}`:(pos||`Seat ${seat}`),sub=active?(st.kind==='hero'?'Ik':st.kind==='villain'?st.label:''):'',dealer=model.buttonSeat&&String(model.buttonSeat)===seat?'<span class="v27-dealer-dot">D</span>':'';return`<button type="button" class="${cl}" style="left:${q.x}px;top:${q.y}px" ${model.data}="${seat}" ${model.disable?.(seat,st)?'disabled':''}>${dealer}<span>${esc(text)}</span>${sub?`<small>${esc(sub.length>12?sub.slice(0,11)+'…':sub)}</small>`:''}</button>`}).join('')}
function b43TableVisual(model,mode='hand'){const seats=b43TableButtons(model,mode),tags=model.tags||'';requestAnimationFrame(()=>{rc8ObserveTableVisuals();requestAnimationFrame(rc8FitAllTableVisuals)});return`<div class="wz-tablebox"><div class="wz-table-stage"><div class="wz-table"><div class="wz-dealer">${rc4DealerLetters()}</div></div>${seats}${tags}</div></div>`}
function b43HandVisual(mode){const d=UI.draft,w=UI.wz,firstEligible=mode==='first'?new Set(wzEligibleFirstActors()):null,currentVillain=Number.isInteger(w?.v27VillainIndex)?d.villains[w.v27VillainIndex]:null;let selected=mode==='button'?d.buttonSeat:mode==='hero'?d.heroSeat:w?.b43SeatDetail;if(mode==='first'&&w?.first){selected=Object.keys(d.positionBySeat||{}).find(seat=>wzActor(d.positionBySeat[seat])===w.first)||''}if(mode==='villain'&&currentVillain)selected=currentVillain.seat;return b43TableVisual({tableSeats:d.tableSeats||currentSession()?.tableSeats,state:seat=>b43HandSeatState(d,seat),positionBySeat:d.positionBySeat,selected,buttonSeat:d.buttonSeat,tags:mode==='button'?'':wzTags(),data:'data-v27-seat',disable:(seat,st)=>{if(['sessionInactive','handInactive'].includes(st.kind))return true;if(mode==='button')return false;if(mode==='hero')return st.kind==='villain';if(mode==='villain'){if(String(seat)===String(d.heroSeat))return true;const v=(d.villains||[]).find(x=>String(x.seat)===String(seat));return !!(v&&v!==currentVillain)}if(mode==='first'){const pos=d.positionBySeat?.[seat],actor=pos?wzActor(pos):'';return !firstEligible?.has(actor)}return false}},mode)}
v27Table=function(mode){return v273ApplyHeroBadge(b43HandVisual(mode))}
function v272TableHasInactive(){const d=UI.draft;return b43HandActiveSeats(d,currentSession()).length<Number(d.tableSeats||currentSession()?.tableSeats||9)}

function b43SessionTxState(seat){const tx=UI.sessionTableTx,seatS=String(seat);if((tx.inactiveSeats||[]).includes(seatS))return{kind:'inactive',label:'Inactief'};if(String(tx.heroSeat||'')===seatS)return{kind:'hero',label:'Hero'};const p=(tx.players||[]).find(x=>String(x.seat||'')===seatS);if(p)return{kind:'villain',label:p.name||'Villain',player:p};return{kind:'anonymous',label:'Niemand'}}
function b43OpenSessionTable(){const s=currentSession();if(!s)return;b43NormalizeSessionTable(s);UI.sessionTableTx={sid:s.id,tableSeats:Number(s.tableSeats)||9,heroSeat:String(s.heroSeat||''),inactiveSeats:[...(s.inactiveSeats||[])].map(String),players:deepClone(s.players||[]),pendingLibraryPlayers:[],seatDetail:''};UI.screen='tableLayout';render()}
function b43SessionSeatOpen(seat){if(!UI.sessionTableTx)return;UI.sessionTableTx.seatDetail=String(seat);render()}
function b43SessionMoveHero(seat){const tx=UI.sessionTableTx;seat=String(seat);tx.inactiveSeats=tx.inactiveSeats.filter(x=>x!==seat);tx.players.forEach(p=>{if(String(p.seat)===seat)p.seat=''});tx.heroSeat=seat;render()}
function b43SessionAssignPlayer(seat,player){const tx=UI.sessionTableTx;seat=String(seat);tx.inactiveSeats=tx.inactiveSeats.filter(x=>x!==seat);if(String(tx.heroSeat)===seat)tx.heroSeat='';tx.players.forEach(p=>{if(String(p.seat)===seat||String(p.id)===String(player.id))p.seat=''});let p=tx.players.find(x=>String(x.id)===String(player.id));if(!p){p={id:player.id,name:player.name||'',notes:'',seat:''};tx.players.push(p)}p.seat=seat;render()}
function b43SessionTableAction(act){const tx=UI.sessionTableTx;if(!tx)return;const seat=String(tx.seatDetail||'');if(act==='cancel'){UI.sessionTableTx=null;UI.screen='session';return render()}if(act==='done'){if(b43Seats(tx.tableSeats).filter(x=>!tx.inactiveSeats.includes(x)).length<2){tx.error='Minimaal twee seats moeten actief blijven.';return render()}const s=DB.sessions.find(x=>x.id===tx.sid);if(!s)return;s.heroSeat=tx.heroSeat;s.inactiveSeats=[...tx.inactiveSeats];s.players=deepClone(tx.players);(tx.pendingLibraryPlayers||[]).forEach(p=>{if(!(DB.playerLibrary||[]).some(x=>String(x.id)===String(p.id))&&!libraryNameExists(p.name))DB.playerLibrary.push({id:p.id,name:p.name,notes:p.notes||'',lastUsed:null})});b43NormalizeSessionTable(s);UI.sessionTableTx=null;UI.screen='session';save();return render()}if(act==='clearAll'){tx.heroSeat='';tx.players.forEach(p=>p.seat='');tx.seatDetail='';return render()}if(!seat)return;if(act==='hero')return b43SessionMoveHero(seat);if(act==='villain'){UI.f6PickerTarget={kind:'sessionTable',seat,search:''};return render()}if(act==='empty'){if(String(tx.heroSeat)===seat)tx.heroSeat='';tx.players.forEach(p=>{if(String(p.seat)===seat)p.seat=''});tx.inactiveSeats=tx.inactiveSeats.filter(x=>x!==seat);return render()}if(act==='inactive'){if(String(tx.heroSeat)===seat)tx.heroSeat='';tx.players.forEach(p=>{if(String(p.seat)===seat)p.seat=''});if(!tx.inactiveSeats.includes(seat))tx.inactiveSeats.push(seat);return render()}if(act==='active'){tx.inactiveSeats=tx.inactiveSeats.filter(x=>x!==seat);return render()}}
function b43SessionTableDetail(){const tx=UI.sessionTableTx;if(!tx?.seatDetail)return'';const st=b43SessionTxState(tx.seatDetail),seat=tx.seatDetail;let acts=[];if(st.kind==='anonymous')acts=[['hero','Hero toevoegen'],['villain','Villain toevoegen'],['inactive','Inactief maken']];if(st.kind==='hero')acts=[['villain','Villain toevoegen'],['empty','Leeg maken'],['inactive','Inactief maken']];if(st.kind==='villain')acts=[['hero','Hero toevoegen'],['villain','Villain toevoegen'],['empty','Leeg maken'],['inactive','Inactief maken']];if(st.kind==='inactive')acts=[['active','Actief maken'],['hero','Hero toevoegen'],['villain','Villain toevoegen']];return`<div class="subpanel b43-seat-detail"><h3>Seat ${seat} gevuld door: ${esc(st.label)}</h3><div class="wz-section-title">Wijzig seat</div><div class="b43-seat-actions">${acts.map(([a,l])=>`<button class="btn sub" data-b43-table-action="${a}">${l}</button>`).join('')}</div></div>`}
function b43SessionTableScreen(){const tx=UI.sessionTableTx,s=tx&&DB.sessions.find(x=>x.id===tx.sid);if(!tx||!s)return rSession();const visual=b43TableVisual({tableSeats:tx.tableSeats,state:b43SessionTxState,positionBySeat:{},selected:tx.seatDetail,data:'data-b43-session-seat'},'session');return`<div class="top"><h1 class="b43-table-layout-title">Tafelindeling</h1></div><div class="panel"><div class="b43-table-layout-note">Tik op een seat om de actuele sessietafel aan te passen.</div>${tx.error?`<div class="wz-error">${esc(tx.error)}</div>`:''}${visual}${b43SessionTableDetail()}<div class="b43-table-actions"><button class="btn sub wide" data-b43-table-action="clearAll">Tafel leegmaken</button><button class="btn sub" data-b43-table-action="cancel">Annuleren</button><button class="btn" data-b43-table-action="done">Gereed</button></div></div>`}

/* Gedeelde f6PlayerPicker: dezelfde resultatenbron/rendering, met parametriseerbare commit-target. */
function f6Target(){if(UI.f6PickerTarget)return UI.f6PickerTarget;if(UI.wz?.f6PlayerPickerFor!=null)return{kind:'wizard',index:UI.wz.f6PlayerPickerFor,search:UI.wz.f6PlayerSearch||''};return null}

function f6TargetCurrent(){const t=f6Target();if(!t)return null;if(t.kind==='wizard')return UI.draft?.villains?.[t.index]||null;if(t.kind==='sessionTable')return b43SessionTxState(t.seat)?.player||null;if(t.kind==='handSeat')return null;return null}
f6PlayerPickerResultsHTML=function(){const t=f6Target();if(!t)return'';const current=f6TargetCurrent(),pid=String(current?.playerId||current?.id||''),q=nameKey(t.search||''),players=f6TargetPlayers(),matches=n=>!q||nameKey(n).includes(q);let used=new Set();if(t.kind==='wizard')used=new Set((UI.draft?.villains||[]).filter((x,i)=>i!==t.index&&x.playerId).map(x=>String(x.playerId)));if(t.kind==='sessionTable')used=new Set((UI.sessionTableTx?.players||[]).filter(p=>p.seat&&String(p.seat)!==String(t.seat)).map(p=>String(p.id)));if(t.kind==='handSeat')used=new Set((UI.draft?.villains||[]).filter(v=>v.playerId&&String(v.seat)!==String(t.seat)).map(v=>String(v.playerId)));const session=players.filter(p=>matches(p.name||'')).map(p=>`<button type="button" class="f6-player-row ${pid===String(p.id)?'on':''}" ${used.has(String(p.id))?'disabled':''} data-f6-player-pick="session:${p.id}">${esc(p.name||'Naamloos')} · sessie</button>`).join('');const ids=new Set(players.map(p=>String(p.id))),library=(DB.playerLibrary||[]).filter(p=>!ids.has(String(p.id))&&matches(p.name||'')).map(p=>`<button type="button" class="f6-player-row" ${used.has(String(p.id))?'disabled':''} data-f6-player-pick="library:${p.id}">${esc(p.name||'Naamloos')} · bibliotheek</button>`).join('');const newName=String(t.search||'').trim(),newRows=t.kind!=='wizard'&&newName?`<div class="f6-player-group-label">Nieuwe speler</div><button type="button" class="f6-player-row f6-player-row-bold" data-f6-player-pick="new">${esc(newName)} · nieuw in sessie</button><button type="button" class="f6-player-row" data-f6-player-pick="newlib">${esc(newName)} · nieuw + bibliotheek</button>`:'';return`${(t.kind==='wizard'||t.kind==='handLink')?`<button type="button" class="f6-player-row f6-player-row-bold ${!pid?'on':''}" data-f6-player-pick="unknown">Naamloze Villain</button>`:''}${session?`<div class="f6-player-group-label">Spelers in deze sessie</div>${session}`:''}${library?`<div class="f6-player-group-label">Spelersbibliotheek</div>${library}`:''}${newRows}${!session&&!library&&!newRows?'<div class="note" style="padding:12px 4px">Geen spelers gevonden.</div>':''}`}

elected.name||'',notes:'',seat:''})}UI.f6PickerTarget=null;return render()}UI.f6PickerTarget=null;render()}
