function toBase(a,s,bb,pot){if(a.amt===''||a.amt==null)return null;const n=num(a.amt);if(a.unit==='%')return pot*n/100;if(a.unit==='chips')return bb?n/bb:null;return n}
function actorStackBase(s,h,who){
  const bb=num(h.bb);
  if(who==='ik'){
    if(s.type==='cash')return h.heroStackChips!==''?num(h.heroStackChips):null;
    if(h.heroStackBB!=='')return num(h.heroStackBB);
    if(h.heroStackChips!==''&&bb)return num(h.heroStackChips)/bb;
    return null;
  }
  const villains=h.villains||[];
  const exact=villains.find(x=>x.pos===who);
  const v=exact||(villains.length===1?villains[0]:null);
  if(!v)return null;
  if(s.type==='cash')return v.stackChips!==''?num(v.stackChips):null;
  if(v.stackBB!=='')return num(v.stackBB);
  if(v.stackChips!==''&&bb)return num(v.stackChips)/bb;
  return null;
}
function analyze(s,h){
  const cash=s.type==='cash',bb=num(h.bb),sb=cash?num(h.sb):(bb?num(h.sb)/bb:0.5),BB=cash?num(h.bb):1,ante=(!cash&&bb)?num(h.ante)/bb:0;
  let inv={},unknown=false,callAllIn={};
  const put=(p,x)=>{inv[p]=(inv[p]||0)+Math.max(0,x)};
  const take=(p,x)=>{inv[p]=(inv[p]||0)-Math.max(0,x);if(inv[p]<0.000001)inv[p]=0};
  const remaining=p=>{const st=actorStackBase(s,h,p);return st==null?null:Math.max(0,st-(inv[p]||0))};
  const actorForPos=p=>p===h.heroPos?'ik':p;
  const handActors=()=>{const set=new Set(['ik']);(h.villains||[]).forEach(v=>{if(v.pos)set.add(v.pos)});Object.values(h.streets||{}).forEach(arr=>(arr||[]).forEach(a=>{if(a.pos)set.add(a.pos)}));return set};
  let res={potStart:{},finalPot:0,heroInvested:0,unknown:false,callAllIn};
  STREETS.forEach(([k])=>{
    let streetIn={},voluntaryLevel={},cur=0,lastAgg=null,lastAggBefore=0;
    res.potStart[k]=Object.values(inv).reduce((a,b)=>a+b,0);
    if(k==='pf'){
      const sbPos=h.players===2?'BTN/SB':'SB',bbPos='BB';
      const postForced=(pos,amount)=>{if(amount<=0)return;const actor=actorForPos(pos);streetIn[actor]=(streetIn[actor]||0)+amount;put(actor,amount)};
      postForced(sbPos,sb);
      postForced(bbPos,BB);
      /* Het ingevoerde antebedrag wordt behandeld als één big-blind ante. */
      if(ante>0){const anteActor=actorForPos(bbPos);put(anteActor,ante);}
      cur=BB;
      handStraddles(s,h).forEach(st=>{
        const actor=actorForPos(st.pos);
        streetIn[actor]=(streetIn[actor]||0)+st.amount;
        put(actor,st.amount);
        cur=Math.max(cur,st.amount);
      });
    }
    (h.streets[k]||[]).forEach((a,idx)=>{
      const who=a.pos;
      if(a.act==='fold'||a.act==='check')return;

      if(a.act==='call'){
        const rem=remaining(who);
        let need;
        if(a.amt!==''&&a.amt!=null){
          const explicit=toBase(a,s,bb,Object.values(inv).reduce((x,y)=>x+y,0));
          need=Math.max(0,explicit==null?0:explicit);
        }else{
          need=Math.max(0,cur-(streetIn[who]||0));
        }
        if(rem!=null)need=Math.min(need,rem);
        streetIn[who]=(streetIn[who]||0)+need;
        put(who,need);
        voluntaryLevel[who]=Math.max(voluntaryLevel[who]||0,streetIn[who]||0);
        if(rem!=null&&need>0&&Math.abs(need-rem)<0.000001)callAllIn[k+':'+idx]=true;
        return;
      }

      if(['bet','raise','allin','jam'].includes(a.act)){
        const potNow=Object.values(inv).reduce((x,y)=>x+y,0);
        let to=toBase(a,s,bb,potNow),prev=streetIn[who]||0,rem=remaining(who);
        if((a.act==='allin'||a.act==='jam')&&(a.amt===''||a.amt==null)){
          if(rem==null){unknown=true;return}
          to=prev+rem;
        }
        if(to!=null){
          let need=Math.max(0,to-prev);
          if(rem!=null)need=Math.min(need,rem);
          to=prev+need;
          streetIn[who]=to;
          put(who,need);
          voluntaryLevel[who]=Math.max(voluntaryLevel[who]||0,to);

          if(to>cur+0.000001){
            lastAgg=who;
            lastAggBefore=prev;
            cur=to;
          }
        }
      }
    });

    if(lastAgg){
      const highestVoluntaryOther=Math.max(
        0,
        ...Object.entries(voluntaryLevel)
          .filter(([player])=>player!==lastAgg)
          .map(([,level])=>level)
      );
      const matchedLevel=Math.max(lastAggBefore,highestVoluntaryOther);
      const returned=Math.max(0,(streetIn[lastAgg]||0)-matchedLevel);
      if(returned>0)take(lastAgg,returned);
    }
  });
  res.finalPot=Object.values(inv).reduce((a,b)=>a+b,0);
  res.heroInvested=inv.ik||0;
  res.unknown=unknown;
  return res;
}
function fmtPot(x,s){x=num(x);if(s.type==='cash')return cur(s)+chipDisplay(x);return fmtBB(x)}

function streetText(s,h,k,n,short=false,a=null){a=a||analyze(s,h);const b=k==='flop'?h.board.slice(0,3):k==='turn'?[h.board[3]]:k==='river'?[h.board[4]]:[];const board=b.filter(Boolean).map(cardTxt).join('');const acts=h.streets[k]||[];const runFrom=h.runoutFrom;const runActive=runFrom&&STREET_INDEX[k]>STREET_INDEX[runFrom];if(runActive){return board?`${n} (${board})`:''}if(!acts.length&&!board)return'';let line=(short?({pf:'PF',flop:'F',turn:'T',river:'R'}[k]||n):n)+(board?' ('+board+')':'');if(k!=='pf'&&a.potStart[k]>0&&!runActive)line+=' [pot '+fmtPot(a.potStart[k],s)+']';if(!acts.length)return line;const allChecks=acts.length>0&&acts.every(x=>x.act==='check');if(allChecks){line+=': '+(acts.length>2?(short?'x/x':'all check'):acts.map(x=>short?'x':x.pos+' check').join(', '));return line}const mShort={fold:'f',check:'x',call:'c',bet:'b',raise:'r',allin:'AI',jam:'jam'};function actTxt(x,i){const who=(x.pos==='ik'?'ik':x.pos),amt=amtTxt(x,s),isCallAllIn=!!a.callAllIn[k+':'+i];if(short){const m=mShort[x.act]||x.act;return who+' '+m+(x.act==='call'&&isCallAllIn?' (all-in)':'')+(amt&&!['fold','check','call'].includes(x.act)?amt:'')}const hero=x.pos==='ik';const subj=hero?'ik':x.pos;if(x.act==='fold')return subj+(hero?' fold':' foldt');if(x.act==='check')return subj+(hero?' check':' checkt');if(x.act==='call')return subj+(hero?' call':' callt')+(amt?' '+amt:'')+(isCallAllIn?' (all-in)':'');if(x.act==='allin')return subj+(hero?' ga all-in voor':' gaat all-in voor')+(amt?' '+amt:'');if(x.act==='jam')return subj+(hero?' jam voor':' jamt voor')+(amt?' '+amt:'');if(x.act==='raise')return subj+(hero?' raise naar':' raist naar')+(amt?' '+amt:'');if(x.act==='bet'){let t=subj+' bet';if(amt)t+=' '+amt+(x.unit==='%'?' pot':'');return t}return subj+' '+x.act+(amt?' '+amt:'')}line+=': '+acts.map((x,i)=>actTxt(x,i)).join(', ');return line}
function showdownLines(s,h,a){

  const winner=h.outcome==='win'?'hero':(h.outcome==='lose'?h.winner:(h.outcome==='chop'?'chop':''));
  const potTxt=pot>0?fmtPot(pot,s):'';

const IMG_COL={s:'#F2F5FA',h:'#FF7B7F',d:'#7FAAFF',c:'#7FE0A7',x:'#B9C2CE'};
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function renderReportCanvas(txt){const dpr=2,padX=28,padY=26,fs=27,lh=Math.round(fs*1.45),font=fs+'px ui-monospace, SFMono-Regular, Menlo, monospace';const meas=document.createElement('canvas').getContext('2d');meas.font=font;const lines=txt.split('\n');let maxW=0;lines.forEach(l=>maxW=Math.max(maxW,meas.measureText(l).width));const W=Math.ceil(maxW+padX*2),H=Math.ceil(lines.length*lh+padY*2);const cv=document.createElement('canvas');cv.width=W*dpr;cv.height=H*dpr;const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);ctx.fillStyle='#0b141a';ctx.fillRect(0,0,W,H);ctx.fillStyle='#134d37';roundRect(ctx,10,10,W-20,H-20,16);ctx.fill();ctx.font=font;ctx.textBaseline='top';const seqRe=/(?<![A-Za-z0-9])(?:[AKQJTX2-9][shdcx])+(?![A-Za-z0-9])/g,cardRe=/([AKQJTX2-9])([shdcx])/g;lines.forEach((line,li)=>{let x=padX,y=padY+li*lh,last=0,m;while((m=seqRe.exec(line))){if(m.index>last){const t=line.slice(last,m.index);ctx.fillStyle='#E9EDF2';ctx.fillText(t,x,y);x+=ctx.measureText(t).width}let cm;cardRe.lastIndex=0;while((cm=cardRe.exec(m[0]))){const t=cm[0];ctx.fillStyle=IMG_COL[cm[2]]||'#E9EDF2';ctx.fillText(t,x,y);x+=ctx.measureText(t).width}last=m.index+m[0].length}if(last<line.length){const t=line.slice(last);ctx.fillStyle='#E9EDF2';ctx.fillText(t,x,y)}});return cv}
async function shareImage(){const s=currentSession(),h=s.hands.find(x=>x.id===UI.hid),txt=shareText(s,h),cv=renderReportCanvas(txt);const blob=await new Promise(r=>cv.toBlob(r,'image/png'));const file=new File([blob],'poker-hand-'+(h.date||'')+'.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'Poker hand'});return}catch(e){if(e&&e.name==='AbortError')return}}const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=file.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('Afbeelding gemaakt ✔')}

function assertUniqueIds(records,label){
  const seen=new Set();
  records.forEach((r,i)=>{
    if(!r||typeof r!=='object'||Array.isArray(r))throw new Error(label+' '+(i+1)+' is geen geldig record.');
    if(!String(r.id||'').trim())throw new Error(label+' '+(i+1)+' heeft geen geldige ID.');
    if(seen.has(r.id))throw new Error(label+' bevat een dubbele ID: '+r.id+'.');
    seen.add(r.id);
  });
}
function validateBackupRecords(b){
  const cats=b.metadata.categories||[];
  if(cats.includes('players')){
    assertUniqueIds(b.data.players,'Speler');
    b.data.players.forEach((p,i)=>{if(!String(p.name||'').trim())throw new Error('Speler '+(i+1)+' heeft geen naam.');});
  }
  if(cats.includes('sessions')){
    assertUniqueIds(b.data.sessions,'Sessie');
    const availablePlayers=new Set((b.data.players||[]).map(p=>p.id));
    b.data.sessions.forEach((s,si)=>{
      if(!Array.isArray(s.players)||!Array.isArray(s.hands))throw new Error('Sessie '+(si+1)+' heeft geen geldige spelers- of handenlijst.');
      assertUniqueIds(s.players,'Sessiespeler in sessie '+(si+1));
      assertUniqueIds(s.hands,'Hand in sessie '+(si+1));
      const sessionPlayerIds=new Set(s.players.map(p=>p.id));
      s.players.forEach(p=>availablePlayers.add(p.id));
      s.hands.forEach((h,hi)=>{
        if(Object.prototype.hasOwnProperty.call(h,'sessionId')&&String(h.sessionId)!==String(s.id))throw new Error('Hand '+(hi+1)+' in sessie '+(si+1)+' verwijst naar een andere sessie.');
        if(!h.streets||typeof h.streets!=='object'||Array.isArray(h.streets))throw new Error('Hand '+(hi+1)+' in sessie '+(si+1)+' heeft geen geldige actielijst.');
        if(h.villains!==undefined&&!Array.isArray(h.villains))throw new Error('Hand '+(hi+1)+' in sessie '+(si+1)+' heeft geen geldige villainlijst.');
        (h.villains||[]).forEach((v,vi)=>{
          if(!v||typeof v!=='object'||Array.isArray(v))throw new Error('Villain '+(vi+1)+' in hand '+(hi+1)+' is ongeldig.');
          if(v.playerId&&!sessionPlayerIds.has(v.playerId))throw new Error('Villain '+(vi+1)+' in hand '+(hi+1)+' verwijst niet naar een speler in dezelfde sessie.');
        });
      });
    });
  }
}
function validateBackup(b,requireFull=false){

  if(!Number.isInteger(Number(b.metadata.backupVersion))||Number(b.metadata.backupVersion)<1)throw new Error('De back-upversie ontbreekt of is ongeldig.');
  if(!Number.isInteger(Number(b.metadata.schemaVersion))||Number(b.metadata.schemaVersion)<1)throw new Error('De schema-versie ontbreekt of is ongeldig.');
  if(!Array.isArray(b.metadata.categories))throw new Error('De metadata met categorieën ontbreekt.');
  const allowed=['players','sessions','settings'],cats=b.metadata.categories;
  if(!cats.length||cats.some(x=>!allowed.includes(x))||new Set(cats).size!==cats.length)throw new Error('De categorieaanduiding in de back-up is ongeldig.');
  if(Number(b.metadata.backupVersion)>BACKUP_VERSION||Number(b.metadata.schemaVersion)>SCHEMA_VERSION)throw new Error('Deze back-up is gemaakt met een nieuwere, nog niet ondersteunde versie.');
  if(requireFull&&!allowed.every(x=>cats.includes(x)))throw new Error('Voor volledig herstel is een back-up met spelers, sessies én instellingen vereist.');
  if(cats.includes('players')&&!Array.isArray(b.data.players))throw new Error('De spelerscategorie is beschadigd.');
  if(cats.includes('sessions')&&!Array.isArray(b.data.sessions))throw new Error('De sessiecategorie is beschadigd.');
  if(cats.includes('settings')&&(!b.data.settings||typeof b.data.settings!=='object'||Array.isArray(b.data.settings)))throw new Error('De instellingencategorie is beschadigd.');
  if(!cats.includes('players')&&Object.prototype.hasOwnProperty.call(b.data,'players'))throw new Error('De inhoud en categorieaanduiding voor spelers komen niet overeen.');
  if(!cats.includes('sessions')&&Object.prototype.hasOwnProperty.call(b.data,'sessions'))throw new Error('De inhoud en categorieaanduiding voor sessies komen niet overeen.');
  if(!cats.includes('settings')&&Object.prototype.hasOwnProperty.call(b.data,'settings'))throw new Error('De inhoud en categorieaanduiding voor instellingen komen niet overeen.');

  return true;
}

    ${safety?`<div class="safety-meta"><b>Laatste kopie</b><div class="note">${esc(safetySummary(safety))}</div></div><button class="btn sub" data-download-safety="1">Veiligheidskopie downloaden</button><button class="btn gold" data-restore-safety="1">Vorige gegevens herstellen</button>`:`<div class="note">Er is nog geen interne veiligheidskopie. Die wordt automatisch gemaakt voordat je gegevens vervangt of herstelt.</div>`}
  </div>
  <div class="panel"><div class="note">Bij <b>Vervangen</b> maakt de app eerst een veiligheidskopie van je huidige gegevens. Daarna controleert de app het importbestand volledig. Je gegevens worden pas aangepast als die controle is geslaagd.</div></div>`;
}
function rRecovery(){return`<div class="recovery"><div class="top"><h1>Herstelmodus</h1></div><div class="panel"><div class="status-error"><b>De normale gegevens konden niet worden geopend.</b></div><div class="note">${esc(RECOVERY_REASON)}</div><button class="btn sub" data-download-corrupt="1">Beschadigde gegevens downloaden</button><label>Volledige back-up herstellen</label><input type="file" accept="application/json,.json" data-recovery-file="1"><button class="btn sub" data-retry-load="1">Opnieuw proberen</button><button class="btn gold" data-emergency="1">Emergency Mode starten</button><div class="note">Emergency Mode gebruikt een afzonderlijke tijdelijke dataset en overschrijft de beschadigde database niet.</div></div></div>`}
function render(){if(UI.screen==='settings'){$('app').innerHTML=rSettings();return}if(UI.screen==='recovery'){$('app').innerHTML=rRecovery();return}renderV24()}
function rHome(){let h=rHomeV24();const marker='<button class="btn sub" disabled>Instellingen (volgt)</button>';h=h.replace(marker,'<button class="btn sub" data-go="settings">Instellingen</button>');if(!DB.sessions.length)h=h.replace('<button class="btn sub" data-go="library">Naar spelersbibliotheek</button>','<button class="btn sub" data-go="library">Naar spelersbibliotheek</button><button class="btn sub" data-go="settings">Instellingen</button>');if(EMERGENCY_MODE)h='<div class="warn">Emergency Mode actief. Deze dataset staat los van de beschadigde actieve database.'+(STORAGE_AVAILABLE?'':' Gegevens gaan verloren bij sluiten of verversen.')+'</div>'+h;return h}
document.addEventListener('change',async e=>{const t=e.target;if(t.dataset.backupCat){UI.backupSelection[t.dataset.backupCat]=t.checked}if(t.dataset.importCat){UI.importSelection[t.dataset.importCat]=t.checked}if(t.dataset.importFile!==undefined&&t.files&&t.files[0]){try{const b=JSON.parse(await t.files[0].text());validateBackup(b);UI.importFile=b;UI.importInfo=b;UI.importSelection={players:b.metadata.categories.includes('players'),sessions:b.metadata.categories.includes('sessions'),settings:b.metadata.categories.includes('settings')};render()}catch(err){alert('Bestand niet geaccepteerd: '+err.message)}}if(t.dataset.recoveryFile!==undefined&&t.files&&t.files[0]){try{const b=JSON.parse(await t.files[0].text());validateBackup(b,true);UI.importFile=b;UI.importSelection={players:true,sessions:true,settings:true};performImport(true)}catch(err){alert('Herstel niet uitgevoerd: '+err.message)}}});
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.backupAll){UI.backupSelection={players:true,sessions:true,settings:true};render()}if(t.dataset.backupNone){UI.backupSelection={players:false,sessions:false,settings:false};render()}if(t.dataset.exportBackup)exportSelected();if(t.dataset.downloadSafety)downloadSafetyBackup();if(t.dataset.restoreSafety)restoreSafetyBackup();if(t.dataset.importMode){UI.importMode=t.dataset.importMode;render()}if(t.dataset.runImport)performImport(false);if(t.dataset.downloadCorrupt)downloadJson({metadata:{appVersion:APP_VERSION,downloadDate:new Date().toISOString(),reason:RECOVERY_REASON},raw:RECOVERY_RAW},'Live_Poker_Handlog_beschadigde_data.json');if(t.dataset.retryLoad)load();if(t.dataset.emergency){EMERGENCY_MODE=true;DB={schemaVersion:SCHEMA_VERSION,sessions:[],playerLibrary:[],prefs:{verbosity:'full'}};const raw=(()=>{try{return localStorage.getItem(EMERGENCY_KEY)}catch(e){return null}})();if(raw)try{DB=JSON.parse(raw)}catch(e){}migrate();go('home')}});

load();
</script></body></html>
