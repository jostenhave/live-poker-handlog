function reportCardParts(code){

}
function reportVisualClassifyLine(line,index){
 const text=String(line??'');
 if(text==='')return{type:'blank',text};
 const sections=new Set(['Straddles','Showdown','Resultaat','Reads / notes','Speler info','Opmerkingen','Acties']);
 if(sections.has(text))return{type:'section',section:text,text};
 if(/^🃏\s/.test(text)){
  const rawTitle=text.replace(/^🃏\s*/,'');const parts=rawTitle.split(/\s+—\s+/);
  return{type:'title',text,title:parts[0]||rawTitle,date:parts.length>1?parts.slice(1).join(' — '):''};
 }
 if(/^(Buy-in\s+[^,]+,\s*)?\d+-handed,\s*blinds\b/i.test(text))return{type:'meta',text,badges:text.split(',').map(x=>x.trim()).filter(Boolean)};
 if(/^Ik\s*\(/.test(text))return{type:'hero',text};
 const streetMatch=text.match(/^(Preflop|Flop|Turn|River|PF|F|T|R)\b(?:\s*\(([^)]*)\))?(?:\s*\[pot\s+([^\]]+)\])?\s*(?::\s*(.*))?$/i);
 if(streetMatch){
  return{type:'street',text,street:streetMatch[1],boardText:streetMatch[2]||'',potText:streetMatch[3]||'',actionText:streetMatch[4]||''};
 }
 return{type:'normal',text};
}

function assertUniqueIds(records,label){
  const seen=new Set();
  records.forEach((r,i)=>{
    if(!r||typeof r!=='object'||Array.isArray(r))throw new Error(label+' '+(i+1)+' is geen geldig record.');
    if(!String(r.id||'').trim())throw new Error(label+' '+(i+1)+' heeft geen geldige ID.');
    if(seen.has(r.id))throw new Error(label+' bevat een dubbele ID: '+r.id+'.');
    seen.add(r.id);
  });
}
function validateBackupRecords(b){
  const cats=b.metadata.categories||[];
  if(cats.includes('players')){
    assertUniqueIds(b.data.players,'Speler');
    b.data.players.forEach((p,i)=>{if(!String(p.name||'').trim())throw new Error('Speler '+(i+1)+' heeft geen naam.');});
  }
  if(cats.includes('sessions')){
    assertUniqueIds(b.data.sessions,'Sessie');
    const availablePlayers=new Set((b.data.players||[]).map(p=>p.id));
    b.data.sessions.forEach((s,si)=>{
      if(!Array.isArray(s.players)||!Array.isArray(s.hands))throw new Error('Sessie '+(si+1)+' heeft geen geldige spelers- of handenlijst.');
      assertUniqueIds(s.players,'Sessiespeler in sessie '+(si+1));
      assertUniqueIds(s.hands,'Hand in sessie '+(si+1));
      const sessionPlayerIds=new Set(s.players.map(p=>p.id));
      s.players.forEach(p=>availablePlayers.add(p.id));
      s.hands.forEach((h,hi)=>{
        if(Object.prototype.hasOwnProperty.call(h,'sessionId')&&String(h.sessionId)!==String(s.id))throw new Error('Hand '+(hi+1)+' in sessie '+(si+1)+' verwijst naar een andere sessie.');
        if(!h.streets||typeof h.streets!=='object'||Array.isArray(h.streets))throw new Error('Hand '+(hi+1)+' in sessie '+(si+1)+' heeft geen geldige actielijst.');
        if(h.villains!==undefined&&!Array.isArray(h.villains))throw new Error('Hand '+(hi+1)+' in sessie '+(si+1)+' heeft geen geldige villainlijst.');
        (h.villains||[]).forEach((v,vi)=>{
          if(!v||typeof v!=='object'||Array.isArray(v))throw new Error('Villain '+(vi+1)+' in hand '+(hi+1)+' is ongeldig.');
          if(v.playerId&&!sessionPlayerIds.has(v.playerId))throw new Error('Villain '+(vi+1)+' in hand '+(hi+1)+' verwijst niet naar een speler in dezelfde sessie.');
        });
      });
    });
  }
}
function validateBackup(b,requireFull=false){
  if(!b||typeof b!=='object'||Array.isArray(b)||!b.metadata||!b.data)throw new Error('Dit bestand is geen geldige Live Poker Handlog-back-up.');
  if(!Number.isInteger(Number(b.metadata.backupVersion))||Number(b.metadata.backupVersion)<1)throw new Error('De back-upversie ontbreekt of is ongeldig.');
  if(!Number.isInteger(Number(b.metadata.schemaVersion))||Number(b.metadata.schemaVersion)<1)throw new Error('De schema-versie ontbreekt of is ongeldig.');
  if(!Array.isArray(b.metadata.categories))throw new Error('De metadata met categorieën ontbreekt.');
  const allowed=['players','sessions','settings'],cats=b.metadata.categories;
  if(!cats.length||cats.some(x=>!allowed.includes(x))||new Set(cats).size!==cats.length)throw new Error('De categorieaanduiding in de back-up is ongeldig.');
  if(Number(b.metadata.backupVersion)>BACKUP_VERSION||Number(b.metadata.schemaVersion)>SCHEMA_VERSION)throw new Error('Deze back-up is gemaakt met een nieuwere, nog niet ondersteunde versie.');
  if(requireFull&&!allowed.every(x=>cats.includes(x)))throw new Error('Voor volledig herstel is een back-up met spelers, sessies én instellingen vereist.');
  if(cats.includes('players')&&!Array.isArray(b.data.players))throw new Error('De spelerscategorie is beschadigd.');
  if(cats.includes('sessions')&&!Array.isArray(b.data.sessions))throw new Error('De sessiecategorie is beschadigd.');
  if(cats.includes('settings')&&(!b.data.settings||typeof b.data.settings!=='object'||Array.isArray(b.data.settings)))throw new Error('De instellingencategorie is beschadigd.');
  if(!cats.includes('players')&&Object.prototype.hasOwnProperty.call(b.data,'players'))throw new Error('De inhoud en categorieaanduiding voor spelers komen niet overeen.');
  if(!cats.includes('sessions')&&Object.prototype.hasOwnProperty.call(b.data,'sessions'))throw new Error('De inhoud en categorieaanduiding voor sessies komen niet overeen.');
  if(!cats.includes('settings')&&Object.prototype.hasOwnProperty.call(b.data,'settings'))throw new Error('De inhoud en categorieaanduiding voor instellingen komen niet overeen.');
  validateBackupRecords(b);
  return true;
}

function performImport(requireFull=false){

      const selected=(b.metadata.categories||[]).filter(c=>UI.importSelection[c]).map(c=>c==='players'?'spelers':c==='sessions'?'sessies en handen':'instellingen');
      const what=selected.length?selected.join(', '):'de geselecteerde gegevens';
      if(!confirm('Je staat op het punt '+what+' te vervangen. De app maakt eerst een veiligheidskopie van je huidige gegevens.\n\nDoorgaan?'))return;
    }
    const sel=requireFull?{players:true,sessions:true,settings:true}:UI.importSelection;

    UI.importInfo=null;
    UI.importFile=null;

function wzInitialStreetState(st){
  const d=UI.draft,s=currentSession(),actors=wzOrder(st);
  const state={
    street:st,actors:{},currentBet:0,lastFullRaise:0,lastAggressor:null,
    actedSinceRaise:new Set(),pending:[],closed:false
  };
  actors.forEach(a=>state.actors[a]={status:'active',contribution:0,raiseRight:true,acted:false});
  if(st==='pf'){
    const bbValue=s.type==='cash'?num(d.bb):1;
    const sbValue=s.type==='cash'?num(d.sb):(num(d.bb)?num(d.sb)/num(d.bb):0.5);
    const sbActor=wzActor(d.players===2?'BTN/SB':'SB');
    const bbActor=wzActor('BB');
    if(!d.sbNA&&state.actors[sbActor])state.actors[sbActor].contribution=sbValue;
    if(state.actors[bbActor])state.actors[bbActor].contribution=bbValue;
    state.currentBet=bbValue;
    state.lastFullRaise=bbValue; // minimum opening increment before voluntary action

    const straddles=handStraddles(s,d);
    straddles.forEach(x=>{
      const actor=wzActor(x.pos);
      const level=s.type==='cash'?num(x.amount):(num(d.bb)?num(x.amount)/num(d.bb):0);
      if(state.actors[actor])state.actors[actor].contribution=level;
      if(level>state.currentBet){
        state.lastFullRaise=level;
        state.currentBet=level;
        state.lastAggressor=actor;
      }
    });
  }
  return state;
}

function wzReplayStreet(st,limit=null){
  const d=UI.draft,state=wzInitialStreetState(st),arr=d.streets[st]||[];
  const max=limit==null?arr.length:Math.max(0,Math.min(limit,arr.length));

  for(let i=0;i<max;i++){
    const a=arr[i],actor=a.pos,ps=state.actors[actor];
    if(!ps||ps.status!=='active')continue;

    const toCall=Math.max(0,state.currentBet-ps.contribution);

    if(a.act==='fold'){
      ps.status='folded';ps.acted=true;state.actedSinceRaise.add(actor);continue;
    }
    if(a.act==='check'){
      ps.acted=true;state.actedSinceRaise.add(actor);continue;
    }
    if(a.act==='call'){
      let add=toCall;
      const stack=wzStreetStartStack(actor,st);
      if(stack!=null)add=Math.min(add,Math.max(0,stack-ps.contribution));
      ps.contribution+=add;ps.acted=true;state.actedSinceRaise.add(actor);
      if(stack!=null&&Math.abs(ps.contribution-stack)<1e-7)ps.status='allin';
      continue;
    }

    if(['bet','raise','allin','jam'].includes(a.act)){
      const stack=wzStreetStartStack(actor,st);
      let target=wzUnitToBase(a.amt,a.unit,analyze(currentSession(),d).potStart?.[st]||0);

      if((a.act==='allin'||a.act==='jam')&&(target==null||target===0)&&stack!=null)target=stack;
      if(target==null){
        ps.status='allin';ps.acted=true;state.actedSinceRaise.add(actor);continue;
      }
      if(stack!=null)target=Math.min(target,stack);

      const previousBet=state.currentBet;
      const raiseSize=Math.max(0,target-previousBet);
      ps.contribution=Math.max(ps.contribution,target);
      ps.acted=true;

      if(target>previousBet+1e-7){
        const requiredIncrement=previousBet<=1e-7
          ? target
          : Math.max(state.lastFullRaise, 0);
        const fullRaise=previousBet<=1e-7 || raiseSize+1e-7>=requiredIncrement;

        if(fullRaise){
          state.lastFullRaise=previousBet<=1e-7?target:raiseSize;
          Object.entries(state.actors).forEach(([x,v])=>{
            if(v.status==='active'&&x!==actor)v.raiseRight=true;
          });
          state.actedSinceRaise=new Set([actor]);
        }else{
          // Short raise/all-in: actors who already acted since the last full raise
          // must call/fold if needed, but do not regain the right to raise.
          Object.entries(state.actors).forEach(([x,v])=>{
            if(v.status==='active'&&state.actedSinceRaise.has(x))v.raiseRight=false;
          });
          state.actedSinceRaise.add(actor);
        }

        state.currentBet=target;
        state.lastAggressor=actor;
      }else{
        state.actedSinceRaise.add(actor);
      }

      if(a.act==='allin'||a.act==='jam'||(stack!=null&&Math.abs(ps.contribution-stack)<1e-7)){
        ps.status='allin';
      }
    }
  }

  const active=Object.entries(state.actors).filter(([,v])=>v.status==='active');
  state.pending=active
    .filter(([,v])=>!v.acted||v.contribution+1e-7<state.currentBet)
    .map(([a])=>a);
  state.closed=state.pending.length===0;
  return state;
}

/* Cross-street stackregistratie: telt een actor se inleg op over alle straten
   tot en met de opgegeven straat, zodat "resterende stack" ook postflop klopt. */
function wzTotalContribution(actor, uptoStreet){
  const order=['pf','flop','turn','river'];
  let total=0;
  for(const st of order){
    const state=wzReplayStreet(st);
    total += state.actors[actor] ? state.actors[actor].contribution : 0;
    if(st===uptoStreet) break;
  }
  return total;
}

function wzStreetStartStack(actor, street){
  const known=wzKnownStack(actor);
  if(known==null) return null;
  const order=['pf','flop','turn','river'];
  const idx=order.indexOf(street);
  const priorStreet=idx>0?order[idx-1]:null;

}

function wzStart(st){
  const w=UI.wz,d=UI.draft;
  w.street=st;w.selected='';w.value='';w.unit=w.lastUnit;

  let order=wzOrder(st);
  const unavailable=new Set();

  for(const prior of ['pf','flop','turn','river']){
    if(STREET_INDEX[prior]>=STREET_INDEX[st])break;
    (d.streets[prior]||[]).forEach(a=>{
      if(['fold','allin','jam'].includes(a.act))unavailable.add(a.pos);
    });
  }
  order=order.filter(a=>!unavailable.has(a));

  if(st==='pf'&&d.preflopPrefix){
    const excluded=new Set(d.preflopPrefix.foldedPositions||[]);
    order=order.filter(a=>!excluded.has(a));
    const first=d.preflopPrefix.firstActor;
    const idx=order.indexOf(first);
    if(idx>0)order=order.slice(idx).concat(order.slice(0,idx));
  }

  w.order=order;
  const replay=wzReplayStreet(st);
  const pendingSet=new Set(replay.pending.length?replay.pending:order);
  w.pending=order.filter(a=>pendingSet.has(a));
  w.actor=w.pending[0]||'';
  w.step=w.pending.length<=1?'finish':'action';
  render();
}

/* D2.4: onafhankelijke, idempotente seat-/positienormalisatie. */
function d24ValidSeat(value,players){
 const seat=Number(value);
 return Number.isInteger(seat)&&seat>=1&&seat<=players?seat:0;
}
function d24ButtonFromPositionMap(positionBySeat,players){
 const entries=Object.entries(positionBySeat||{});
 const hit=entries.find(([,position])=>position==='BTN'||position==='BTN/SB');
 return hit?d24ValidSeat(hit[0],players):0;
}
function d24ButtonFromHero(normalized,players){
 const heroSeat=d24ValidSeat(normalized.heroSeat,players);
 const positions=wzPos(players)||[];
 const heroIndex=positions.indexOf(normalized.heroPos);
 if(!heroSeat||heroIndex<0)return 0;
 return ((heroSeat-1-heroIndex+players)%players)+1;
}
function d24PositionMapIsCompleteAndCanonical(positionBySeat,players,buttonSeat){
 if(!positionBySeat||typeof positionBySeat!=='object')return false;
 const expected=wzAssign(players,buttonSeat);
 const keys=Object.keys(expected);
 if(Object.keys(positionBySeat).length!==keys.length)return false;
 return keys.every(seat=>positionBySeat[seat]===expected[seat]);
}

function d25SeatForPosition(positionBySeat,heroPos,players){
 if(!(wzPos(players)||[]).includes(heroPos))return 0;
 const entry=Object.entries(positionBySeat||{}).find(([,position])=>position===heroPos);
 return entry?d24ValidSeat(entry[0],players):0;
}
function d25NormalizeHeroIdentity(normalized,players){
 const validHeroSeat=d24ValidSeat(normalized.heroSeat,players);
 const validPositions=wzPos(players)||[];
 const validHeroPos=validPositions.includes(normalized.heroPos)?normalized.heroPos:'';

 // Legacy-regel: een geldige heroSeat is leidend.
 if(validHeroSeat){
  normalized.heroSeat=validHeroSeat;
  normalized.heroPos=normalized.positionBySeat[validHeroSeat]||'';
 }else if(validHeroPos){
  const derivedSeat=d25SeatForPosition(normalized.positionBySeat,validHeroPos,players);
  normalized.heroSeat=derivedSeat||null;
  normalized.heroPos=derivedSeat?validHeroPos:'';
 }else{
  normalized.heroSeat=null;
  normalized.heroPos='';
 }

 if(normalized.heroSeat){
  const posAtSeat=normalized.positionBySeat[normalized.heroSeat];
  const seatForPos=d25SeatForPosition(normalized.positionBySeat,normalized.heroPos,players);
  if(!posAtSeat||posAtSeat!==normalized.heroPos||seatForPos!==normalized.heroSeat){
   throw new Error('Hero-seat en Hero-positie konden niet eenduidig worden genormaliseerd.');
  }
 }
 return normalized;
}

function d24NormalizeSeatModel(source){
 const normalized=deepClone(source);
 const players=Math.max(2,Math.min(9,Number(normalized.players)||9));
 normalized.players=players;

 const explicitButton=d24ValidSeat(normalized.buttonSeat,players);
 const mappedButton=d24ButtonFromPositionMap(normalized.positionBySeat,players);
 const heroDerivedButton=d24ButtonFromHero(normalized,players);

 // Een geldige expliciete buttonSeat is leidend. Anders eerst de positiekaart,
 // daarna Hero-seat/positie en als laatste een veilige seat 1.
 const buttonSeat=explicitButton||mappedButton||heroDerivedButton||1;
 normalized.buttonSeat=buttonSeat;

 // Canonicaliseer altijd vanuit players + buttonSeat. Hierdoor worden ontbrekende,
 // incomplete en inconsistente maps in één idempotente stap hersteld.
 if(!d24PositionMapIsCompleteAndCanonical(normalized.positionBySeat,players,buttonSeat)){
  normalized.positionBySeat=wzAssign(players,buttonSeat);

  postflopOrder.push(normalized.positionBySeat[((buttonSeat-1+i)%players)+1]);
 }
 const expectedPositions=wzPos(players)||[];

function d26PureClone(value){
 if(value===undefined)return undefined;
 return JSON.parse(JSON.stringify(value));
}
function d26PureEqual(a,b){
 if(Object.is(a,b))return true;
 try{return JSON.stringify(a)===JSON.stringify(b);}catch(_){return false;}
}
function classifyHistoricalEdit(field,before,after,handState){
 const canonical=D26_FIELD_ALIASES[field]||field;
 const rule=D26_FIELD_RULES[canonical];
 const changed=!d26PureEqual(before,after);
 const safeState=d26PureClone(handState);
 if(!rule){
  return{
   field,
   canonicalField:canonical,
   knownField:false,
   hasChanged:changed,
   impactClass:'C',
   requiresConfirmation:changed,
   firstAffectedCheckpoint:null,
   affectedActions:'unknown',
   affectedBoard:'unknown',
   affectedResult:true,
   validationMode:'unknown-conservative',
   special:null,
   message:'Onbekend veld: conservatief als Klasse C behandelen.',
   shadow:true,
   handStateUsed:!!safeState
  };
 }
 let impactClass=rule.impactClass;
 let validationMode=impactClass==='A'?'report':
                    impactClass==='B'?'cards-result':
                    rule.dynamic==='startstack'?'dynamic-startstack':'rebuild-replay';
 if(rule.special==='pot-override')validationMode='pot-override-heavy-validation';
 return{
  field,
  canonicalField:canonical,
  knownField:true,
  hasChanged:changed,
  impactClass,
  requiresConfirmation:changed&&impactClass==='C',
  firstAffectedCheckpoint:rule.checkpoint||null,
  affectedActions:rule.actions===undefined?false:rule.actions,
  affectedBoard:rule.board===undefined?false:rule.board,
  affectedResult:!!rule.result,
  validationMode,
  dynamicAnalysis:rule.dynamic||null,
  special:rule.special||null,
  message:changed?rule.message:'Geen inhoudelijke wijziging.',
  shadow:true,
  handStateUsed:!!safeState
 };
}


/* D2.6 Fase 3A — pure kaartprioriteit en kaartverdringingsbeslissing in shadow mode.
   Geen UI-wiring, geen draftmutatie, geen automatische correctie bij openen/render/replay/import. */
const D26_CARD_GROUP_RANK=Object.freeze({
 hero:10,
 villain1:20,
 villain2:30,
 villain:40,
 flop:50,
 turn:60,
 river:70
});

function d26NormalizeCardCode(card){
 if(card==null)return'';
 return String(card).trim().toUpperCase();
}
function d26CardGroupDescriptor(raw){
 const group=raw&&typeof raw==='object'?raw:{};
 const type=String(group.type||'').trim();
 const index=Number.isFinite(Number(group.index))?Number(group.index):null;
 let key='';
 let rank=999;
 let label='Onbekende kaartgroep';
 if(type==='hero'){
  key='hero';rank=D26_CARD_GROUP_RANK.hero;label='Hero';
 }else if(type==='villain'&&index===1){
  key='villain1';rank=D26_CARD_GROUP_RANK.villain1;label='Villain 1';
 }else if(type==='villain'&&index===2){
  key='villain2';rank=D26_CARD_GROUP_RANK.villain2;label='Villain 2';
 }else if(type==='villain'&&index!=null&&index>=3){
  key=`villain:${index}`;rank=D26_CARD_GROUP_RANK.villain+index;label=`Villain ${index}`;
 }else if(type==='flop'){
  key='flop';rank=D26_CARD_GROUP_RANK.flop;label='Flop';
 }else if(type==='turn'){
  key='turn';rank=D26_CARD_GROUP_RANK.turn;label='Turn';
 }else if(type==='river'){
  key='river';rank=D26_CARD_GROUP_RANK.river;label='River';
 }
 return Object.freeze({type,index,key,rank,label});
}
function d26CompareCardGroups(a,b){
 const ga=d26CardGroupDescriptor(a),gb=d26CardGroupDescriptor(b);
 if(ga.rank!==gb.rank)return ga.rank-gb.rank;
 return ga.key.localeCompare(gb.key);
}
function d26CardLocationKey(location){
 const loc=location&&typeof location==='object'?location:{};
 const group=d26CardGroupDescriptor(loc.group);
 const slot=Number.isFinite(Number(loc.slot))?Number(loc.slot):0;
 return `${group.key}#${slot}`;
}
function d26PureCardSnapshot(value){
 if(value===undefined)return undefined;
 return JSON.parse(JSON.stringify(value));
}

/*
 Input:
 {
   card,
   source:{group:{type,index?},slot},
   placements:[{card,group:{type,index?},slot}],
   explicitUserEdit:boolean,
   trigger:'picker'|'open'|'render'|'navigation'|'import'|'migration'|'replay'
 }

 Output action:
 - accept: kaart is vrij
 - accept-same-slot: zelfde kaart staat al in dezelfde slot
 - accept-nonphysical: onbekende ?-kaart; geen fysieke duplicaatcontrole
 - block-earlier-owner: latere groep probeert kaart uit eerdere groep te kiezen
 - displace-later-owner: eerdere groep kiest kaart uit latere groep; latere kaartlocatie vrijmaken
 - block-same-group: kaart staat al in andere slot binnen dezelfde groep
 - no-op-passive: geen mutatiebesluit buiten expliciete user edit
 */
function decideCardDisplacement(input){
 const safe=d26PureCardSnapshot(input)||{};
 const card=d26NormalizeCardCode(safe.card);
 const source=safe.source||{};
 const sourceGroup=d26CardGroupDescriptor(source.group);
 const sourceKey=d26CardLocationKey(source);
 const placements=Array.isArray(safe.placements)?safe.placements:[];
 const explicit=safe.explicitUserEdit===true;
 const passiveTriggers=new Set(['open','render','navigation','import','migration','replay']);

 if(!explicit||passiveTriggers.has(String(safe.trigger||''))){
  return{
   action:'no-op-passive',
   allowed:false,
   card,
   source:sourceKey,
   displacements:[],
   message:'Geen kaartwijziging uitgevoerd buiten een expliciete gebruikersbewerking.',
   shadow:true
  };
 }
 if(!card||!sourceGroup.key){
  return{
   action:'invalid-input',
   allowed:false,
   card,
   source:sourceKey,
   displacements:[],
   message:'Ongeldige kaart of kaartgroep.',
   shadow:true
  };
 }
 if(card.includes('?')){
  return{
   action:'accept-nonphysical',
   allowed:true,
   card,
   source:sourceKey,
   displacements:[],
   message:'Onbekende kaart kan worden vastgelegd zonder fysieke-kaartduplicaatcontrole.',
   shadow:true
  };
 }

 const matches=placements
  .map((p,order)=>({
   order,
   card:d26NormalizeCardCode(p.card),
   group:d26CardGroupDescriptor(p.group),
   slot:Number.isFinite(Number(p.slot))?Number(p.slot):0,
   locationKey:d26CardLocationKey(p)
  }))
  .filter(p=>p.card===card)
  .sort((a,b)=>d26CompareCardGroups(
    {type:a.group.type,index:a.group.index},
    {type:b.group.type,index:b.group.index}
  )||a.slot-b.slot||a.order-b.order);

 if(matches.some(m=>m.locationKey===sourceKey)){
  return{
   action:'accept-same-slot',
   allowed:true,
   card,
   source:sourceKey,
   displacements:[],
   message:'De kaart staat al op deze locatie.',
   shadow:true
  };
 }

 const sameGroup=matches.find(m=>m.group.key===sourceGroup.key);
 if(sameGroup){
  return{
   action:'block-same-group',
   allowed:false,
   card,
   source:sourceKey,
   owner:sameGroup.locationKey,
   ownerLabel:`${sameGroup.group.label}, kaart ${sameGroup.slot}`,
   displacements:[],
   message:`${card} is binnen ${sourceGroup.label} al gekozen.`,
   shadow:true
  };
 }

 const earlier=matches.find(m=>m.group.rank<sourceGroup.rank);
 if(earlier){
  return{
   action:'block-earlier-owner',
   allowed:false,
   card,
   source:sourceKey,
   owner:earlier.locationKey,
   ownerLabel:`${earlier.group.label}, kaart ${earlier.slot}`,
   displacements:[],
   message:`${card} staat al bij ${earlier.group.label}. Een latere kaartgroep mag een eerdere kaart niet verdringen.`,
   shadow:true
  };
 }

 const later=matches.filter(m=>m.group.rank>sourceGroup.rank);
 if(later.length){
  return{
   action:'displace-later-owner',
   allowed:true,
   card,
   source:sourceKey,
   displacements:later.map(m=>({
    locationKey:m.locationKey,
    groupKey:m.group.key,
    groupLabel:m.group.label,
    slot:m.slot,
    card
   })),
   message:`${card} wordt bij ${later.map(m=>`${m.group.label}, kaart ${m.slot}`).join(' en ')} verwijderd.`,
   shadow:true
  };
 }

 return{
  action:'accept',
  allowed:true,
  card,
  source:sourceKey,
  displacements:[],
  message:'Kaart kan worden gekozen.',
  shadow:true
 };
}


/* D2.6 Fase 3B — koppeling van Fase 3A aan expliciete kaartkeuzes. */
function d26PathToCardLocation(path){
 const p=String(path||'').split('.');
 if(p[0]==='hero')return{group:{type:'hero'},slot:+p[1]+1,path};
 if(p[0]==='v')return{group:{type:'villain',index:+p[1]+1},slot:+p[2]+1,path};
 if(p[0]==='board'){
  const i=+p[1];
  if(i<3)return{group:{type:'flop'},slot:i+1,path};
  if(i===3)return{group:{type:'turn'},slot:1,path};
  if(i===4)return{group:{type:'river'},slot:1,path};
 }
 return{group:{type:'unknown'},slot:0,path};
}
function d26BoardIndexToLocation(index,pathPrefix='board'){
 const i=Number(index);
 const path=`${pathPrefix}.${i}`;
 if(i<3)return{group:{type:'flop'},slot:i+1,path};
 if(i===3)return{group:{type:'turn'},slot:1,path};
 if(i===4)return{group:{type:'river'},slot:1,path};
 return{group:{type:'unknown'},slot:0,path};
}
function d26CollectCardPlacements(draft,boardOverride){
 const d=draft||{};
 const placements=[];
 (d.heroCards||[]).forEach((card,i)=>placements.push({...d26PathToCardLocation(`hero.${i}`),card}));
 (d.villains||[]).forEach((v,vi)=>(v.cards||[]).forEach((card,ci)=>placements.push({...d26PathToCardLocation(`v.${vi}.${ci}`),card})));
 const board=Array.isArray(boardOverride)?boardOverride:(d.board||[]);
 board.forEach((card,i)=>placements.push({...d26BoardIndexToLocation(i),card}));
 return placements;
}
function d26DecisionForPath(path,card,boardOverride){
 return decideCardDisplacement({
  card,
  source:d26PathToCardLocation(path),
  placements:d26CollectCardPlacements(UI.draft,boardOverride),
  explicitUserEdit:true,
  trigger:'picker'
 });
}
function d26CardChoiceBlocked(path,card){
 if(!card||String(card).includes('?'))return false;
 const decision=d26DecisionForPath(path,card);
 return decision.action==='block-earlier-owner'||decision.action==='block-same-group'||decision.action==='invalid-input';
}
function d26LocationKeyToPath(locationKey){
 const [groupKey,slotText]=String(locationKey||'').split('#');
 const slot=Math.max(1,Number(slotText)||1);
 if(groupKey==='hero')return`hero.${slot-1}`;
 if(groupKey==='flop')return`board.${slot-1}`;
 if(groupKey==='turn')return'board.3';
 if(groupKey==='river')return'board.4';
 if(groupKey==='villain1')return`v.0.${slot-1}`;
 if(groupKey==='villain2')return`v.1.${slot-1}`;
 if(groupKey.startsWith('villain:'))return`v.${Math.max(0,Number(groupKey.split(':')[1])-1)}.${slot-1}`;
 return'';
}
function d26ClearCardPath(path,boardTarget){
 const p=String(path||'').split('.');
 if(p[0]==='hero'&&UI.draft?.heroCards)UI.draft.heroCards[+p[1]]=null;
 else if(p[0]==='v'&&UI.draft?.villains?.[+p[1]]?.cards)UI.draft.villains[+p[1]].cards[+p[2]]=null;
 else if(p[0]==='board'){
  const target=Array.isArray(boardTarget)?boardTarget:UI.draft?.board;
  if(target)target[+p[1]]=null;
 }
}
function d26ApplyDecisionDisplacements(decision,boardTarget){
 for(const displacement of decision.displacements||[]){
  const path=d26LocationKeyToPath(displacement.locationKey);
  if(path)d26ClearCardPath(path,boardTarget);
 }
}
function d26ApplyExplicitCardChoice(path,card){
 const decision=d26DecisionForPath(path,card);
 if(!decision.allowed){
  /* DODE CODE — v2.8: picker blokkeert deze niet-toegestane keuze vooraf via disabled; geen andere interactieve invoerroute gevonden. Build 8.2 – 2026-08-20 */
  toast(decision.message,3200);
  return false;
 }
 d26ApplyDecisionDisplacements(decision);
 setCard(path,card);
 if(decision.action==='displace-later-owner')toast(decision.message,3600);
 return true;
}
function d26RunoutPath(index){return`board.${Number(index)}`;}
function d26RunoutDecision(index,card){
 const board=UI.wz?.runoutBoardDraft||UI.draft?.board||[];
 return d26DecisionForPath(d26RunoutPath(index),card,board);
}
function d26RunoutCardChoiceBlocked(index,card){
 if(!card||String(card).includes('?'))return false;
 const decision=d26RunoutDecision(index,card);

}
function d26ApplyExplicitRunoutCardChoice(index,card){

 if(!w||!Array.isArray(w.runoutBoardDraft))return false;

  else seen.get(code).push(item);
 }
 for(const [card,items] of seen.entries()){
  if(items.length>1)duplicates.push({card,locations:items.map(x=>({path:x.path,owner:x.owner}))});

  id:v.id||'',

function d26ClassBIsLiveWinner(candidate,hand,{allowHero=true}={}){

function d26ClassBWinnerValid(hand){

 if(d.outcome==='win')return d.winner==='hero'||d.winner==='ik';

  const normalized=d.winners.map(String);

function d26ResultLiveActors(hand){

  if(!candidate.actor||!candidate.canonical){
   errors.push('Een resultaatkandidaat mist een geldige actor of canonieke identiteit.');
   return;
  }
  if(seenActors.has(candidate.actor)){
   errors.push(`Dubbele resultaat-actor: ${candidate.actor}.`);
   return;
  }
  if(seenCanonical.has(String(candidate.canonical))){
   errors.push(`Dubbele canonieke resultaatidentiteit: ${candidate.canonical}.`);
   return;
  }
  seenActors.add(candidate.actor);
  seenCanonical.add(String(candidate.canonical));
  actors.push(candidate);
 };
 const heroPos=String(d.heroPos||'').trim();
 if(heroPos&&!folded.has('ik')){
  pushCandidate({actor:'ik',label:`Ik (${heroPos})`,canonical:'hero',position:heroPos,villainIndex:null,id:'',playerId:''});
 }
 (d.villains||[]).forEach((v,i)=>{
  const pos=String(v.pos||'').trim();
  if(!pos){
   errors.push(`Villain ${i+1} heeft geen geldige positie.`);
   return;
  }
  if(folded.has(pos))return;

  const id=String(v.id||'').trim();
  const playerId=String(v.playerId||'').trim();

  if(id&&seenIds.has(id)){
   errors.push(`Dubbele Villain-id: ${id}.`);
   return;
  }
  if(playerId&&seenPlayerIds.has(playerId)){
   errors.push(`Dubbele playerId: ${playerId}.`);
   return;
  }

  const canonical=id||playerId;
  if(!canonical){
   errors.push(`Villain ${i+1} heeft geen geldige identiteit.`);
   return;
  }

  if(id)seenIds.add(id);
  if(playerId)seenPlayerIds.add(playerId);

  const actor=d26ResultActorForPosition(d,pos);
  pushCandidate({actor,label:pos,canonical,position:pos,villainIndex:i,id,playerId});
 });
 return{actors,errors};
}

  const hit=live.find(x=>String(x.canonical)===String(d.winner)||x.actor===d.winner||`pos:${x.position}`===d.winner);

 }
 const raw=actors.map(actor=>String(actor).trim());
 if(raw.some(actor=>!actor)){
  return{allowed:false,action:'invalid-result-player',hand:working,message:'Een geselecteerde winnaar is ongeldig.'};
 }
 const selected=[...new Set(raw)];
 if(selected.length!==raw.length){

 }

 }
 if(mode==='chop'&&selected.length<2){

 if(!selected.every(a=>live.some(x=>x.actor===a))){

function d26PrepareHistoricalSaveState(){
 const tx=UI.editTx,w=UI.wz,d=UI.draft;
 if(!tx||!w||!d)return false;

 /* De D2-working-copy opent vanaf setup en had niet altijd de legacy
    savecontext voor een reeds afgeronde hand. Zonder deze context kan
    wzSave() ten onrechte opnieuw om een winnaar vragen. */
 w.editingExisting=true;
 w.originalOutcome=w.originalOutcome||d.outcome||tx.original?.outcome||'';
 w.originalWinner=w.originalWinner||d.winner||tx.original?.winner||'';

 if(!Array.isArray(w.winners))w.winners=[];
 if(!w.winners.length){
  const derived=wzWinnersFromHand(d);
  if(Array.isArray(derived)&&derived.length)w.winners=derived;
 }
 return true;
}

d26SaveHistoricalEditTransaction=function(){
 if(!UI.editTx||!UI.wz||!UI.draft)return false;
 if(d26HistoricalEditHasPendingConfirmation()){
  toast('Rond eerst de openstaande bevestiging af.',3400);
  return false;
 }

 const tx=UI.editTx;
 const sid=UI.sid;
 const w=UI.wz,d=UI.draft;
 const snapshot={
  street:w.street,
  review:w.review,
  closePrompt:w.closePrompt,
  navigation:deepClone(w.navigation),
  activeStreet:d.activeStreet,
  error:w.error
 };
 const storedActive=d.activeStreet||w.street||'pf';

 d26PrepareHistoricalSaveState();

 /* wzSave() mag de tijdelijke previewstraat niet als nieuwe handstraat opslaan. */
 w.street=storedActive;
 w.review=storedActive;
 w.closePrompt=false;
 w.error='';

 wzSave();

 const committed=!UI.editTx;
 if(committed){
  /* wzSave() verlaat naar share; historische edit sluit bewust terug naar sessie. */
  UI.wz=null;
  UI.draft=null;
  UI.hid=null;
  go('session',sid);
  toast('Wijzigingen opgeslagen.');
  return true;
 }

 /* Geen commit: herstel exact dezelfde historische presentatiestate. */
 if(UI.wz&&UI.draft){
  UI.wz.street=snapshot.street;
  UI.wz.review=snapshot.review;
  UI.wz.closePrompt=snapshot.closePrompt;
  UI.wz.navigation=deepClone(snapshot.navigation);
  UI.draft.activeStreet=snapshot.activeStreet;
  if(!UI.wz.error)UI.wz.error=snapshot.error||'De wijzigingen konden niet worden opgeslagen.';
  UI.editTx.working=UI.draft;
  UI.editTx.dirty=d2IsDirty();
  render();
 }
 return false;
};

function rc7F4ParseBountyCount(raw){

 if(!/^\d+(?:[.,]\d{1,2})?$/.test(value))return{valid:false,empty:false,value:null};
 const n=Number(value.replace(',','.'));
 return{valid:Number.isFinite(n)&&n>=0,empty:false,value:n};
}

 if(value===''||value==null)return'';
 return String(Math.round(Number(value)*100)/100).replace('.',',');

}
function rc7F44RestoreNavigation(snapshot){

d26ResultLiveActors=function(hand){
 const d=hand||{},folded=d26ClassBFoldedPositions(d),actors=[],errors=[];
 const seenActors=new Set(),seenCanonical=new Set();
 const push=c=>{
  if(!c.actor||!c.canonical)return;
  if(seenActors.has(c.actor)||seenCanonical.has(String(c.canonical)))return;
  seenActors.add(c.actor);seenCanonical.add(String(c.canonical));actors.push(c);
 };
 const heroPos=String(d.heroPos||'').trim();
 if(heroPos&&!folded.has('ik')){
  push({actor:'ik',label:`${heroPos} (Ik)`,canonical:'hero',position:heroPos,villainIndex:null,id:'',playerId:''});
 }
 (d.villains||[]).forEach((v,i)=>{
  const pos=String(v.pos||'').trim();
  if(!pos||folded.has(pos))return;
  const actor=d26ResultActorForPosition(d,pos);
  const canonical=String(v.id||v.playerId||`pos:${pos}`);
  const name=String(v.name||'').trim();
  push({
   actor,
   label:name?`${pos} (${name})`:pos,
   canonical,
   position:pos,
   villainIndex:i,
   id:String(v.id||''),
   playerId:String(v.playerId||'')
  });
 });
 return{actors,errors};
};

const shareTextF67Base=shareText;
shareText=function(session,hand){
 const txt=shareTextF67Base(session,hand);
 const winner=f67SingleVillainWinner(hand,session);
 if(!winner)return txt;

 const reliable=hand?.potReliable!==false&&!(hand?.unknownAllInPositions||[]).length;
 const potText=reliable?rc7F42PotText(hand):'';
 const replacement=potText
  ?`${winner.label} - wint pot: ${potText}`
  :`${winner.label} - wint pot`;

 const lines=String(txt||'').split('\n');
 const index=lines.findIndex(line=>/^Ik verlies(?:\s|$)/.test(line));
 if(index>=0)lines[index]=replacement;
 return lines.join('\n');
};

/* WIJZIGING v2.7 Build 1.2 – 2026-08-12: vaste eerste straddle is sessieconfiguratie → levert geen dubbele invoer tijdens handregistratie. */
regularStraddleRows=function(s,h){
  const max=Math.max(0,Number(h.players||9)-2);
  if(s.type!=='cash'||h.straddleType!=='regular'||max===0)return[];
  const count=Math.max(1,Math.min(Number(h.straddleCount)||1,max)),pos=straddlePositions(h),out=[];
  let prev=num(h.bb);
  for(let i=0;i<count;i++){
    const open=i===0?!!s.firstStraddleOpen:!!s.reStraddleOpen;
    let amount=0;
    if(open)amount=num(h.straddleAmounts[i]);
    else if(i===0)amount=num(s.firstStraddleFixed);
    else amount=prev>0?prev*2:0;
    out.push({pos:pos[i]||('UTG+'+i),amount,open,index:i});
    prev=amount;
  }
  return out;
}

/* ===== v2.7 productie-PWA — versiegebonden, gebruiker-gestuurde update-handoff ===== */
let livePokerUpdateCandidate=null;
let livePokerUpdateRequested=false;

function hideLivePokerUpdateNotice(){
  const notice=document.getElementById('pwaUpdateNotice');
  if(notice)notice.hidden=true;
}

function showLivePokerUpdateNotice(candidate){
  if(!candidate||!candidate.worker)return;
  livePokerUpdateCandidate=candidate;

  let notice=document.getElementById('pwaUpdateNotice');
  if(!notice){
    notice=document.createElement('div');
    notice.id='pwaUpdateNotice';
    notice.className='pwaUpdateNotice';
    notice.setAttribute('role','status');
    notice.setAttribute('aria-live','polite');
    notice.innerHTML=`
      <div class="pwaUpdateTitle">Nieuwe versie beschikbaar</div>
      <div class="pwaUpdateText">Live Poker Handlog kan worden bijgewerkt. Je huidige lokale pokerdata blijft staan. De update wordt pas uitgevoerd nadat je op Nu bijwerken tikt.</div>
      <div class="pwaUpdateActions">
        <button type="button" class="pwaUpdateLater" id="pwaUpdateLater">Later bijwerken</button>
        <button type="button" class="pwaUpdateNow" id="pwaUpdateNow">Nu bijwerken</button>
      </div>`;
    document.body.appendChild(notice);
    notice.querySelector('#pwaUpdateLater').addEventListener('click',hideLivePokerUpdateNotice);
    notice.querySelector('#pwaUpdateNow').addEventListener('click',installLivePokerUpdate);
  }
  notice.hidden=false;
}

async function fetchLivePokerUpdateMetadata(){
  try{
    const response=await fetch('./pwa-update.json?ts='+Date.now(),{cache:'no-store'});
    if(!response.ok)return null;
    const data=await response.json();
    if(!data||typeof data.versionId!=='string'||typeof data.worker!=='string')return null;
    return data;
  }catch(e){
    return null;
  }
}

async function checkLivePokerUpdate(){
  const candidate=await fetchLivePokerUpdateMetadata();
  if(!candidate||candidate.versionId===PWA_VERSION_ID)return;
  showLivePokerUpdateNotice(candidate);
}

function activateWaitingLivePokerWorker(registration,button){
  const waiting=registration.waiting;
  if(!waiting)return false;
  livePokerUpdateRequested=true;
  if(button){
    button.disabled=true;
    button.textContent='Bijwerken…';
  }
  waiting.postMessage({type:'SKIP_WAITING'});
  return true;
}

async function installLivePokerUpdate(){
  const candidate=livePokerUpdateCandidate;
  if(!candidate||!candidate.worker)return;

  const notice=document.getElementById('pwaUpdateNotice');
  const button=notice&&notice.querySelector('#pwaUpdateNow');
  if(button){
    button.disabled=true;
    button.textContent='Voorbereiden…';
  }

  try{
    /* De kandidaat-service-worker wordt bewust pas hier geregistreerd.
       Zolang de gebruiker 'Later bijwerken' kiest, bestaat er dus geen
       nieuwe waiting worker die na het sluiten van de app vanzelf kan activeren. */
    const registration=await navigator.serviceWorker.register(candidate.worker,{
      scope:'./',
      updateViaCache:'none'
    });

    if(activateWaitingLivePokerWorker(registration,button))return;

    const installing=registration.installing;
    if(!installing){
      if(button){
        button.disabled=false;
        button.textContent='Nu bijwerken';
      }
      return;
    }

    installing.addEventListener('statechange',()=>{
      if(installing.state==='installed'){
        activateWaitingLivePokerWorker(registration,button);
      }else if(installing.state==='redundant'&&button){
        button.disabled=false;
        button.textContent='Nu bijwerken';
      }
    });
  }catch(e){
    console.warn('PWA-update installeren mislukt:',e);
    if(button){
      button.disabled=false;
      button.textContent='Nu bijwerken';
    }
  }
}

function registerLivePokerHandlogServiceWorker(){
  if(!('serviceWorker' in navigator))return;
  let reloadingForUpdate=false;

  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(livePokerUpdateRequested&&!reloadingForUpdate){
      reloadingForUpdate=true;
      location.reload();
    }
  });

  window.addEventListener('load',async()=>{
    try{
      
      let registration=await navigator.serviceWorker.getRegistration('./');

      
      if(!registration){
        registration=await navigator.serviceWorker.register('./service-worker-v2.7.js',{
          scope:'./',
          updateViaCache:'none'
        });
      }

      await checkLivePokerUpdate();
    }catch(e){
      console.warn('Service worker registratie/updatecontrole mislukt:',e);
    }
  },{once:true});
}
registerLivePokerHandlogServiceWorker();
