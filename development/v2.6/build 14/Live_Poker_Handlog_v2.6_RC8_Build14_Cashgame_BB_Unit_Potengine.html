function migrate(persist=true){

      p.id=newId;
      if(p.notes===undefined)p.notes='';
      if(p.seat===undefined)p.seat='';
      if(Object.prototype.hasOwnProperty.call(p,'pos'))delete p.pos;

      if(h.straddleCount===undefined)h.straddleCount=1;

      h.villains.forEach(v=>{

        if(v.playerId&&idMap[v.playerId])v.playerId=idMap[v.playerId];
        if(!v.playerId){

        }
        if(v.playerId&&!(s.players||[]).some(p=>p.id===v.playerId)){

  const winner=h.outcome==='win'?'hero':(h.outcome==='lose'?h.winner:(h.outcome==='chop'?'chop':''));
  const potTxt=pot>0?(h.potOverride?d26PotOverrideFormat(pot,s):fmtPot(pot,s)):'';
  const heroCards=h.heroCards.filter(Boolean).map(cardTxt).join('');
  if(heroCards){let extra='';if(winner==='hero')extra=' (wint'+(potTxt?' '+potTxt:'')+')';else if(winner==='chop')extra=' (split'+(potTxt?' '+potTxt:'')+')';lines.push(`Ik (${h.heroPos})${heroCards?': '+heroCards:''}${extra}`)}
  reportVillains(h).forEach((v,i)=>{const vc=(v.cards||[]).filter(Boolean).map(cardTxt).join('');if(!vc)return;const isWin=h.outcome==='lose'&&(winnerIsVillain(h,v)||(!winner&&i===0));let extra='';if(isWin)extra=' (wint'+(potTxt?' '+potTxt:'')+')';else if(winner==='chop')extra=' (split'+(potTxt?' '+potTxt:'')+')';lines.push(`${villainLabel(s,v,h)}: ${vc}${extra}`)});
  return lines;
}
function shareTextV24(s,h){
  const a=analyze(s,h),L=[],short=(DB.prefs.verbosity==='short');
  if(s.showName!==false)L.push('🃏 '+s.name+(h.date?' — '+new Date(h.date+'T00:00:00').toLocaleDateString('nl-NL',{day:'numeric',month:'short',year:'numeric'}):''));
  L.push(s.type==='cash'?`${h.players}-handed, blinds ${h.sb!==''&&h.sb!=null?money(s,h.sb):cur(s)+'?'}/${h.bb!==''&&h.bb!=null?money(s,h.bb):cur(s)+'?'}`:`${h.players}-handed, blinds ${fmtChips(h.sb)}/${fmtChips(h.bb)}${h.ante?' ante '+fmtChips(h.ante):''}`);
  const hasShowdown=(h.villains||[]).some(v=>(v.cards||[]).some(Boolean));
  let hero=`Ik (${h.heroPos}${h.heroSeat?' · Seat '+h.heroSeat:''})`;const hc=h.heroCards.filter(Boolean).map(cardTxt).join('');if(hc&&!hasShowdown)hero+=' '+hc;if(s.type==='cash'&&h.heroStackChips)hero+=' | '+money(s,h.heroStackChips);else if(h.heroStackBB)hero+=' | '+fmtBB(h.heroStackBB)+(h.heroStackChips?' ('+fmtChips(h.heroStackChips)+')':'');if(s.type!=='cash'&&s.subtype==='pko'&&h.ownBounty)hero+=' | bounty '+money(s,h.ownBounty);L.push(hero);
  reportVillains(h).forEach(v=>{let t=villainHeader(s,v,h);if(v.stackBB)t+=' | '+fmtBB(v.stackBB)+(v.stackChips?' ('+fmtChips(v.stackChips)+')':'');if(s.type!=='cash'&&s.subtype==='pko'&&v.bounty)t+=' | bounty '+money(s,v.bounty);L.push(t)});
  const ss=handStraddles(s,h);if(ss.length){L.push('');L.push('Straddles');ss.forEach(x=>L.push(x.pos+' '+money(s,x.amount)))}
  L.push('');STREETS.forEach(([k,n])=>{const ln=streetText(s,h,k,n,short,a);if(ln)L.push(ln)});
  const sd=showdownLines(s,h,a);
  if(sd.length){L.push('');L.push('Showdown');L.push(...sd)}
  else{
    let res='';const pv=h.potOverride&&h.potBB!==''?num(h.potBB):a.finalPot;
    if(h.outcome==='win')res='Ik win de pot'+(pv>0?' ('+(h.potOverride?d26PotOverrideFormat(pv,s):fmtPot(pv,s))+')':'');
    else if(h.outcome==='lose')res='Ik verlies'+(pv>0?' — pot '+(h.potOverride?d26PotOverrideFormat(pv,s):fmtPot(pv,s)):'');
    else if(h.outcome==='chop')res='Chop'+(pv>0?' — pot '+(h.potOverride?d26PotOverrideFormat(pv,s):fmtPot(pv,s)):'');
    else if(h.outcome==='fold')res='Ik fold'+(a.heroInvested>0?' — inleg '+fmtPot(a.heroInvested,s):'');
    if(res){L.push('');L.push('Resultaat');L.push(res)}
  }
  if(s.type!=='cash'&&s.subtype==='pko'&&h.bountyWon)L.push('🏆 KO: bounty '+money(s,h.bountyWon));
  if(s.type!=='cash'&&s.subtype==='ko'&&h.bountyCount){const total=num(h.bountyCount)*num(s.bountyAmount);L.push('🏆 KO: '+h.bountyCount+' × '+(s.bountyAmount?money(s,s.bountyAmount):'bounty')+(total?(' = '+money(s,total)) : ''))}
  if(s.type!=='cash'&&s.subtype==='mystery'&&h.bountyCount)L.push('🎁 KO: '+h.bountyCount+' mystery bounty(s)'+(h.bountyWon?' — '+h.bountyWon:''));
  const vnotes=reportVillains(h).filter(v=>v.note);if(vnotes.length){L.push('');L.push('Reads / notes');vnotes.forEach(v=>L.push(villainLabel(s,v,h)+': '+v.note))}
  if(h.note){L.push('');L.push(h.note)}return L.join('\n')
}
function colorize(txt){return esc(txt).replace(/(?<![A-Za-z0-9])(?:[AKQJTX2-9][shdcx])+(?![A-Za-z0-9])/g,seq=>seq.replace(/([AKQJTX2-9])([shdcx])/g,(m,r,s)=>`<span class="c${s==='x'?'q':s}">${r}${s}</span>`))}
async function copyShare(){
  const s=currentSession(),h=s.hands.find(x=>x.id===UI.hid),txt=shareText(s,h);
  try{
    await navigator.clipboard.writeText(txt);
    toast('Gekopieerd ✔');
  }catch(e){
    try{
      const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();
      const ok=document.execCommand('copy');ta.remove();
      if(!ok)throw new Error('copy failed');
      toast('Gekopieerd ✔');
    }catch(err){toast('Kopiëren mislukt')}
  }
}

function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function renderReportCanvas(txt){const dpr=2,padX=28,padY=26,fs=27,lh=Math.round(fs*1.45),font=fs+'px ui-monospace, SFMono-Regular, Menlo, monospace';const meas=document.createElement('canvas').getContext('2d');meas.font=font;const lines=txt.split('\n');let maxW=0;lines.forEach(l=>maxW=Math.max(maxW,meas.measureText(l).width));const W=Math.ceil(maxW+padX*2),H=Math.ceil(lines.length*lh+padY*2);const cv=document.createElement('canvas');cv.width=W*dpr;cv.height=H*dpr;const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);ctx.fillStyle='#0b141a';ctx.fillRect(0,0,W,H);ctx.fillStyle='#134d37';roundRect(ctx,10,10,W-20,H-20,16);ctx.fill();ctx.font=font;ctx.textBaseline='top';const seqRe=/(?<![A-Za-z0-9])(?:[AKQJTX2-9][shdcx])+(?![A-Za-z0-9])/g,cardRe=/([AKQJTX2-9])([shdcx])/g;lines.forEach((line,li)=>{let x=padX,y=padY+li*lh,last=0,m;while((m=seqRe.exec(line))){if(m.index>last){const t=line.slice(last,m.index);ctx.fillStyle='#E9EDF2';ctx.fillText(t,x,y);x+=ctx.measureText(t).width}let cm;cardRe.lastIndex=0;while((cm=cardRe.exec(m[0]))){const t=cm[0];ctx.fillStyle=IMG_COL[cm[2]]||'#E9EDF2';ctx.fillText(t,x,y);x+=ctx.measureText(t).width}last=m.index+m[0].length}if(last<line.length){const t=line.slice(last);ctx.fillStyle='#E9EDF2';ctx.fillText(t,x,y)}});return cv}

function assertUniqueIds(records,label){
  const seen=new Set();
  records.forEach((r,i)=>{
    if(!r||typeof r!=='object'||Array.isArray(r))throw new Error(label+' '+(i+1)+' is geen geldig record.');
    if(!String(r.id||'').trim())throw new Error(label+' '+(i+1)+' heeft geen geldige ID.');
    if(seen.has(r.id))throw new Error(label+' bevat een dubbele ID: '+r.id+'.');
    seen.add(r.id);
  });
}
function validateBackupRecords(b){
  const cats=b.metadata.categories||[];
  if(cats.includes('players')){
    assertUniqueIds(b.data.players,'Speler');
    b.data.players.forEach((p,i)=>{if(!String(p.name||'').trim())throw new Error('Speler '+(i+1)+' heeft geen naam.');});
  }
  if(cats.includes('sessions')){
    assertUniqueIds(b.data.sessions,'Sessie');
    const availablePlayers=new Set((b.data.players||[]).map(p=>p.id));
    b.data.sessions.forEach((s,si)=>{
      if(!Array.isArray(s.players)||!Array.isArray(s.hands))throw new Error('Sessie '+(si+1)+' heeft geen geldige spelers- of handenlijst.');
      assertUniqueIds(s.players,'Sessiespeler in sessie '+(si+1));
      assertUniqueIds(s.hands,'Hand in sessie '+(si+1));
      const sessionPlayerIds=new Set(s.players.map(p=>p.id));
      s.players.forEach(p=>availablePlayers.add(p.id));
      s.hands.forEach((h,hi)=>{
        if(Object.prototype.hasOwnProperty.call(h,'sessionId')&&String(h.sessionId)!==String(s.id))throw new Error('Hand '+(hi+1)+' in sessie '+(si+1)+' verwijst naar een andere sessie.');
        if(!h.streets||typeof h.streets!=='object'||Array.isArray(h.streets))throw new Error('Hand '+(hi+1)+' in sessie '+(si+1)+' heeft geen geldige actielijst.');
        if(h.villains!==undefined&&!Array.isArray(h.villains))throw new Error('Hand '+(hi+1)+' in sessie '+(si+1)+' heeft geen geldige villainlijst.');
        (h.villains||[]).forEach((v,vi)=>{
          if(!v||typeof v!=='object'||Array.isArray(v))throw new Error('Villain '+(vi+1)+' in hand '+(hi+1)+' is ongeldig.');
          if(v.playerId&&!sessionPlayerIds.has(v.playerId))throw new Error('Villain '+(vi+1)+' in hand '+(hi+1)+' verwijst niet naar een speler in dezelfde sessie.');
        });
      });
    });
  }
}
function validateBackup(b,requireFull=false){
  if(!b||typeof b!=='object'||Array.isArray(b)||!b.metadata||!b.data)throw new Error('Dit bestand is geen geldige Live Poker Handlog-back-up.');
  if(!Number.isInteger(Number(b.metadata.backupVersion))||Number(b.metadata.backupVersion)<1)throw new Error('De back-upversie ontbreekt of is ongeldig.');
  if(!Number.isInteger(Number(b.metadata.schemaVersion))||Number(b.metadata.schemaVersion)<1)throw new Error('De schema-versie ontbreekt of is ongeldig.');
  if(!Array.isArray(b.metadata.categories))throw new Error('De metadata met categorieën ontbreekt.');
  const allowed=['players','sessions','settings'],cats=b.metadata.categories;
  if(!cats.length||cats.some(x=>!allowed.includes(x))||new Set(cats).size!==cats.length)throw new Error('De categorieaanduiding in de back-up is ongeldig.');
  if(Number(b.metadata.backupVersion)>BACKUP_VERSION||Number(b.metadata.schemaVersion)>SCHEMA_VERSION)throw new Error('Deze back-up is gemaakt met een nieuwere, nog niet ondersteunde versie.');
  if(requireFull&&!allowed.every(x=>cats.includes(x)))throw new Error('Voor volledig herstel is een back-up met spelers, sessies én instellingen vereist.');
  if(cats.includes('players')&&!Array.isArray(b.data.players))throw new Error('De spelerscategorie is beschadigd.');
  if(cats.includes('sessions')&&!Array.isArray(b.data.sessions))throw new Error('De sessiecategorie is beschadigd.');
  if(cats.includes('settings')&&(!b.data.settings||typeof b.data.settings!=='object'||Array.isArray(b.data.settings)))throw new Error('De instellingencategorie is beschadigd.');
  if(!cats.includes('players')&&Object.prototype.hasOwnProperty.call(b.data,'players'))throw new Error('De inhoud en categorieaanduiding voor spelers komen niet overeen.');
  if(!cats.includes('sessions')&&Object.prototype.hasOwnProperty.call(b.data,'sessions'))throw new Error('De inhoud en categorieaanduiding voor sessies komen niet overeen.');
  if(!cats.includes('settings')&&Object.prototype.hasOwnProperty.call(b.data,'settings'))throw new Error('De inhoud en categorieaanduiding voor instellingen komen niet overeen.');
  validateBackupRecords(b);
  return true;
}

/* ===== v2.6 RC2 overrides ===== */
function wzKnownStack(actor){
  const d=UI.draft,s=currentSession(),bb=num(d.bb);
  if(actor==='ik'){
    if(s.type==='cash')return d.heroStackChips!==''?num(d.heroStackChips):null;
    if(d.heroStackChips!==''&&bb)return num(d.heroStackChips)/bb;
    if(d.heroStackBB!=='')return num(d.heroStackBB);
    return null;
  }
  const pos=wzPosOf(actor),v=(d.villains||[]).find(x=>x.pos===pos);
  if(!v)return null;
  if(s.type==='cash')return v.stackChips!==''?num(v.stackChips):null;
  if(v.stackChips!==''&&bb)return num(v.stackChips)/bb;
  if(v.stackBB!=='')return num(v.stackBB);
  return null;
}
function wzUnitToBase(amt,unit,pot){
  if(amt===''||amt==null)return null;
  const d=UI.draft,s=currentSession(),bb=num(d.bb),n=num(amt);
  if(unit==='%')return pot*n/100;
  if(s.type==='cash')return unit==='bb'?n*bb:n;
  return unit==='chips'?(bb?n/bb:null):n;
}
function wzInitialStreetState(st){
  const d=UI.draft,s=currentSession(),actors=wzOrder(st);
  const state={street:st,actors:{},currentBet:0,lastFullRaise:0,lastAggressor:null,actedSinceRaise:new Set(),pending:[],closed:false};
  actors.forEach(a=>state.actors[a]={status:'active',contribution:0,raiseRight:true,acted:false});
  if(st==='pf'){
    const sbActor=wzActor(d.players===2?'BTN/SB':'SB'),bbActor=wzActor('BB');
    if(!d.sbNA&&state.actors[sbActor])state.actors[sbActor].contribution=currentSession().type==='cash'?num(d.sb):(num(d.bb)?num(d.sb)/num(d.bb):.5);
    if(state.actors[bbActor])state.actors[bbActor].contribution=currentSession().type==='cash'?num(d.bb):1;
    state.currentBet=currentSession().type==='cash'?num(d.bb):1;
    const ss=handStraddles(s,d);
    ss.forEach(x=>{
      const a=wzActor(x.pos),v=currentSession().type==='cash'?num(x.amount):(num(d.bb)?num(x.amount)/num(d.bb):0);
      if(state.actors[a])state.actors[a].contribution=v;
      if(v>state.currentBet){state.lastFullRaise=Math.max(state.lastFullRaise,v-state.currentBet);state.currentBet=v;state.lastAggressor=a}
    });
  }
  return state;
}
function wzReplayStreet(st,limit=null){
  const d=UI.draft,w=UI.wz,state=wzInitialStreetState(st),arr=d.streets[st]||[],max=limit==null?arr.length:limit;
  const potBefore=()=>analyze(currentSession(),d).potStart?.[st]||0;
  for(let i=0;i<max;i++){
    const a=arr[i],actor=a.pos,ps=state.actors[actor];
    if(!ps||ps.status!=='active')continue;
    const toCall=Math.max(0,state.currentBet-ps.contribution);
    if(a.act==='fold'){ps.status='folded';ps.acted=true;state.actedSinceRaise.add(actor);continue}
    if(a.act==='check'){ps.acted=true;state.actedSinceRaise.add(actor);continue}
    if(a.act==='call'){
      let add=toCall;
      const stack=wzKnownStack(actor);
      if(stack!=null)add=Math.min(add,Math.max(0,stack-ps.contribution));
      ps.contribution+=add;ps.acted=true;state.actedSinceRaise.add(actor);
      if(stack!=null&&Math.abs(ps.contribution-stack)<1e-7)ps.status='allin';
      continue;
    }
    if(['bet','raise','allin','jam'].includes(a.act)){
      const stack=wzKnownStack(actor),base=wzUnitToBase(a.amt,a.unit,potBefore());
      let target=base;
      if((a.act==='allin'||a.act==='jam')&&(target==null||target===0)&&stack!=null)target=stack;
      if(target==null){ps.status='allin';ps.acted=true;state.actedSinceRaise.add(actor);continue}
      if(stack!=null)target=Math.min(target,stack);
      const raiseSize=Math.max(0,target-state.currentBet);
      ps.contribution=Math.max(ps.contribution,target);ps.acted=true;
      if(target>state.currentBet+1e-7){
        const fullRaise=state.currentBet===0||raiseSize+1e-7>=Math.max(state.lastFullRaise,state.currentBet||0);
        if(fullRaise){
          state.lastFullRaise=state.currentBet===0?target:raiseSize;
          Object.entries(state.actors).forEach(([x,v])=>{if(v.status==='active'&&x!==actor)v.raiseRight=true});
        }else{
          Object.entries(state.actors).forEach(([x,v])=>{if(v.status==='active'&&state.actedSinceRaise.has(x))v.raiseRight=false});
        }
        state.currentBet=target;state.lastAggressor=actor;state.actedSinceRaise=new Set([actor]);
      }else state.actedSinceRaise.add(actor);
      if(a.act==='allin'||a.act==='jam'||(stack!=null&&Math.abs(ps.contribution-stack)<1e-7))ps.status='allin';
    }
  }
  const active=Object.entries(state.actors).filter(([,v])=>v.status==='active');
  state.pending=active.filter(([,v])=>!v.acted||v.contribution+1e-7<state.currentBet).map(([a])=>a);
  state.closed=state.pending.length===0;
  return state;
}
function wzLegalActions(){
  const w=UI.wz,state=wzReplayStreet(w.street),ps=state.actors[w.actor];
  if(!ps||ps.status!=='active')return[];
  const eps=1e-7;
  const toCall=Math.max(0,state.currentBet-ps.contribution),stack=wzKnownStack(w.actor),remaining=stack==null?null:Math.max(0,stack-ps.contribution);
  const out=[];
  if(toCall>eps){
    out.push(['fold','Fold']);
    if(remaining==null||remaining>0)out.push(['call','Call']);
    if(ps.raiseRight&&(remaining==null||remaining>toCall+eps))out.push(['raise','Raise']);
  }else{
    out.push(['check','Check']);
    if(state.currentBet<=eps)out.push(['bet','Bet']);
    else if(ps.raiseRight&&(remaining==null||remaining>0))out.push(['raise','Raise']);
  }

  // All-in is legal when it is only a call, or when the actor still has raise rights.
  // With unknown remaining stack and closed raise rights, hide All-in to avoid offering
  // a potentially illegal raise.
  const allInIsCall=remaining!=null&&remaining>0&&remaining<=toCall+eps;
  const allInIsLegalRaise=ps.raiseRight&&(remaining==null||remaining>0);
  if(allInIsCall||allInIsLegalRaise)out.push(['allin','All-in']);

  return out;
}
function wzNextPendingAfterAction(st,actor){
  const state=wzReplayStreet(st),order=wzOrder(st),start=order.indexOf(actor),pendingSet=new Set(state.pending),out=[];
  for(let i=1;i<=order.length;i++){const a=order[(start+i)%order.length];if(pendingSet.has(a))out.push(a)}
  return out;
}
function wzEligibleFirstActors(){
  const d=UI.draft,order=wzOrder('pf'),straddlers=new Set(handStraddles(currentSession(),d).map(x=>wzActor(x.pos)));
  const voluntary=order.filter(a=>!['SB','BB'].includes(wzPosOf(a))&&!straddlers.has(a));
  if(voluntary.length)return voluntary;
  const fallback=d.sbNA?wzActor('BB'):wzActor('SB');
  return fallback?[fallback]:[];
}
function wzFirst(){
  const eligible=wzEligibleFirstActors(),only=eligible.length===1;
  if(only){
    UI.wz.first=eligible[0];
    return`<div class="panel"><div class="wz-info">De eerste vrijwillige actor volgt automatisch uit de volledige straddleketen: <b>${esc(wzPosOf(eligible[0]))}${eligible[0]==='ik'?' (Ik)':''}</b>.</div>${wzTable()}<button class="btn" data-wz-auto-first>Start actie-invoer</button>${wzErr()}</div>`;
  }
  return`<div class="panel"><div class="wz-info">Kies de eerste vrijwillige actor. SB, BB en actieve straddlers zijn niet selecteerbaar.</div>${wzTable()}${wzErr()}</div>`;

/* ===== v2.6 RC3 overrides: transitions, min-raise and round-trip ===== */
function wzInitialStreetState(st){
  const d=UI.draft,s=currentSession(),actors=wzOrder(st);
  const state={
    street:st,actors:{},currentBet:0,lastFullRaise:0,lastAggressor:null,
    actedSinceRaise:new Set(),pending:[],closed:false
  };
  actors.forEach(a=>state.actors[a]={status:'active',contribution:0,raiseRight:true,acted:false});
  if(st==='pf'){
    const bbValue=s.type==='cash'?num(d.bb):1;
    const sbValue=s.type==='cash'?num(d.sb):(num(d.bb)?num(d.sb)/num(d.bb):0.5);
    const sbActor=wzActor(d.players===2?'BTN/SB':'SB');
    const bbActor=wzActor('BB');
    if(!d.sbNA&&state.actors[sbActor])state.actors[sbActor].contribution=sbValue;
    if(state.actors[bbActor])state.actors[bbActor].contribution=bbValue;
    state.currentBet=bbValue;
    state.lastFullRaise=bbValue; // minimum opening increment before voluntary action

    const straddles=handStraddles(s,d);
    let previousLevel=bbValue;
    straddles.forEach(x=>{
      const actor=wzActor(x.pos);
      const level=s.type==='cash'?num(x.amount):(num(d.bb)?num(x.amount)/num(d.bb):0);
      if(state.actors[actor])state.actors[actor].contribution=level;
      if(level>state.currentBet){
        const increment=level-previousLevel;
        state.lastFullRaise=increment>0?increment:level;
        state.currentBet=level;
        state.lastAggressor=actor;
        previousLevel=level;
      }
    });
  }
  return state;
}

function wzReplayStreet(st,limit=null){
  const d=UI.draft,state=wzInitialStreetState(st),arr=d.streets[st]||[];
  const max=limit==null?arr.length:Math.max(0,Math.min(limit,arr.length));

  for(let i=0;i<max;i++){
    const a=arr[i],actor=a.pos,ps=state.actors[actor];
    if(!ps||ps.status!=='active')continue;

    const toCall=Math.max(0,state.currentBet-ps.contribution);

    if(a.act==='fold'){
      ps.status='folded';ps.acted=true;state.actedSinceRaise.add(actor);continue;
    }
    if(a.act==='check'){
      ps.acted=true;state.actedSinceRaise.add(actor);continue;
    }
    if(a.act==='call'){
      let add=toCall;
      const stack=wzKnownStack(actor);
      if(stack!=null)add=Math.min(add,Math.max(0,stack-ps.contribution));
      ps.contribution+=add;ps.acted=true;state.actedSinceRaise.add(actor);
      if(stack!=null&&Math.abs(ps.contribution-stack)<1e-7)ps.status='allin';
      continue;
    }

    if(['bet','raise','allin','jam'].includes(a.act)){
      const stack=wzKnownStack(actor);
      let target=wzUnitToBase(a.amt,a.unit,analyze(currentSession(),d).potStart?.[st]||0);

      if((a.act==='allin'||a.act==='jam')&&(target==null||target===0)&&stack!=null)target=stack;
      if(target==null){
        ps.status='allin';ps.acted=true;state.actedSinceRaise.add(actor);continue;
      }
      if(stack!=null)target=Math.min(target,stack);

      const previousBet=state.currentBet;
      const raiseSize=Math.max(0,target-previousBet);
      ps.contribution=Math.max(ps.contribution,target);
      ps.acted=true;

      if(target>previousBet+1e-7){
        const requiredIncrement=previousBet<=1e-7
          ? target
          : Math.max(state.lastFullRaise, 0);
        const fullRaise=previousBet<=1e-7 || raiseSize+1e-7>=requiredIncrement;

        if(fullRaise){
          state.lastFullRaise=previousBet<=1e-7?target:raiseSize;
          Object.entries(state.actors).forEach(([x,v])=>{
            if(v.status==='active'&&x!==actor)v.raiseRight=true;
          });
          state.actedSinceRaise=new Set([actor]);
        }else{
          // Short raise/all-in: actors who already acted since the last full raise
          // must call/fold if needed, but do not regain the right to raise.
          Object.entries(state.actors).forEach(([x,v])=>{
            if(v.status==='active'&&state.actedSinceRaise.has(x))v.raiseRight=false;
          });
          state.actedSinceRaise.add(actor);
        }

        state.currentBet=target;
        state.lastAggressor=actor;
      }else{
        state.actedSinceRaise.add(actor);
      }

      if(a.act==='allin'||a.act==='jam'||(stack!=null&&Math.abs(ps.contribution-stack)<1e-7)){
        ps.status='allin';
      }
    }
  }

  const active=Object.entries(state.actors).filter(([,v])=>v.status==='active');
  state.pending=active
    .filter(([,v])=>!v.acted||v.contribution+1e-7<state.currentBet)
    .map(([a])=>a);
  state.closed=state.pending.length===0;
  return state;
}

function wzStart(st){
  const w=UI.wz,d=UI.draft;
  w.street=st;w.selected='';w.value='';w.unit=w.lastUnit;

  let order=wzOrder(st);
  const unavailable=new Set();

  for(const prior of ['pf','flop','turn','river']){
    if(STREET_INDEX[prior]>=STREET_INDEX[st])break;
    (d.streets[prior]||[]).forEach(a=>{
      if(['fold','allin','jam'].includes(a.act))unavailable.add(a.pos);
    });
  }
  order=order.filter(a=>!unavailable.has(a));

  if(st==='pf'&&d.preflopPrefix){
    const excluded=new Set(d.preflopPrefix.foldedPositions||[]);
    order=order.filter(a=>!excluded.has(a));
    const first=d.preflopPrefix.firstActor;
    const idx=order.indexOf(first);
    if(idx>0)order=order.slice(idx).concat(order.slice(0,idx));
  }

  w.order=order;
  const replay=wzReplayStreet(st);
  const pendingSet=new Set(replay.pending.length?replay.pending:order);
  w.pending=order.filter(a=>pendingSet.has(a));
  w.actor=w.pending[0]||'';
  w.step=w.pending.length<=1?'finish':'action';
  render();
}

function wzWinnersFromHand(h){
  if(!h)return[];
  if(h.outcome==='win'||h.winner==='hero')return['ik'];
  if(h.outcome==='chop'){
    // Older schema stores only "chop"; winner participants cannot always be
    // reconstructed. Keep empty so unchanged review does not overwrite the hand.
    return[];
  }
  if(h.outcome==='lose'){
    if(String(h.winner||'').startsWith('pos:'))return[String(h.winner).slice(4)].map(wzActor);
    const v=(h.villains||[]).find(x=>x.id===h.winner);
    if(v&&v.pos)return[wzActor(v.pos)];
  }
  return[];
}

function editHand(id){
  const s=currentSession(),h=s.hands.find(x=>x.id===id);if(!h)return;
  UI.hid=id;
  UI.draft=deepClone(h);

  if(!UI.draft.positionBySeat||!Object.keys(UI.draft.positionBySeat).length){
    const n=Number(h.players)||9,hs=Number(h.heroSeat)||1;
    const idx=wzPos(n).indexOf(h.heroPos);
    const button=((hs-1-Math.max(0,idx)+n)%n)+1;
    UI.draft.buttonSeat=button;
    UI.draft.positionBySeat=wzAssign(n,button);
  }
  if(UI.draft.heroStackExact===undefined)UI.draft.heroStackExact=false;
  if(UI.draft.bbaEnabled===undefined)UI.draft.bbaEnabled=!!UI.draft.ante;
  if(!UI.draft.preflopPrefix)UI.draft.preflopPrefix=null;

  UI.wz=wzFlow();
  UI.wz.street=h.activeStreet||'pf';
  UI.wz.review=h.activeStreet||'pf';
  UI.wz.step='review';
  UI.wz.winners=wzWinnersFromHand(h);
  UI.wz.originalOutcome=h.outcome||'';
  UI.wz.originalWinner=h.winner||'';
  UI.wz.editingExisting=true;
  go('hand');
}

function wzResumeAfterStructuralEdit(st,index,originalAction=null){
  const d=UI.draft,w=UI.wz,arr=d.streets[st];
  const actor=(originalAction&&originalAction.pos)||(arr[index]&&arr[index].pos);
  d.streets[st]=arr.slice(0,index);
  w.street=st;
  w.review=st;
  w.order=wzOrder(st).filter(a=>{
    const prior=['pf','flop','turn','river']
      .filter(x=>STREET_INDEX[x]<STREET_INDEX[st])
      .flatMap(x=>d.streets[x]||[]);
    return !prior.some(x=>x.pos===a&&['fold','allin','jam'].includes(x.act));
  });
  w.pending=actor?[actor]:[];
  w.actor=actor||w.order[0]||'';
  w.selected=originalAction?originalAction.act:'';
  w.value=originalAction?(originalAction.amt||''):'';
  w.unit=originalAction?(originalAction.unit||w.unit):w.unit;
  w.step='action';
  render();
}

function wzSave(){
  const s=currentSession(),d=UI.draft,w=UI.wz,dup=wzDuplicateCardErrors();
  if(dup.length){w.error=dup.join(' ');return render()}

  const v=validateHandFlow(s,d);
  if(v.errors.length){w.error=v.errors.join(' ');return render()}

  d.implicitFolds=v.derived.implicit;
  d.potReliable=!v.derived.unknownAllins.length;
  d.unknownAllInPositions=v.derived.unknownAllins;
  syncHeroStack(d);
  d.villains.forEach(x=>{syncVStack(d,x);updateSessionPlayerFromHand(s,x)});

  const all=Object.values(d.streets).flat();
  const heroFold=all.some(a=>a.pos==='ik'&&a.act==='fold');
  const live=wzAll().filter(a=>!all.some(x=>x.pos===a&&x.act==='fold'));

  if(heroFold){d.outcome='fold';d.winner=''}
  else if(live.length===1&&live[0]==='ik'){d.outcome='win';d.winner='hero'}
  else if(w.editingExisting&&w.winners.length===0&&w.originalOutcome){
    // Preserve an unchanged legacy outcome/winner when the old schema does not
    // contain enough information to reconstruct all chop participants.
    d.outcome=w.originalOutcome;
    d.winner=w.originalWinner;
  }else{
    if(!w.winners.length){w.error='Selecteer minimaal één winnaar.';return render()}
    if(w.winners.length>1){d.outcome='chop';d.winner='chop'}
    else if(w.winners[0]==='ik'){d.outcome='win';d.winner='hero'}
    else{
      d.outcome='lose';
      const p=wzPosOf(w.winners[0]),vi=d.villains.find(x=>x.pos===p);
      d.winner=vi?vi.id:'pos:'+p;
    }
  }

  d.activeStreet=w.street||d.activeStreet||'pf';
  const i=s.hands.findIndex(x=>x.id===d.id);
  if(i>=0)s.hands[i]=d;else s.hands.unshift(d);
  s.heroSeat=d.heroSeat;
  save();UI.wz=null;go('share',s.id,d.id);
}

  if(s.type!=='cash')return'';
  if(!(s.straddleEnabled||s.btnStraddleEnabled))return`<div class="disabled-feature">Straddles zijn voor deze sessie uitgeschakeld.</div>`;
  let h=`<h2>Straddles</h2><div class="seg"><button class="${!d.straddleType?'on':''}" data-set-render="h.straddleType:">Geen</button>${s.straddleEnabled?`<button class="${d.straddleType==='regular'?'on':''}" data-set-render="h.straddleType:regular" ${max?'':'disabled'}>Reg.</button>`:''}${s.btnStraddleEnabled?`<button class="${d.straddleType==='btn'?'on':''}" data-set-render="h.straddleType:btn">Btn.</button>`:''}</div>`;
  if(d.straddleType==='regular'&&max){h+=`<label>Aantal straddles</label><select data-path-render="h.straddleCount">${Array.from({length:max},(_,i)=>i+1).map(n=>`<option value="${n}" ${Number(d.straddleCount)===n?'selected':''}>${n}</option>`).join('')}</select>`+regularStraddleRows(s,d).map(x=>x.open?`<label>${x.pos} bedrag</label><input data-straddle-amt="${x.index}" data-chip="1" value="${esc(chipDisplay(d.straddleAmounts[x.index]||''))}">`:`<div class="note">${x.pos}: ${money(s,x.amount)}</div>`).join('')}
  if(d.straddleType==='btn')h+=s.btnStraddleOpen?`<label>BTN-straddle bedrag</label><input data-straddle-amt="0" data-chip="1" value="${esc(chipDisplay(d.straddleAmounts[0]||''))}">`:num(s.btnStraddleFixed)>0?`<div class="note">Vaste BTN-straddle: ${money(s,s.btnStraddleFixed)}</div>`:`<label>Vaste BTN-straddle</label><input data-path="s.btnStraddleFixed" data-wz-fixed-btn data-chip="1" value="${esc(chipDisplay(s.btnStraddleFixed||''))}" placeholder="Verplicht"><div class="wz-field-error">Vul het vaste BTN-straddlebedrag in.</div>`;
  return h;
}

function rc6ForcedActors(){
 const d=UI.draft,s=currentSession(),set=new Set();
 const sbPos=d.players===2?'BTN/SB':'SB';
 if(!d.sbNA)set.add(wzActor(sbPos));

}
function rc6BuildPreflopPrefix(first){
 const order=wzOrder('pf'),idx=order.indexOf(first),forced=rc6ForcedActors();
 return{firstActor:first,foldedPositions:(idx<0?[]:order.slice(0,idx)).filter(a=>!forced.has(a))};
}
function rc6PriorStatus(st){
 const d=UI.draft,folded=new Set(st!=='pf'?(d.preflopPrefix?.foldedPositions||[]):[]),allin=new Set();
 for(const prior of ['pf','flop','turn','river']){
  if(STREET_INDEX[prior]>=STREET_INDEX[st])break;
  (d.streets[prior]||[]).forEach(a=>{if(a.act==='fold')folded.add(a.pos);if(a.act==='allin'||a.act==='jam')allin.add(a.pos)});
 }
 return{folded,allin};
}
function rc6ActingOrder(st){
 let order=wzOrder(st),status=rc6PriorStatus(st);
 order=order.filter(a=>!status.folded.has(a)&&!status.allin.has(a));
 if(st==='pf'&&UI.draft.preflopPrefix){
  const excluded=new Set(UI.draft.preflopPrefix.foldedPositions||[]);
  order=order.filter(a=>!excluded.has(a));
  const first=UI.draft.preflopPrefix.firstActor,idx=order.indexOf(first);
  if(idx>0)order=order.slice(idx).concat(order.slice(0,idx));
 }
 return order;
}

function rc7RoundC3IsVoluntaryInvestment(action){
 return ['call','bet','raise','allin'].includes(action?.act);

function rc7RoundC3ReportPreflop(actions){
 const voluntarilyInvested=new Set();
 const result=[];
 for(const action of actions||[]){
  if(action?.act==='fold'){
   if(voluntarilyInvested.has(action.pos))result.push(action);
   continue;
  }
  result.push(action);
  if(rc7RoundC3IsVoluntaryInvestment(action))voluntarilyInvested.add(action.pos);
 }
 return result;
}

function rc7RoundC5NextStreet(st){
 return st==='pf'?'flop':st==='flop'?'turn':st==='turn'?'river':'';
}
function rc7RoundC5RemainingStreets(st){
 if(st==='pf')return['flop','turn','river'];
 if(st==='flop')return['turn','river'];
 if(st==='turn')return['river'];
 return[];
}
function rc7RoundC5ActorRemainingStack(actor,playerState){
 const stack=wzKnownStack(actor);
 if(stack==null)return null;
 return Math.max(0,stack-num(playerState?.contribution||0));
}
function getClosedAllInRunoutState(hand=UI.draft,session=currentSession(),wizardState=UI.wz){
 const triggerStreet=wizardState?.review||wizardState?.street||'pf';
 const remainingStreets=rc7RoundC5RemainingStreets(triggerStreet);
 if(!remainingStreets.length)return{closed:false,triggerStreet,remainingStreets:[],activePlayers:[],playersWhoCanStillBet:[],unknownAllins:[],reason:'no remaining board streets'};
 const state=wzReplayStreet(triggerStreet);
 const entries=Object.entries(state.actors||{});
 const inHand=entries.filter(([,p])=>p.status!=='folded');
 const activePlayers=inHand.map(([a])=>a);
 if(inHand.length<2)return{closed:false,triggerStreet,remainingStreets:[],activePlayers,playersWhoCanStillBet:[],unknownAllins:[],reason:'fewer than two players remain'};
 if(!state.closed)return{closed:false,triggerStreet,remainingStreets:[],activePlayers,playersWhoCanStillBet:[],unknownAllins:[],reason:'current betting round is not closed'};
 const unknownAllins=wzUnknownAllins(triggerStreet);
 if(unknownAllins.length)return{closed:false,triggerStreet,remainingStreets:[],activePlayers,playersWhoCanStillBet:[],unknownAllins,reason:'unknown all-in amount'};
 const allinPlayers=inHand.filter(([,p])=>p.status==='allin').map(([a])=>a);
 if(!allinPlayers.length)return{closed:false,triggerStreet,remainingStreets:[],activePlayers,playersWhoCanStillBet:[],unknownAllins:[],reason:'no all-in player remains'};
 const playersWhoCanStillBet=[];
 for(const [actor,p] of inHand){
  if(p.status!=='active')continue;
  const remaining=rc7RoundC5ActorRemainingStack(actor,p);
  // Onbekende stack is conservatief: deze speler kan mogelijk nog inzetten.
  if(remaining==null||remaining>1e-7)playersWhoCanStillBet.push(actor);
 }
 if(playersWhoCanStillBet.length>1)return{closed:false,triggerStreet,remainingStreets:[],activePlayers,playersWhoCanStillBet,unknownAllins:[],reason:'multiple players can still bet a side pot'};
 return{closed:true,triggerStreet,remainingStreets,activePlayers,playersWhoCanStillBet,unknownAllins:[],reason:'all remaining betting is closed'};
}

function rc7RoundC5RequiredIndexes(streets){
 const out=[];
 if(streets.includes('flop'))out.push(0,1,2);
 if(streets.includes('turn'))out.push(3);

 return out;
}
function rc7RoundC5StartRunout(info){
 const w=UI.wz,d=UI.draft;
 w.step='runout';

 w.runoutErrors={};

 w.error='';

}

}

function rc7RoundC5Picker(){

 return`<div class="overlay" data-runout-picker-close><div class="picker"><div class="rankgrid">${RANKS.map(r=>`<button class="${UI.runoutPickRank===r?'on':''}" ${r!=='?'&&['s','h','d','c'].every(s=>blocked(r+s))?'disabled':''} data-runout-rank="${r}">${r}</button>`).join('')}</div><div class="suitgrid">${['s','h','d','c','?'].map(s=>{const card=UI.runoutPickRank?UI.runoutPickRank+s:'';return`<button ${!UI.runoutPickRank||s!=='?'&&UI.runoutPickRank!=='?'&&blocked(card)?'disabled':''} data-runout-suit="${s}"><span class="${sClass(s)}">${SUITS[s]}</span></button>`}).join('')}</div><div class="note">Onbekende kaart kan met ? worden gelogd.</div><div class="row" style="margin-top:12px"><button class="btn sub small" data-runout-clear>Wis kaart</button><button class="btn sub small" data-runout-picker-close>Sluiten</button></div></div></div>`;
}
function validateRunoutBoard(){
 const w=UI.wz,d=UI.draft,required=rc7RoundC5RequiredIndexes(w.runoutStreets||[]);
 const draft=(w.runoutBoardDraft||[]).slice();
 const errors={};
 for(const i of required)if(!draft[i])errors[i]='Kies deze boardkaart.';
 const known=new Map();
 const addKnown=(card,label)=>{
  if(!card||card.includes('?'))return;
  if(known.has(card))return false;
  known.set(card,label);return true;
 };
 (d.heroCards||[]).forEach(c=>addKnown(c,'Hero-holecards'));
 (d.villains||[]).forEach(v=>(v.cards||[]).forEach(c=>addKnown(c,'bekende villain-holecards')));
 draft.forEach((card,i)=>{
  if(!card||card.includes('?'))return;
  if(known.has(card))errors[i]=`Deze kaart is al gebruikt bij ${known.get(card)}.`;
  else known.set(card,'het board');
 });
 w.runoutErrors=errors;
 if(Object.keys(errors).length){
  w.error='Controleer de gemarkeerde boardkaarten.';
  render();
  requestAnimationFrame(()=>document.querySelector('.wz-runout-card-error')?.scrollIntoView({block:'center',behavior:'smooth'}));
  return false;
 }
 w.error='';
 return true;
}
function commitRunoutBoard(){
 if(!validateRunoutBoard())return false;
 const w=UI.wz,d=UI.draft,required=rc7RoundC5RequiredIndexes(w.runoutStreets||[]);
 const next=d.board.slice();
 required.forEach(i=>next[i]=w.runoutBoardDraft[i]);
 d.board=next;
 d.runoutFrom=w.runoutFromStreet||'';
 w.step='finish';
 w.street='river';
 w.review=w.runoutFromStreet||w.review;
 w.winners=[];
 w.runoutErrors={};
 UI.runoutPickerIndex=null;UI.runoutPickRank=null;
 render();
 return true;
}

 w.street=w.review;
 w.error='';
 w.runoutErrors={};

function d1SameCheckpoint(a,b){
 return !!a&&!!b&&a.id===b.id&&a.generation===b.generation;
}
function d1RecordCheckpoint(){
 const nav=d1Nav();if(!nav||nav.suppressRecord)return;
 const cp=d1Checkpoint();if(!cp)return;
 const current=nav.trail[nav.cursor];
 if(d1SameCheckpoint(current,cp))return;
 if(nav.cursor<nav.trail.length-1)nav.trail=nav.trail.slice(0,nav.cursor+1);
 const last=nav.trail.at(-1);
 if(!d1SameCheckpoint(last,cp))nav.trail.push(cp);
 nav.cursor=nav.trail.length-1;
}
function d1CurrentCheckpoint(){
 const nav=d1Nav();return nav?.trail?.[nav.cursor]||null;
}
function d1AtLatest(){
 const nav=d1Nav();return !nav||nav.cursor>=nav.trail.length-1;
}
function d1Historical(){
 return !!d1Nav()&&!d1AtLatest();
}
function d1OrderForStreet(st){
 const d=UI.draft;let order=wzOrder(st),unavailable=new Set();
 for(const prior of ['pf','flop','turn','river']){
  if(STREET_INDEX[prior]>=STREET_INDEX[st])break;
  for(const a of d.streets[prior]||[])if(['fold','allin','jam'].includes(a.act))unavailable.add(a.pos);
 }
 order=order.filter(a=>!unavailable.has(a));
 if(st==='pf'&&d.preflopPrefix){
  const excluded=new Set(d.preflopPrefix.foldedPositions||[]);
  order=order.filter(a=>!excluded.has(a));
  const first=d.preflopPrefix.firstActor,ix=order.indexOf(first);
  if(ix>0)order=order.slice(ix).concat(order.slice(0,ix));
 }
 return order;
}
function d1ReplayValidate(cp){
 if(!cp||!UI.wz||!UI.draft)return false;
 try{
  const st=cp.step==='review'?cp.review:cp.street;
  if(['action','review'].includes(cp.step)){
   const limit=cp.step==='action'?cp.actionCount:null;
   const state=wzReplayStreet(st,limit);
   if(!state||!state.actors||!Array.isArray(state.pending))throw new Error('Ongeldige replaystate');
  }
  analyze(currentSession(),UI.draft);
  return true;
 }catch(err){
  UI.wz.error='Navigatiestap kon niet veilig via replay worden hersteld.';
  return false;
 }
}
function d1ApplyCheckpoint(cp){
 const w=UI.wz,nav=d1Nav();if(!w||!cp||cp.generation!==nav.generation)return false;
 nav.suppressRecord=true;
 w.step=cp.step;w.street=cp.street||w.street;w.review=cp.review||w.review;
 w.selected='';w.value='';w.error='';
 if(cp.step==='action'){
  const state=wzReplayStreet(cp.street,cp.actionCount);
  const order=d1OrderForStreet(cp.street);
  w.order=order;
  const pendingSet=new Set(state.pending||[]);
  w.pending=order.filter(a=>pendingSet.has(a));
  w.actor=w.pending[0]||'';
  w.d1ReplayLimit={street:cp.street,count:cp.actionCount};
 }else{
  w.d1ReplayLimit=null;
 }
 const valid=d1ReplayValidate(cp);
 render();
 nav.suppressRecord=false;
 return valid;
}
function d1Navigate(delta){
 const nav=d1Nav();if(!nav)return;
 const next=nav.cursor+delta;
 if(next<0||next>=nav.trail.length)return;
 const cp=nav.trail[next];
 if(cp.generation!==nav.generation)return;
 nav.cursor=next;
 d1ApplyCheckpoint(cp);
}
function d1BumpGeneration(reason='structurele wijziging'){
 const nav=d1Nav();if(!nav)return;
 nav.generation+=1;
 nav.trail=[];
 nav.cursor=-1;
 UI.wz.d1ReplayLimit=null;

}
function d1UndoLastAction(){
 const w=UI.wz,d=UI.draft;if(!w||!d||d1Historical())return;
 const st=w.step==='review'?(w.review||w.street):w.street;
 const arr=d.streets?.[st]||[];
 const undone=arr.pop();if(!undone)return;
 d1BumpGeneration('Vorige actie');
 const order=d1OrderForStreet(st),state=wzReplayStreet(st);
 w.step='action';w.street=st;w.review=st;w.order=order;
 const pendingSet=new Set(state.pending||[]);
 w.pending=order.filter(a=>pendingSet.has(a));
 if(!w.pending.includes(undone.pos)&&state.actors?.[undone.pos]?.status==='active')w.pending.unshift(undone.pos);
 w.actor=w.pending[0]||undone.pos;
 w.selected=undone.act||'';
 w.value=undone.amt||'';
 w.unit=undone.unit||w.unit;
 w.error='';
 d1RecordCheckpoint();

}
function d12CanAdvanceCurrent(){

function d11HistoricalMutationGuard(event){
 if(!UI.wz||!d1Historical())return false;
 const target=event.target instanceof Element?event.target:null;
 if(!target)return false;

 const allowed=target.closest(
  '[data-historical-command],' +
  '[data-d1-prev],[data-d1-next],[data-wz-close],' +
  '[data-d2-edit-here],[data-d2-confirm-branch],[data-d2-cancel-branch],' +
  '.d1-nav-footer'
 );
 if(allowed)return false;

 const mutatingTarget=target.closest(
  'input,select,textarea,button,[data-pick],[data-set-render],[data-path],[contenteditable],[role="button"],form'
 );
 if(!mutatingTarget && !['submit','keydown'].includes(event.type))return false;

 event.preventDefault();
 event.stopImmediatePropagation();
 return true;
}

['click','input','change','keydown','submit'].forEach(type=>{
 document.addEventListener(type,d11HistoricalMutationGuard,true);
});

function rebuildFromCheckpoint(hand,checkpoint,policy='safe'){
 const d=hand,cp=checkpoint||{step:'config',street:'pf',actionCount:0};
 if(['config','button','hero','players','first'].includes(cp.step)){
  d.streets={pf:[],flop:[],turn:[],river:[]};
  d.board=[null,null,null,null,null];
  d.preflopPrefix=null;
  d2ClearRunout(d);d2ClearResult(d);
 }else if(cp.step==='action'){
  const st=cp.street||'pf',count=Math.max(0,Number(cp.actionCount)||0);
  d.streets[st]=(d.streets[st]||[]).slice(0,count);
  d2StreetAfter(st).forEach(x=>d.streets[x]=[]);
  const boardFrom=d22ActionDownstreamBoardStartIndex(st);
  for(let i=boardFrom;i<5;i++)d.board[i]=null;
  d2ClearRunout(d);d2ClearResult(d);
 }else if(cp.step==='review'){
  const st=cp.review||cp.street||'pf';
  d2StreetAfter(st).forEach(x=>d.streets[x]=[]);
  const next=d2StreetAfter(st)[0];
  if(next){
   const boardFrom=d2BoardStartIndex(next);
   for(let i=boardFrom;i<5;i++)d.board[i]=null;
  }
  d2ClearRunout(d);d2ClearResult(d);
 }else if(cp.step==='board'){
  const st=cp.street||'flop';
  d.streets[st]=[];
  d2StreetAfter(st).forEach(x=>d.streets[x]=[]);
  const boardFrom=d2BoardStartIndex(st);
  for(let i=boardFrom;i<5;i++)d.board[i]=null;
  d2ClearRunout(d);d2ClearResult(d);
 }else if(cp.step==='runout'){
  const from=d.runoutFrom||cp.street||'flop';

/* D2.4: onafhankelijke, idempotente seat-/positienormalisatie. */
function d24ValidSeat(value,players){
 const seat=Number(value);
 return Number.isInteger(seat)&&seat>=1&&seat<=players?seat:0;
}
function d24ButtonFromPositionMap(positionBySeat,players){
 const entries=Object.entries(positionBySeat||{});
 const hit=entries.find(([,position])=>position==='BTN'||position==='BTN/SB');
 return hit?d24ValidSeat(hit[0],players):0;
}
function d24ButtonFromHero(normalized,players){
 const heroSeat=d24ValidSeat(normalized.heroSeat,players);
 const positions=wzPos(players)||[];
 const heroIndex=positions.indexOf(normalized.heroPos);
 if(!heroSeat||heroIndex<0)return 0;
 return ((heroSeat-1-heroIndex+players)%players)+1;
}
function d24PositionMapIsCompleteAndCanonical(positionBySeat,players,buttonSeat){
 if(!positionBySeat||typeof positionBySeat!=='object')return false;
 const expected=wzAssign(players,buttonSeat);
 const keys=Object.keys(expected);
 if(Object.keys(positionBySeat).length!==keys.length)return false;
 return keys.every(seat=>positionBySeat[seat]===expected[seat]);
}

function d25SeatForPosition(positionBySeat,heroPos,players){
 if(!(wzPos(players)||[]).includes(heroPos))return 0;
 const entry=Object.entries(positionBySeat||{}).find(([,position])=>position===heroPos);
 return entry?d24ValidSeat(entry[0],players):0;
}
function d25NormalizeHeroIdentity(normalized,players){
 const validHeroSeat=d24ValidSeat(normalized.heroSeat,players);
 const validPositions=wzPos(players)||[];
 const validHeroPos=validPositions.includes(normalized.heroPos)?normalized.heroPos:'';

 // Legacy-regel: een geldige heroSeat is leidend.
 if(validHeroSeat){
  normalized.heroSeat=validHeroSeat;
  normalized.heroPos=normalized.positionBySeat[validHeroSeat]||'';
 }else if(validHeroPos){
  const derivedSeat=d25SeatForPosition(normalized.positionBySeat,validHeroPos,players);
  normalized.heroSeat=derivedSeat||null;
  normalized.heroPos=derivedSeat?validHeroPos:'';
 }else{
  normalized.heroSeat=null;
  normalized.heroPos='';
 }

 if(normalized.heroSeat){
  const posAtSeat=normalized.positionBySeat[normalized.heroSeat];
  const seatForPos=d25SeatForPosition(normalized.positionBySeat,normalized.heroPos,players);
  if(!posAtSeat||posAtSeat!==normalized.heroPos||seatForPos!==normalized.heroSeat){
   throw new Error('Hero-seat en Hero-positie konden niet eenduidig worden genormaliseerd.');
  }
 }
 return normalized;
}

function d24NormalizeSeatModel(source){
 const normalized=deepClone(source);
 const players=Math.max(2,Math.min(9,Number(normalized.players)||9));
 normalized.players=players;

 const explicitButton=d24ValidSeat(normalized.buttonSeat,players);
 const mappedButton=d24ButtonFromPositionMap(normalized.positionBySeat,players);
 const heroDerivedButton=d24ButtonFromHero(normalized,players);

 // Een geldige expliciete buttonSeat is leidend. Anders eerst de positiekaart,
 // daarna Hero-seat/positie en als laatste een veilige seat 1.
 const buttonSeat=explicitButton||mappedButton||heroDerivedButton||1;
 normalized.buttonSeat=buttonSeat;

 // Canonicaliseer altijd vanuit players + buttonSeat. Hierdoor worden ontbrekende,
 // incomplete en inconsistente maps in één idempotente stap hersteld.
 if(!d24PositionMapIsCompleteAndCanonical(normalized.positionBySeat,players,buttonSeat)){
  normalized.positionBySeat=wzAssign(players,buttonSeat);
 }else{
  normalized.positionBySeat=deepClone(normalized.positionBySeat);
 }

 d25NormalizeHeroIdentity(normalized,players);

 const postflopOrder=[];
 for(let i=1;i<=players;i++){
  postflopOrder.push(normalized.positionBySeat[((buttonSeat-1+i)%players)+1]);
 }
 const expectedPositions=wzPos(players)||[];
 const validOrder=
  postflopOrder.length===players &&
  postflopOrder.every(Boolean) &&
  new Set(postflopOrder).size===players &&
  expectedPositions.every(position=>postflopOrder.includes(position));

 const heroConsistent=
  !normalized.heroSeat ||
  (
   d24ValidSeat(normalized.heroSeat,players)===normalized.heroSeat &&
   normalized.positionBySeat[normalized.heroSeat]===normalized.heroPos &&
   d25SeatForPosition(normalized.positionBySeat,normalized.heroPos,players)===normalized.heroSeat
  );

 if(!validOrder||!heroConsistent){
  throw new Error('Seat-/positienormalisatie mislukt: ongeldige actor- of Hero-identiteit.');
 }

 normalized.heroStackExact=normalized.heroStackExact===undefined?false:!!normalized.heroStackExact;
 normalized.bbaEnabled=normalized.bbaEnabled===undefined?!!normalized.ante:!!normalized.bbaEnabled;
 return normalized;
}

const wzSaveD2Base=wzSave;
function d23Stable(value){return JSON.stringify(value)}
function d23CommitProof(tx,s,id,beforeRecord,beforeScreen,beforeCount){
 const afterRecord=s?.hands?.[tx.sourceIndex];
 if(!afterRecord||afterRecord.id!==id)return false;
 if((s.hands||[]).length!==beforeCount)return false;

 const expected=deepClone(UI.draft);
 const afterJson=d23Stable(afterRecord);
 const expectedJson=d23Stable(expected);
 if(afterJson!==expectedJson)return false;

 const dirty=d23Stable(tx.original)!==expectedJson;
 const changed=d23Stable(beforeRecord)!==afterJson;
 if(dirty&&!changed)return false;

 const leftEditor=UI.screen&&UI.screen!==beforeScreen;
 return !!leftEditor;
}

 const beforeScreen=UI.screen;
 const beforeCount=(s?.hands||[]).length;
 const result=wzSaveD2Base();

 const committed=d23CommitProof(tx,s,id,beforeRecord,beforeScreen,beforeCount);
 if(committed)UI.editTx=null;

 return result;
};

function classifyHistoricalEdit(field,before,after,handState){

                    impactClass==='B'?'cards-result':

 if(rule.special==='pot-override')validationMode='pot-override-heavy-validation';

/* D2.6 Fase 3A — pure kaartprioriteit en kaartverdringingsbeslissing in shadow mode.
   Geen UI-wiring, geen draftmutatie, geen automatische correctie bij openen/render/replay/import. */
const D26_CARD_GROUP_RANK=Object.freeze({
 hero:10,
 villain1:20,
 villain2:30,
 villain:40,
 flop:50,
 turn:60,
 river:70
});

function d26NormalizeCardCode(card){
 if(card==null)return'';
 return String(card).trim().toUpperCase();
}
function d26CardGroupDescriptor(raw){
 const group=raw&&typeof raw==='object'?raw:{};
 const type=String(group.type||'').trim();
 const index=Number.isFinite(Number(group.index))?Number(group.index):null;
 let key='';
 let rank=999;
 let label='Onbekende kaartgroep';
 if(type==='hero'){
  key='hero';rank=D26_CARD_GROUP_RANK.hero;label='Hero';
 }else if(type==='villain'&&index===1){
  key='villain1';rank=D26_CARD_GROUP_RANK.villain1;label='Villain 1';
 }else if(type==='villain'&&index===2){
  key='villain2';rank=D26_CARD_GROUP_RANK.villain2;label='Villain 2';
 }else if(type==='villain'&&index!=null&&index>=3){
  key=`villain:${index}`;rank=D26_CARD_GROUP_RANK.villain+index;label=`Villain ${index}`;
 }else if(type==='flop'){
  key='flop';rank=D26_CARD_GROUP_RANK.flop;label='Flop';
 }else if(type==='turn'){
  key='turn';rank=D26_CARD_GROUP_RANK.turn;label='Turn';
 }else if(type==='river'){
  key='river';rank=D26_CARD_GROUP_RANK.river;label='River';
 }
 return Object.freeze({type,index,key,rank,label});
}
function d26CompareCardGroups(a,b){
 const ga=d26CardGroupDescriptor(a),gb=d26CardGroupDescriptor(b);
 if(ga.rank!==gb.rank)return ga.rank-gb.rank;
 return ga.key.localeCompare(gb.key);
}
function d26CardLocationKey(location){
 const loc=location&&typeof location==='object'?location:{};
 const group=d26CardGroupDescriptor(loc.group);
 const slot=Number.isFinite(Number(loc.slot))?Number(loc.slot):0;
 return `${group.key}#${slot}`;
}
function d26PureCardSnapshot(value){
 if(value===undefined)return undefined;
 return JSON.parse(JSON.stringify(value));
}

/*
 Input:
 {
   card,
   source:{group:{type,index?},slot},
   placements:[{card,group:{type,index?},slot}],
   explicitUserEdit:boolean,
   trigger:'picker'|'open'|'render'|'navigation'|'import'|'migration'|'replay'
 }

 Output action:
 - accept: kaart is vrij
 - accept-same-slot: zelfde kaart staat al in dezelfde slot
 - accept-nonphysical: onbekende ?-kaart; geen fysieke duplicaatcontrole
 - block-earlier-owner: latere groep probeert kaart uit eerdere groep te kiezen
 - displace-later-owner: eerdere groep kiest kaart uit latere groep; latere kaartlocatie vrijmaken
 - block-same-group: kaart staat al in andere slot binnen dezelfde groep
 - no-op-passive: geen mutatiebesluit buiten expliciete user edit
 */
function decideCardDisplacement(input){
 const safe=d26PureCardSnapshot(input)||{};
 const card=d26NormalizeCardCode(safe.card);
 const source=safe.source||{};
 const sourceGroup=d26CardGroupDescriptor(source.group);
 const sourceKey=d26CardLocationKey(source);
 const placements=Array.isArray(safe.placements)?safe.placements:[];
 const explicit=safe.explicitUserEdit===true;
 const passiveTriggers=new Set(['open','render','navigation','import','migration','replay']);

 if(!explicit||passiveTriggers.has(String(safe.trigger||''))){
  return{
   action:'no-op-passive',
   allowed:false,
   card,
   source:sourceKey,
   displacements:[],
   message:'Geen kaartwijziging uitgevoerd buiten een expliciete gebruikersbewerking.',
   shadow:true
  };
 }
 if(!card||!sourceGroup.key){
  return{
   action:'invalid-input',
   allowed:false,
   card,
   source:sourceKey,
   displacements:[],
   message:'Ongeldige kaart of kaartgroep.',
   shadow:true
  };
 }
 if(card.includes('?')){
  return{
   action:'accept-nonphysical',
   allowed:true,
   card,
   source:sourceKey,
   displacements:[],
   message:'Onbekende kaart kan worden vastgelegd zonder fysieke-kaartduplicaatcontrole.',
   shadow:true
  };
 }

 const matches=placements
  .map((p,order)=>({
   order,
   card:d26NormalizeCardCode(p.card),
   group:d26CardGroupDescriptor(p.group),
   slot:Number.isFinite(Number(p.slot))?Number(p.slot):0,
   locationKey:d26CardLocationKey(p)
  }))
  .filter(p=>p.card===card)
  .sort((a,b)=>d26CompareCardGroups(
    {type:a.group.type,index:a.group.index},
    {type:b.group.type,index:b.group.index}
  )||a.slot-b.slot||a.order-b.order);

 if(matches.some(m=>m.locationKey===sourceKey)){
  return{
   action:'accept-same-slot',
   allowed:true,
   card,
   source:sourceKey,
   displacements:[],
   message:'De kaart staat al op deze locatie.',
   shadow:true
  };
 }

 const sameGroup=matches.find(m=>m.group.key===sourceGroup.key);
 if(sameGroup){
  return{
   action:'block-same-group',
   allowed:false,
   card,
   source:sourceKey,
   owner:sameGroup.locationKey,
   ownerLabel:`${sameGroup.group.label}, kaart ${sameGroup.slot}`,
   displacements:[],
   message:`${card} is binnen ${sourceGroup.label} al gekozen.`,
   shadow:true
  };
 }

 const earlier=matches.find(m=>m.group.rank<sourceGroup.rank);
 if(earlier){
  return{
   action:'block-earlier-owner',
   allowed:false,
   card,
   source:sourceKey,
   owner:earlier.locationKey,
   ownerLabel:`${earlier.group.label}, kaart ${earlier.slot}`,
   displacements:[],
   message:`${card} staat al bij ${earlier.group.label}. Een latere kaartgroep mag een eerdere kaart niet verdringen.`,
   shadow:true
  };
 }

 const later=matches.filter(m=>m.group.rank>sourceGroup.rank);
 if(later.length){
  return{
   action:'displace-later-owner',
   allowed:true,
   card,
   source:sourceKey,
   displacements:later.map(m=>({
    locationKey:m.locationKey,
    groupKey:m.group.key,
    groupLabel:m.group.label,
    slot:m.slot,
    card
   })),
   message:`${card} wordt bij ${later.map(m=>`${m.group.label}, kaart ${m.slot}`).join(' en ')} verwijderd.`,
   shadow:true
  };
 }

 return{
  action:'accept',
  allowed:true,
  card,
  source:sourceKey,
  displacements:[],
  message:'Kaart kan worden gekozen.',
  shadow:true
 };
}


/* D2.6 Fase 3B — koppeling van Fase 3A aan expliciete kaartkeuzes. */
function d26PathToCardLocation(path){
 const p=String(path||'').split('.');
 if(p[0]==='hero')return{group:{type:'hero'},slot:+p[1]+1,path};
 if(p[0]==='v')return{group:{type:'villain',index:+p[1]+1},slot:+p[2]+1,path};
 if(p[0]==='board'){
  const i=+p[1];
  if(i<3)return{group:{type:'flop'},slot:i+1,path};
  if(i===3)return{group:{type:'turn'},slot:1,path};
  if(i===4)return{group:{type:'river'},slot:1,path};
 }
 return{group:{type:'unknown'},slot:0,path};
}
function d26BoardIndexToLocation(index,pathPrefix='board'){
 const i=Number(index);
 const path=`${pathPrefix}.${i}`;
 if(i<3)return{group:{type:'flop'},slot:i+1,path};
 if(i===3)return{group:{type:'turn'},slot:1,path};
 if(i===4)return{group:{type:'river'},slot:1,path};
 return{group:{type:'unknown'},slot:0,path};
}
function d26CollectCardPlacements(draft,boardOverride){
 const d=draft||{};
 const placements=[];
 (d.heroCards||[]).forEach((card,i)=>placements.push({...d26PathToCardLocation(`hero.${i}`),card}));
 (d.villains||[]).forEach((v,vi)=>(v.cards||[]).forEach((card,ci)=>placements.push({...d26PathToCardLocation(`v.${vi}.${ci}`),card})));
 const board=Array.isArray(boardOverride)?boardOverride:(d.board||[]);
 board.forEach((card,i)=>placements.push({...d26BoardIndexToLocation(i),card}));
 return placements;
}
function d26DecisionForPath(path,card,boardOverride){
 return decideCardDisplacement({
  card,
  source:d26PathToCardLocation(path),
  placements:d26CollectCardPlacements(UI.draft,boardOverride),
  explicitUserEdit:true,
  trigger:'picker'
 });
}
function d26CardChoiceBlocked(path,card){
 if(!card||String(card).includes('?'))return false;
 const decision=d26DecisionForPath(path,card);
 return decision.action==='block-earlier-owner'||decision.action==='block-same-group'||decision.action==='invalid-input';
}
function d26LocationKeyToPath(locationKey){
 const [groupKey,slotText]=String(locationKey||'').split('#');
 const slot=Math.max(1,Number(slotText)||1);
 if(groupKey==='hero')return`hero.${slot-1}`;
 if(groupKey==='flop')return`board.${slot-1}`;
 if(groupKey==='turn')return'board.3';
 if(groupKey==='river')return'board.4';
 if(groupKey==='villain1')return`v.0.${slot-1}`;
 if(groupKey==='villain2')return`v.1.${slot-1}`;
 if(groupKey.startsWith('villain:'))return`v.${Math.max(0,Number(groupKey.split(':')[1])-1)}.${slot-1}`;
 return'';
}
function d26ClearCardPath(path,boardTarget){
 const p=String(path||'').split('.');
 if(p[0]==='hero'&&UI.draft?.heroCards)UI.draft.heroCards[+p[1]]=null;
 else if(p[0]==='v'&&UI.draft?.villains?.[+p[1]]?.cards)UI.draft.villains[+p[1]].cards[+p[2]]=null;
 else if(p[0]==='board'){
  const target=Array.isArray(boardTarget)?boardTarget:UI.draft?.board;
  if(target)target[+p[1]]=null;
 }
}
function d26ApplyDecisionDisplacements(decision,boardTarget){
 for(const displacement of decision.displacements||[]){
  const path=d26LocationKeyToPath(displacement.locationKey);
  if(path)d26ClearCardPath(path,boardTarget);
 }
}
function d26ApplyExplicitCardChoice(path,card){
 const decision=d26DecisionForPath(path,card);
 if(!decision.allowed){
  toast(decision.message,3200);
  return false;
 }
 d26ApplyDecisionDisplacements(decision);
 setCard(path,card);
 if(decision.action==='displace-later-owner')toast(decision.message,3600);
 return true;
}
function d26RunoutPath(index){return`board.${Number(index)}`;}
function d26RunoutDecision(index,card){
 const board=UI.wz?.runoutBoardDraft||UI.draft?.board||[];
 return d26DecisionForPath(d26RunoutPath(index),card,board);
}
function d26RunoutCardChoiceBlocked(index,card){
 if(!card||String(card).includes('?'))return false;
 const decision=d26RunoutDecision(index,card);
 return decision.action==='block-earlier-owner'||decision.action==='block-same-group'||decision.action==='invalid-input';
}
function d26ApplyExplicitRunoutCardChoice(index,card){
 const w=UI.wz;
 if(!w||!Array.isArray(w.runoutBoardDraft))return false;
 const decision=d26RunoutDecision(index,card);
 if(!decision.allowed){

  return false;
 }
 d26ApplyDecisionDisplacements(decision,w.runoutBoardDraft);
 w.runoutBoardDraft[Number(index)]=card;
 if(decision.action==='displace-later-owner')toast(decision.message,3600);
 return true;
}

 return JSON.stringify({

  potBB:d.potBB,potChips:d.potChips,potOverride:d.potOverride,
  villains:(d.villains||[]).map(v=>({

   stackBB:v.stackBB,stackChips:v.stackChips,bounty:v.bounty,cards:v.cards
  }))
 });

function d26ClassAGeneration(){
 return Number(UI.wz?.navigation?.generation||0);
}
function d26ApplyClassAEdit(field,before,after,applyMutation){
 if(!UI.editTx||!UI.draft||!D26_CLASS_A_FIELDS.has(field))return false;
 const decision=classifyHistoricalEdit(field,before,after,UI.draft);
 if(!decision.knownField||decision.impactClass!=='A'||decision.requiresConfirmation)return false;
 if(!decision.hasChanged)return true;
 const draftBefore=deepClone(UI.draft);
 const protectedBefore=d26ClassAProtectedFingerprint(UI.draft);
 const generationBefore=d26ClassAGeneration();
 try{
  applyMutation();
  if(d26ClassAProtectedFingerprint(UI.draft)!==protectedBefore)throw new Error('protected-state-changed');
  if(d26ClassAGeneration()!==generationBefore)throw new Error('generation-changed');
  UI.editTx.working=UI.draft;
  UI.editTx.dirty=d2IsDirty();
  return true;
 }catch(_){
  UI.draft=deepClone(draftBefore);
  UI.editTx.working=UI.draft;
  return false;
 }
}

function d26ClassAApplyInput(el){
 const field=el.dataset.d26AField;
 const vi=el.dataset.d26Villain==null?null:Number(el.dataset.d26Villain);
 const d=UI.draft;
 if(field==='handDate')return d26ApplyClassAEdit(field,d.date,el.value,()=>{d.date=el.value});
 if(field==='handNote')return d26ApplyClassAEdit(field,d.note||'',el.value,()=>{d.note=el.value});
 if(field==='bountyWon')return d26ApplyClassAEdit(field,d.bountyWon||'',el.value,()=>{d.bountyWon=el.value});
 if(field==='bountyCount')return d26ApplyClassAEdit(field,d.bountyCount||'',el.value,()=>{d.bountyCount=el.value});
 if(field==='ownBountyValue')return d26ApplyClassAEdit(field,d.ownBounty||'',el.value,()=>{d.ownBounty=el.value});
 const v=d.villains?.[vi];
 if(!v)return false;
 if(field==='villainName')return d26ApplyClassAEdit(field,v.name||'',el.value,()=>{v.name=el.value});
 if(field==='villainNote')return d26ApplyClassAEdit(field,v.note||'',el.value,()=>{v.note=el.value});
 if(field==='linkedLibraryPlayer'){
  const raw=String(el.value||'');
  const [source,id]=raw.includes(':')?raw.split(':',2):['',''];
  const sessionPlayer=currentSession()?.players?.find(p=>p.id===id);
  const libraryPlayer=(DB.playerLibrary||[]).find(p=>p.id===id);
  const selected=source==='session'?sessionPlayer:source==='library'?libraryPlayer:null;
  const before={playerId:v.playerId||'',name:v.name||''};
  const after={playerId:selected?.id||'',name:selected?.name||v.name||''};
  return d26ApplyClassAEdit(field,before,after,()=>{
   v.playerId=after.playerId;
   if(selected)v.name=selected.name||v.name||'';
   UI.editTx.d26ProtectedLinks=UI.editTx.d26ProtectedLinks||{};
   if(selected){
    UI.editTx.d26ProtectedLinks[selected.id]={
     id:selected.id,name:selected.name||'',source,
     sessionBefore:sessionPlayer?deepClone(sessionPlayer):null
    };
   }
  });
 }
 return false;
}

const wzSaveD26F3CBase=wzSave;

 });

/* D2.6 Fase 3D — pure Klasse B-validatie- en impactlaag in shadow mode.
   Nog geen UI-wiring en geen mutatie van UI.draft, sessies of opgeslagen handen. */
const D26_CLASS_B_FIELDS=Object.freeze(new Set([
 'heroCards','villainCards','flopCards','turnCard','riverCard','runoutCards',
 'winners','outcome','manualPotOverride'
]));

function d26ClassBClone(value){
 if(value===undefined)return undefined;
 return JSON.parse(JSON.stringify(value));
}
function d26ClassBPhysicalCards(hand){
 const d=hand||{};
 const cards=[];
 (d.heroCards||[]).forEach((card,i)=>cards.push({card,path:`hero.${i}`,owner:'Hero'}));
 (d.villains||[]).forEach((v,vi)=>(v.cards||[]).forEach((card,ci)=>cards.push({
  card,path:`v.${vi}.${ci}`,owner:`Villain ${vi+1}`
 })));
 (d.board||[]).forEach((card,i)=>cards.push({
  card,path:`board.${i}`,owner:i<3?`Flop kaart ${i+1}`:i===3?'Turn':'River'
 }));
 return cards.filter(x=>x.card&&!String(x.card).includes('?'));
}
function d26ClassBDuplicateCards(hand){
 const seen=new Map(),duplicates=[];
 for(const item of d26ClassBPhysicalCards(hand)){
  const code=d26NormalizeCardCode(item.card);
  if(!seen.has(code))seen.set(code,[item]);
  else seen.get(code).push(item);
 }
 for(const [card,items] of seen.entries()){
  if(items.length>1)duplicates.push({card,locations:items.map(x=>({path:x.path,owner:x.owner}))});
 }
 return duplicates;
}
function d26ClassBFoldedPositions(hand){
 const folded=new Set();
 for(const action of Object.values(hand?.streets||{}).flat()){
  if(action?.act==='fold'&&action.pos)folded.add(action.pos);
 }
 return folded;
}
function d26ClassBLiveVillains(hand){
 const d=hand||{},folded=d26ClassBFoldedPositions(d);
 return(d.villains||[]).filter(v=>v?.pos&&!folded.has(v.pos)).map((v,index)=>({
  id:v.id||'',
  playerId:v.playerId||'',
  pos:v.pos||'',
  legacyPos:`pos:${v.pos||''}`,
  index
 }));
}
function d26ClassBIsLiveWinner(candidate,hand,{allowHero=true}={}){
 if(!candidate)return false;
 if(allowHero&&(candidate==='hero'||candidate==='ik'))return true;
 return d26ClassBLiveVillains(hand).some(v=>
  candidate===v.id||
  candidate===v.playerId||
  candidate===v.pos||
  candidate===v.legacyPos
 );
}
function d26ClassBWinnerValid(hand){
 const d=hand||{};
 if(d.outcome==='fold')return d.winner===''||d.winner==null;
 if(d.outcome==='win')return d.winner==='hero'||d.winner==='ik';
 if(d.outcome==='lose'){
  return d26ClassBIsLiveWinner(d.winner,d,{allowHero:false});
 }
 if(d.outcome==='chop'){
  if(d.winner==='chop')return true;
  if(!Array.isArray(d.winners)||d.winners.length<2)return false;
  const normalized=d.winners.map(String);
  if(new Set(normalized).size!==normalized.length)return false;
  return normalized.every(w=>d26ClassBIsLiveWinner(w,d,{allowHero:true}));
 }
 return true;
}
function d26ClassBBoardShapeValid(hand){
 const board=Array.isArray(hand?.board)?hand.board:[];

 for(const card of board){
  if(!card)gap=true;
  else if(gap)return false;
 }
 return board.length===5;
}
function d26ClassBResultSnapshot(hand){

 return JSON.stringify({
  outcome:d.outcome,
  winner:d.winner,
  winners:d.winners,
  potMode:d.potMode,
  potBB:d.potBB,
  potChips:d.potChips,
  potOverride:d.potOverride
 });
}
function assessClassBEdit(input){
 const safe=d26ClassBClone(input)||{};
 const field=D26_FIELD_ALIASES[safe.field]||safe.field;
 const before=safe.before;
 const after=safe.after;
 const handBefore=d26ClassBClone(safe.handBefore)||{};
 const handAfter=d26ClassBClone(safe.handAfter)||{};
 const explicit=safe.explicitUserEdit===true;
 const passive=new Set(['open','render','navigation','import','migration','replay']);
 const trigger=String(safe.trigger||'');

 if(!explicit||passive.has(trigger)){
  return{
   allowed:false,
   action:'no-op-passive',
   field,
   impactClass:null,
   bettingActionsPreserved:true,
   boardValidationRequired:false,
   resultValidationRequired:false,
   duplicateCards:[],
   errors:[],
   warnings:[],
   shadow:true
  };
 }

 const classification=classifyHistoricalEdit(field,before,after,handBefore);
 if(!classification.knownField||classification.impactClass!=='B'){
  return{
   allowed:false,
   action:'reject-non-class-b',
   field,
   impactClass:classification.impactClass,
   bettingActionsPreserved:true,
   boardValidationRequired:false,
   resultValidationRequired:false,
   duplicateCards:[],
   errors:['Deze route accepteert uitsluitend bekende Klasse B-velden.'],
   warnings:[],
   shadow:true
  };
 }

 if(!classification.hasChanged){
  return{
   allowed:true,
   action:'accept-no-change',
   field,
   impactClass:'B',
   bettingActionsPreserved:true,
   boardValidationRequired:classification.affectedBoard!==false,
   resultValidationRequired:classification.affectedResult===true,
   duplicateCards:[],
   errors:[],
   warnings:[],
   shadow:true
  };
 }

 const errors=[],warnings=[];
 const duplicateCards=d26ClassBDuplicateCards(handAfter);
 if(duplicateCards.length)errors.push('De gewijzigde hand bevat dubbele fysieke kaarten.');
 if(!d26ClassBBoardShapeValid(handAfter))errors.push('Het board bevat een gat of heeft geen vijf vaste slots.');
 if(classification.affectedResult&&!d26ClassBWinnerValid(handAfter)){
  errors.push('Uitkomst en winnaar zijn niet consistent met de resterende spelers.');
 }
 if(field==='manualPotOverride'){
  warnings.push('Handmatige potoverride vereist aparte zware validatie op de finishgrens.');
  if(!safe.heavyPotValidationPassed)errors.push('De zware potoverridevalidatie is niet bevestigd.');
 }
 if(field==='heroCards'||field==='villainCards'||field==='flopCards'||field==='turnCard'||field==='riverCard'||field==='runoutCards'){
  warnings.push('Bettingacties blijven behouden; showdown en resultaat moeten opnieuw worden bevestigd.');
 }
 if(field==='winners'||field==='outcome'){
  warnings.push('Bettingacties blijven behouden; alleen finish- en resultaatvalidatie is toegestaan.');
 }

 return{
  allowed:errors.length===0,
  action:errors.length?'reject-validation':'accept-class-b',
  field,
  impactClass:'B',
  bettingActionsPreserved:true,
  affectedActions:false,
  boardValidationRequired:classification.affectedBoard!==false,
  resultValidationRequired:classification.affectedResult===true,
  validationMode:classification.validationMode,
  special:classification.special,
  duplicateCards,
  beforeResult:d26ClassBResultSnapshot(handBefore),
  afterResult:d26ClassBResultSnapshot(handAfter),
  errors,
  warnings,
  shadow:true
 };
}

function d26ClassBCardFieldForPath(path){

  const i=Number(p[1]);

function d26ValidCardPath(hand,path){

 }
 if(p.length===3&&p[0]==='v'&&/^\d+$/.test(p[1])&&/^(0|1)$/.test(p[2])){
  const vi=Number(p[1]);
  return Number.isInteger(vi)&&vi>=0&&
   Array.isArray(hand?.villains)&&vi<hand.villains.length&&
   Array.isArray(hand.villains[vi]?.cards)&&hand.villains[vi].cards.length===2;
 }
 if(p.length===2&&p[0]==='board'&&/^[0-4]$/.test(p[1])){

 return false;

 if(p[0]==='v'){
  const vi=Number(p[1]),ci=Number(p[2]);

  sortPair(hand.villains[vi].cards);

 if(p[0]==='board'){

function d26ApplyCardChoiceToHand(hand,path,card){
 const working=deepClone(hand);

 if(!d26ValidCardPath(working,path)){
  return{
   allowed:false,
   decision:{
    action:'invalid-target',
    allowed:false,
    card,
    source,
    displacements:[],
    message:'Ongeldige kaartlocatie.'
   },
   hand:working
  };
 }

 if(card===null){
  if(!d26SetCardOnHand(working,path,null)){
   return{
    allowed:false,
    decision:{
     action:'invalid-target',
     allowed:false,
     card:null,
     source,
     displacements:[],
     message:'Ongeldige kaartlocatie.'
    },
    hand:working
   };
  }
  return{
   allowed:true,
   decision:{
    action:'clear-card',
    allowed:true,
    card:null,
    source,
    displacements:[],
    message:'Kaart gewist.'
   },
   hand:working

 }

 const decision=decideCardDisplacement({
  card,

 if(!decision.allowed)return{allowed:false,decision,hand:working};

 for(const displacement of decision.displacements||[]){

  if(displacedPath)d26SetCardOnHand(working,displacedPath,null);

 if(!d26SetCardOnHand(working,path,card)){
  return{
   allowed:false,
   decision:{
    ...decision,

function d26ApplyClassBCardEdit(path,card){

 }catch(_){

function d26ApplyResultChoiceToHand(hand,mode,actors){

  return{allowed:false,reliable:false,action:'calculated-pot-error',finalPot:null,unit:s.type==='cash'?'cash':'bb',unknownAllInPositions:[],message:'De berekende pot kon niet worden bepaald.'};

function d26ParsePotOverrideInput(input){

 if(!raw)return{allowed:false,action:'invalid-pot-empty',raw,value:null,message:'Vul een handmatige pot in.'};
 let parsed;
 if(/[mM]\s*$/.test(raw)){
  const body=raw.slice(0,-1).trim().replace(/\s/g,'');
  if(!/^\d+(?:[,.]\d+)?$/.test(body))return{allowed:false,action:'invalid-pot-number',raw,value:null,message:'Gebruik een geldige potwaarde.'};
  const value=Number(body.replace(',','.'))*1000000;
  parsed={valid:Number.isFinite(value),value};
 }else if(/[kK]\s*$/.test(raw)){
  const body=raw.slice(0,-1).trim().replace(/\s/g,'');
  if(!/^\d+(?:[,.]\d+)?$/.test(body))return{allowed:false,action:'invalid-pot-number',raw,value:null,message:'Gebruik een geldige potwaarde.'};
  const value=Number(body.replace(',','.'))*1000;
  parsed={valid:Number.isFinite(value),value};
 }else{
  parsed=parsePlainNumber(raw);
 }
 if(!parsed?.valid||!Number.isFinite(parsed.value))return{allowed:false,action:'invalid-pot-number',raw,value:null,message:'Gebruik een geldige potwaarde.'};
 if(parsed.value<=0)return{allowed:false,action:'invalid-pot-positive',raw,value:parsed.value,message:'De handmatige pot moet groter zijn dan nul.'};
 if(parsed.value>Number.MAX_SAFE_INTEGER)return{allowed:false,action:'invalid-pot-overflow',raw,value:parsed.value,message:'De handmatige pot is te groot.'};

function d26PotOverrideDifference(calculated,manual){

function d26PrepareHistoricalSaveState(){
 const tx=UI.editTx,w=UI.wz,d=UI.draft;
 if(!tx||!w||!d)return false;

 /* De D2-working-copy opent vanaf setup en had niet altijd de legacy
    savecontext voor een reeds afgeronde hand. Zonder deze context kan
    wzSave() ten onrechte opnieuw om een winnaar vragen. */
 w.editingExisting=true;
 w.originalOutcome=w.originalOutcome||d.outcome||tx.original?.outcome||'';
 w.originalWinner=w.originalWinner||d.winner||tx.original?.winner||'';

 if(!Array.isArray(w.winners))w.winners=[];
 if(!w.winners.length){
  const derived=wzWinnersFromHand(d);
  if(Array.isArray(derived)&&derived.length)w.winners=derived;
 }
 return true;
}

d26SaveHistoricalEditTransaction=function(){
 if(!UI.editTx||!UI.wz||!UI.draft)return false;
 if(d26HistoricalEditHasPendingConfirmation()){
  toast('Rond eerst de openstaande bevestiging af.',3400);
  return false;
 }

 const tx=UI.editTx;
 const sid=UI.sid;
 const w=UI.wz,d=UI.draft;
 const snapshot={
  street:w.street,
  review:w.review,
  closePrompt:w.closePrompt,
  navigation:deepClone(w.navigation),
  activeStreet:d.activeStreet,
  error:w.error
 };
 const storedActive=d.activeStreet||w.street||'pf';

 d26PrepareHistoricalSaveState();

 /* wzSave() mag de tijdelijke previewstraat niet als nieuwe handstraat opslaan. */
 w.street=storedActive;
 w.review=storedActive;
 w.closePrompt=false;
 w.error='';

 wzSave();

 const committed=!UI.editTx;
 if(committed){
  /* wzSave() verlaat naar share; historische edit sluit bewust terug naar sessie. */
  UI.wz=null;
  UI.draft=null;
  UI.hid=null;
  go('session',sid);
  toast('Wijzigingen opgeslagen.');
  return true;
 }

 /* Geen commit: herstel exact dezelfde historische presentatiestate. */
 if(UI.wz&&UI.draft){
  UI.wz.street=snapshot.street;
  UI.wz.review=snapshot.review;
  UI.wz.closePrompt=snapshot.closePrompt;
  UI.wz.navigation=deepClone(snapshot.navigation);
  UI.draft.activeStreet=snapshot.activeStreet;
  if(!UI.wz.error)UI.wz.error=snapshot.error||'De wijzigingen konden niet worden opgeslagen.';
  UI.editTx.working=UI.draft;
  UI.editTx.dirty=d2IsDirty();
  render();
 }
 return false;
};

function rc7F4ParseBountyCount(raw){

function rc7F4ApplyVillainBounty(vi,after){
 const d=UI.draft,v=d?.villains?.[vi];
 if(!UI.editTx||!v)return false;
 const before=v.bounty||'';
 if(String(before)===String(after))return true;
 const snapshot=deepClone(d),generation=d26ClassAGeneration();
 const cleanFingerprint=hand=>{
  const copy=deepClone(hand);
  if(copy.villains?.[vi])copy.villains[vi].bounty='';
  return d26ClassAProtectedFingerprint(copy);
 };
 const protectedBefore=cleanFingerprint(d);
 try{
  v.bounty=after;
  if(cleanFingerprint(d)!==protectedBefore)throw new Error('protected-state-changed');
  if(d26ClassAGeneration()!==generation)throw new Error('generation-changed');
  UI.editTx.working=d;UI.editTx.dirty=d2IsDirty();
  return true;
 }catch(_){
  UI.draft=snapshot;UI.editTx.working=UI.draft;return false;
 }
}

const d26InlineAHistoryBodyRC7F43Base=d26InlineAHistoryBody;
d26InlineAHistoryBody=function(body){
 const html=d26InlineAHistoryBodyRC7F43Base(body);
 if(!UI.editTx||!d1Historical())return html;
 const tpl=document.createElement('template');tpl.innerHTML=html;
 const root=tpl.content,s=currentSession();

 if(UI.wz?.step==='players'&&s?.type==='mtt'&&s.subtype==='pko'){
  rc7F43ReplaceFieldBlock(root,'[data-rc7-f4-own-bounty]','ownBountyValue','Eigen bounty vóór hand');
  (UI.draft?.villains||[]).forEach((_,i)=>{
   rc7F43ReplaceFieldBlock(root,`[data-rc7-f4-villain-bounty="${i}"]`,'villainBounty','Bounty op villain',i);
  });
 }

 if(UI.wz?.step==='finish'&&s?.type==='mtt'){
  if(s.subtype==='pko'||s.subtype==='mystery'){
   rc7F43ReplaceFieldBlock(root,'[data-rc7-f4-bounty-won]','bountyWon','Bounty gewonnen');
  }
  if(s.subtype==='ko'){
   rc7F43ReplaceFieldBlock(root,'[data-rc7-f4-bounty-count]','bountyCount','Aantal gewonnen bounties',null,'number');
  }
 }
 return tpl.innerHTML;
};

document.addEventListener('click',e=>{
 const button=e.target.closest('button');
 if(!button||!UI.editTx||!UI.wz)return;

 if(button.dataset.rc7F43Edit!==undefined){
  e.preventDefault();e.stopImmediatePropagation();
  const field=button.dataset.rc7F43Edit;
  const vi=button.dataset.rc7F43Vi==null?null:Number(button.dataset.rc7F43Vi);
  const before=rc7F43BountyValue(field,vi);
  UI.wz.rc7F43Bounty={field,vi,before,raw:before};
  return render();
 }

 if(button.dataset.rc7F43Cancel!==undefined){
  e.preventDefault();e.stopImmediatePropagation();
  UI.wz.rc7F43Bounty=null;
  return render();
 }

 if(button.dataset.rc7F43Save!==undefined){
  e.preventDefault();e.stopImmediatePropagation();
  const state=rc7F43BountyState();
  if(!state)return;
  const liveInput=document.querySelector('[data-rc7-f43-input]');
  let after=liveInput?liveInput.value:state.raw;
  let ok=false;

  if(state.field==='bountyCount'){
   const parsed=rc7F4ParseBountyCount(after);
   if(!parsed.valid){
    toast('Vul een niet-negatief getal met maximaal 2 decimalen in.',3400);
    return;
   }
   after=parsed.empty?'':rc7F4NormalizeCount(parsed.value);
  }

  if(state.field==='ownBountyValue'){
   ok=d26ApplyClassAEdit('ownBountyValue',state.before,after,()=>{UI.draft.ownBounty=after});
  }else if(state.field==='bountyWon'){
   ok=d26ApplyClassAEdit('bountyWon',state.before,after,()=>{UI.draft.bountyWon=after});
  }else if(state.field==='bountyCount'){
   ok=d26ApplyClassAEdit('bountyCount',state.before,after,()=>{UI.draft.bountyCount=after});
  }else if(state.field==='villainBounty'){
   ok=rc7F4ApplyVillainBounty(state.vi,after);
  }

  if(ok){
   UI.wz.rc7F43Bounty=null;
   return render();
  }
  toast('De bountywijziging kon niet worden toegepast.',3400);
 }
},true);

function rc7F44NavigationSnapshot(){
 const nav=d1Nav();
 return nav?deepClone({
  generation:nav.generation,
  cursor:nav.cursor,
  trail:nav.trail,
  suppressRecord:false
 }):null;
}
function rc7F44RestoreNavigation(snapshot){
 if(!snapshot||!UI.wz)return;
 UI.wz.navigation=deepClone(snapshot);
 UI.wz.navigation.suppressRecord=false;
}
function rc7F44RenderPreservingNavigation(snapshot){
 if(snapshot&&UI.wz){
  UI.wz.navigation=deepClone(snapshot);
  UI.wz.navigation.suppressRecord=true;
 }
 render();
 if(snapshot&&UI.wz){
  UI.wz.navigation.suppressRecord=false;
  UI.wz.navigation.generation=snapshot.generation;
  UI.wz.navigation.cursor=snapshot.cursor;
  UI.wz.navigation.trail=deepClone(snapshot.trail);
 }
}
function rc7F44FocusEditor(){
 queueMicrotask(()=>{
  const editor=document.querySelector('[data-rc7-f44-editor]');
  if(!editor)return;
  editor.focus();
  const selection=window.getSelection();
  const range=document.createRange();
  range.selectNodeContents(editor);
  selection.removeAllRanges();
  selection.addRange(range);
 });
}

/* ---------- Resultaatkandidaten en actuele winnaarstate ---------- */

d26ResultLiveActors=function(hand){
 const d=hand||{},folded=d26ClassBFoldedPositions(d),actors=[],errors=[];
 const seenActors=new Set(),seenCanonical=new Set();
 const push=c=>{
  if(!c.actor||!c.canonical)return;
  if(seenActors.has(c.actor)||seenCanonical.has(String(c.canonical)))return;
  seenActors.add(c.actor);seenCanonical.add(String(c.canonical));actors.push(c);
 };
 const heroPos=String(d.heroPos||'').trim();
 if(heroPos&&!folded.has('ik')){
  push({actor:'ik',label:`${heroPos} (Ik)`,canonical:'hero',position:heroPos,villainIndex:null,id:'',playerId:''});
 }
 (d.villains||[]).forEach((v,i)=>{
  const pos=String(v.pos||'').trim();
  if(!pos||folded.has(pos))return;
  const actor=d26ResultActorForPosition(d,pos);
  const canonical=String(v.id||v.playerId||`pos:${pos}`);
  const name=String(v.name||'').trim();
  push({
   actor,
   label:name?`${pos} (${name})`:pos,
   canonical,
   position:pos,
   villainIndex:i,
   id:String(v.id||''),
   playerId:String(v.playerId||'')
  });
 });
 return{actors,errors};
};

/* ===== v2.6 RC7 Ronde D2.6 Fase 6.4 — labelresolver uitkomstsamenvatting ===== */

/*
 Opgeslagen winners bevatten canonieke waarden:
 - hero
 - Villain-id
 - playerId
 - pos:<positie>

 De Fase 6.3-samenvatting zocht alleen op actorcode en kon daardoor interne
 identifiers tonen. Deze resolver gebruikt dezelfde live kandidaatobjecten
 als de editor en ondersteunt alle opslagvormen zonder interne ids te tonen.
*/
function f64ResultLabel(token,hand,live){
 const d=hand||{},raw=String(token||'').trim();
 if(!raw)return'';

 const hero=live.find(x=>x.actor==='ik'||String(x.canonical)==='hero');
 if(raw==='hero'||raw==='ik')return hero?.label||`${d.heroPos||'Hero'} (Ik)`;

 const normalizedPos=raw.startsWith('pos:')?raw.slice(4):raw;
 const hit=live.find(x=>
  String(x.actor)===raw||
  String(x.canonical)===raw||
  String(x.id||'')===raw||
  String(x.playerId||'')===raw||
  String(x.position||'')===normalizedPos||
  `pos:${x.position}`===raw
 );
 if(hit)return hit.label;

 const villain=(d.villains||[]).find(v=>
  String(v.id||'')===raw||
  String(v.playerId||'')===raw||
  String(v.pos||'')===normalizedPos
 );
 if(villain){
  const pos=String(villain.pos||'').trim();
  const name=String(villain.name||'').trim();
  return name&&pos?`${pos} (${name})`:name||pos||'Onbekende speler';
 }

 return'Onbekende speler';
}

function f65ShareProjection(hand){

 if(!h||typeof h!=='object')return null;

 h.id=String(hand.id||'');
