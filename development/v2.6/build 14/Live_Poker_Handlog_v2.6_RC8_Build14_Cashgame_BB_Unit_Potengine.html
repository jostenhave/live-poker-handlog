 h.streets=h.streets&&typeof h.streets==='object'
  ?h.streets
  :{pf:[],flop:[],turn:[],river:[]};

 for(const key of ['pf','flop','turn','river']){
  if(!Array.isArray(h.streets[key]))h.streets[key]=[];
 }

 if(h.outcome==='chop'){
  const actors=d26ResultActorsFromHand(h);
  /*
   De rapportlaag verwacht voor de chopregel actorcodes. Alleen de projectie
   krijgt deze vorm; de canonieke opslag in het handrecord blijft behouden.
  */
  h.winners=actors.length>=2?actors:(Array.isArray(h.winners)?h.winners:[]);
  h.winner='chop';
 }
 return h;
}

function f65OpenStoredHandReadView(id){
 const s=currentSession();
 const hand=s?.hands?.find(x=>String(x.id)===String(id));
 if(!s||!hand){
  toast('De opgeslagen hand kon niet worden gevonden.',2800);
  return false;
 }

 const previous={
  screen:UI.screen,
  sid:UI.sid,
  hid:UI.hid,
  draft:UI.draft,
  wz:UI.wz,
  editTx:UI.editTx
 };

 UI.confirm=null;
 UI.actionEdit=null;
 UI.sid=s.id;
 UI.hid=hand.id;
 UI.draft=null;
 UI.wz=null;
 UI.editTx=null;
 UI.screen='share';

 try{
  render();
  scrollTo(0,0);
  return true;
 }catch(error){
  console.error('F6.5 normale handkaart-openroute',error);
  Object.assign(UI,previous);
  render();
  toast('De hand kon niet worden geopend. De gegevens zijn behouden.',3400);
  return false;
 }
}

/* De leesweergave gebruikt een veilige projectie, nooit een mutatie van opslag. */
const rShareF65Base=rShare;
rShare=function(){
 const s=currentSession();
 const stored=s?.hands?.find(x=>String(x.id)===String(UI.hid));
 if(!stored){
  return`<div class="top"><button class="back" data-go="session">←</button><h1>Hand niet gevonden</h1></div>
   <div class="panel">De opgeslagen hand bestaat niet meer.</div>`;
 }
 const projected=f65ShareProjection(stored);
 if(!projected){
  return`<div class="top"><button class="back" data-go="session">←</button><h1>Hand niet leesbaar</h1></div>
   <div class="panel">De handdata kon niet veilig worden gelezen.</div>`;
 }

 /*
  rShareF65Base zoekt zelf op UI.hid. Daarom vervangen we het record heel kort
  in een lokale arraypositie, renderen de bestaande leesweergave en herstellen
  onmiddellijk hetzelfde object. Geen save(), geen wijziging van record-ID.
 */
 const index=s.hands.indexOf(stored);
 s.hands[index]=projected;
 try{
  return rShareF65Base();
 }finally{
  s.hands[index]=stored;
 }
};

/* ===== v2.6 RC7 Ronde D2.6 Fase 6.6 — pure choprapportage ===== */

/*
 De lees-/deelweergave heeft bewust geen UI.draft. De oude chopformatter
 bereikte via wzPosOf()/wzActor() alsnog UI.draft en kon daardoor crashen.
 Deze resolver gebruikt uitsluitend het expliciet meegegeven handobject.
*/
function f66ChopParticipant(actor,hand){
 const h=hand||{};
 const raw=String(actor||'').trim();
 if(!raw)return{label:'',position:'',isHero:false};

 const heroPos=String(h.heroPos||'').trim();
 if(raw==='ik'||raw==='hero'||raw===heroPos){
  return{label:'Ik',position:heroPos,isHero:true};
 }

 const normalizedPos=raw.startsWith('pos:')?raw.slice(4):raw;
 const villain=(h.villains||[]).find(v=>{
  const pos=String(v.pos||'').trim();
  return raw===String(v.id||'').trim()||
   raw===String(v.playerId||'').trim()||
   raw===pos||
   normalizedPos===pos;
 });

 if(villain){
  const position=String(villain.pos||'').trim();
  const name=String(villain.name||'').trim();
  return{
   label:name||position||'Onbekende speler',
   position,
   isHero:false
  };
 }

 return{
  label:normalizedPos||'Onbekende speler',
  position:normalizedPos,
  isHero:false
 };
}

rc7F42ChopDisplayName=function(actor,hand){
 return f66ChopParticipant(actor,hand).label;
};

rc7F42ChopSummary=function(actors,hand){
 const h=hand||{};
 if(!Array.isArray(actors)||actors.length<2)return'';
 const names=rc7F42JoinNames(
  actors.map(actor=>f66ChopParticipant(actor,h).label).filter(Boolean)
 );
 if(!names)return'';
 return`Chop: ${names} — pot ${rc7F42PotText(h)}`;
};

function f67SingleVillainWinner(hand,session){
 const h=hand||{},raw=String(h.winner||'').trim();
 if(!raw||raw==='hero'||raw==='ik'||h.outcome!=='lose')return null;
 const normalizedPos=raw.startsWith('pos:')?raw.slice(4):raw;
 const villain=(h.villains||[]).find(v=>
  String(v.id||'')===raw||
  String(v.playerId||'')===raw||
  String(v.pos||'')===normalizedPos
 );
 if(!villain)return null;
 const position=String(villain.pos||normalizedPos||'Villain').trim()||'Villain';
 const sessionPlayer=(session?.players||[]).find(p=>String(p.id)===String(villain.playerId||''));
 const name=String(villain.name||sessionPlayer?.name||'').trim();
 return{
  position,
  name,
  label:name?`${position} (${name})`:position
 };
}

/*
 De finale rapportwrapper wijzigt alleen de resultaatregel bij exact één
 niet-Hero-winnaar. Alle overige rapportregels en formatters blijven intact.
*/
const shareTextF67Base=shareText;
shareText=function(session,hand){
 const txt=shareTextF67Base(session,hand);
 const winner=f67SingleVillainWinner(hand,session);
 if(!winner)return txt;

 const reliable=hand?.potReliable!==false&&!(hand?.unknownAllInPositions||[]).length;
 const potText=reliable?rc7F42PotText(hand):'';
 const replacement=potText
  ?`${winner.label} - wint pot ${potText}`
  :`${winner.label} - wint pot`;

 const lines=String(txt||'').split('\n');
 const index=lines.findIndex(line=>/^Ik verlies(?:\s|$)/.test(line));
 if(index>=0)lines[index]=replacement;
 return lines.join('\n');
};

/* ===== v2.6 RC8 Build 11 — definitieve K/M/B formatterconsolidatie ===== */
function rc8Build11FormatChip(v,maxDecimals=2){
 if(v===''||v==null||String(v).trim()==='')return'';
 const parsed=rc8Build10ParseChip(v);
 if(!parsed.valid)return String(v??'');
 const n=Math.max(0,parsed.value);
 let divisor=1,suffix='';
 if(n>=1e9){divisor=1e9;suffix='B'}
 else if(n>=1e6){divisor=1e6;suffix='M'}
 else if(n>=1e3){divisor=1e3;suffix='K'}
 if(!suffix)return Number.isInteger(n)?String(n):String(n).replace('.',',');
 const factor=10**maxDecimals;
 const truncated=Math.floor((n/divisor)*factor)/factor;
 return truncated.toFixed(maxDecimals)
  .replace(/\.00$/,'')
  .replace(/(\.\d)0$/,'$1')
  .replace('.',',')+suffix;
}
