}

const IMG_COL={s:'#F2F5FA',h:'#FF7B7F',d:'#7FAAFF',c:'#7FE0A7',x:'#B9C2CE'};
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function renderReportCanvas(txt){const dpr=2,padX=28,padY=26,fs=27,lh=Math.round(fs*1.45),font=fs+'px ui-monospace, SFMono-Regular, Menlo, monospace';const meas=document.createElement('canvas').getContext('2d');meas.font=font;const lines=txt.split('\n');let maxW=0;lines.forEach(l=>maxW=Math.max(maxW,meas.measureText(l).width));const W=Math.ceil(maxW+padX*2),H=Math.ceil(lines.length*lh+padY*2);const cv=document.createElement('canvas');cv.width=W*dpr;cv.height=H*dpr;const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);ctx.fillStyle='#0b141a';ctx.fillRect(0,0,W,H);ctx.fillStyle='#134d37';roundRect(ctx,10,10,W-20,H-20,16);ctx.fill();ctx.font=font;ctx.textBaseline='top';const seqRe=/(?<![A-Za-z0-9])(?:[AKQJTX2-9][shdcx])+(?![A-Za-z0-9])/g,cardRe=/([AKQJTX2-9])([shdcx])/g;lines.forEach((line,li)=>{let x=padX,y=padY+li*lh,last=0,m;while((m=seqRe.exec(line))){if(m.index>last){const t=line.slice(last,m.index);ctx.fillStyle='#E9EDF2';ctx.fillText(t,x,y);x+=ctx.measureText(t).width}let cm;cardRe.lastIndex=0;while((cm=cardRe.exec(m[0]))){const t=cm[0];ctx.fillStyle=IMG_COL[cm[2]]||'#E9EDF2';ctx.fillText(t,x,y);x+=ctx.measureText(t).width}last=m.index+m[0].length}if(last<line.length){const t=line.slice(last);ctx.fillStyle='#E9EDF2';ctx.fillText(t,x,y)}});return cv}

function deepClone(v){return JSON.parse(JSON.stringify(v))}
function normalizePlayerName(v){return String(v||'').trim().replace(/\s+/g,' ').toLocaleLowerCase('nl-NL')}
function safeStorageSet(k,v){try{localStorage.setItem(k,v);return true}catch(e){STORAGE_AVAILABLE=false;return false}}
function validateDatabaseShape(db){if(!db||typeof db!=='object'||Array.isArray(db))throw new Error('De database heeft geen geldige hoofdstructuur.');if(!Array.isArray(db.sessions))throw new Error('De sessiegegevens hebben geen geldige structuur.');if(!Array.isArray(db.playerLibrary))throw new Error('De spelersgegevens hebben geen geldige structuur.');if(!db.prefs||typeof db.prefs!=='object'||Array.isArray(db.prefs))throw new Error('De instellingen hebben geen geldige structuur.');db.sessions.forEach((s,i)=>{if(!s||typeof s!=='object'||!Array.isArray(s.hands)||!Array.isArray(s.players))throw new Error('Sessie '+(i+1)+' is beschadigd.');});return true}

function assertUniqueIds(records,label){
  const seen=new Set();
  records.forEach((r,i)=>{
    if(!r||typeof r!=='object'||Array.isArray(r))throw new Error(label+' '+(i+1)+' is geen geldig record.');
    if(!String(r.id||'').trim())throw new Error(label+' '+(i+1)+' heeft geen geldige ID.');
    if(seen.has(r.id))throw new Error(label+' bevat een dubbele ID: '+r.id+'.');
    seen.add(r.id);
  });
}
function validateBackupRecords(b){
  const cats=b.metadata.categories||[];
  if(cats.includes('players')){
    assertUniqueIds(b.data.players,'Speler');
    b.data.players.forEach((p,i)=>{if(!String(p.name||'').trim())throw new Error('Speler '+(i+1)+' heeft geen naam.');});
  }
  if(cats.includes('sessions')){
    assertUniqueIds(b.data.sessions,'Sessie');
    const availablePlayers=new Set((b.data.players||[]).map(p=>p.id));
    b.data.sessions.forEach((s,si)=>{
      if(!Array.isArray(s.players)||!Array.isArray(s.hands))throw new Error('Sessie '+(si+1)+' heeft geen geldige spelers- of handenlijst.');
      assertUniqueIds(s.players,'Sessiespeler in sessie '+(si+1));
      assertUniqueIds(s.hands,'Hand in sessie '+(si+1));
      const sessionPlayerIds=new Set(s.players.map(p=>p.id));
      s.players.forEach(p=>availablePlayers.add(p.id));
      s.hands.forEach((h,hi)=>{
        if(Object.prototype.hasOwnProperty.call(h,'sessionId')&&String(h.sessionId)!==String(s.id))throw new Error('Hand '+(hi+1)+' in sessie '+(si+1)+' verwijst naar een andere sessie.');
        if(!h.streets||typeof h.streets!=='object'||Array.isArray(h.streets))throw new Error('Hand '+(hi+1)+' in sessie '+(si+1)+' heeft geen geldige actielijst.');
        if(h.villains!==undefined&&!Array.isArray(h.villains))throw new Error('Hand '+(hi+1)+' in sessie '+(si+1)+' heeft geen geldige villainlijst.');
        (h.villains||[]).forEach((v,vi)=>{
          if(!v||typeof v!=='object'||Array.isArray(v))throw new Error('Villain '+(vi+1)+' in hand '+(hi+1)+' is ongeldig.');
          if(v.playerId&&!sessionPlayerIds.has(v.playerId))throw new Error('Villain '+(vi+1)+' in hand '+(hi+1)+' verwijst niet naar een speler in dezelfde sessie.');
        });
      });
    });
  }
}
function validateBackup(b,requireFull=false){
  if(!b||typeof b!=='object'||Array.isArray(b)||!b.metadata||!b.data)throw new Error('Dit bestand is geen geldige Live Poker Handlog-back-up.');
  if(!Number.isInteger(Number(b.metadata.backupVersion))||Number(b.metadata.backupVersion)<1)throw new Error('De back-upversie ontbreekt of is ongeldig.');
  if(!Number.isInteger(Number(b.metadata.schemaVersion))||Number(b.metadata.schemaVersion)<1)throw new Error('De schema-versie ontbreekt of is ongeldig.');
  if(!Array.isArray(b.metadata.categories))throw new Error('De metadata met categorieën ontbreekt.');
  const allowed=['players','sessions','settings'],cats=b.metadata.categories;
  if(!cats.length||cats.some(x=>!allowed.includes(x))||new Set(cats).size!==cats.length)throw new Error('De categorieaanduiding in de back-up is ongeldig.');
  if(Number(b.metadata.backupVersion)>BACKUP_VERSION||Number(b.metadata.schemaVersion)>SCHEMA_VERSION)throw new Error('Deze back-up is gemaakt met een nieuwere, nog niet ondersteunde versie.');
  if(requireFull&&!allowed.every(x=>cats.includes(x)))throw new Error('Voor volledig herstel is een back-up met spelers, sessies én instellingen vereist.');
  if(cats.includes('players')&&!Array.isArray(b.data.players))throw new Error('De spelerscategorie is beschadigd.');
  if(cats.includes('sessions')&&!Array.isArray(b.data.sessions))throw new Error('De sessiecategorie is beschadigd.');
  if(cats.includes('settings')&&(!b.data.settings||typeof b.data.settings!=='object'||Array.isArray(b.data.settings)))throw new Error('De instellingencategorie is beschadigd.');
  if(!cats.includes('players')&&Object.prototype.hasOwnProperty.call(b.data,'players'))throw new Error('De inhoud en categorieaanduiding voor spelers komen niet overeen.');
  if(!cats.includes('sessions')&&Object.prototype.hasOwnProperty.call(b.data,'sessions'))throw new Error('De inhoud en categorieaanduiding voor sessies komen niet overeen.');
  if(!cats.includes('settings')&&Object.prototype.hasOwnProperty.call(b.data,'settings'))throw new Error('De inhoud en categorieaanduiding voor instellingen komen niet overeen.');
  validateBackupRecords(b);
  return true;
}
function mergePlayers(local,incoming){const out=deepClone(local),idMap={};incoming.forEach(p=>{let m=out.find(x=>x.id&&p.id&&x.id===p.id);if(!m){const nk=normalizePlayerName(p.name),matches=out.filter(x=>normalizePlayerName(x.name)===nk);if(matches.length===1)m=matches[0];else if(matches.length>1){const choice=prompt('Meerdere lokale spelers passen bij "'+(p.name||'Naamloos')+'". Vul exact de lokale speler-ID in of laat leeg voor een nieuwe speler.','');m=out.find(x=>x.id===choice)}}if(m){idMap[p.id]=m.id;Object.keys(p).forEach(k=>{if((m[k]===undefined||m[k]===''||m[k]===null)&&p[k]!==undefined)m[k]=deepClone(p[k])})}else{const n=deepClone(p);if(!n.id||out.some(x=>x.id===n.id))n.id=uid();if(p.id)idMap[p.id]=n.id;out.push(n)}});return{players:out,idMap}}
function remapSessionPlayers(s,idMap){const n=deepClone(s);(n.players||[]).forEach(p=>{if(idMap[p.id])p.id=idMap[p.id];if(idMap[p.playerId])p.playerId=idMap[p.playerId]});(n.hands||[]).forEach(h=>(h.villains||[]).forEach(v=>{if(idMap[v.playerId])v.playerId=idMap[v.playerId]}));return n}
function materiallyEqual(a,b){return JSON.stringify(a)===JSON.stringify(b)}
function buildImportedDatabase(backup,mode,selection){validateBackup(backup);const cats=backup.metadata.categories.filter(c=>selection[c]);let stage=mode==='replace'?deepClone(DB):deepClone(DB),idMap={};if(mode==='replace'){if(cats.includes('players'))stage.playerLibrary=deepClone(backup.data.players);if(cats.includes('sessions'))stage.sessions=deepClone(backup.data.sessions);if(cats.includes('settings'))stage.prefs=deepClone(backup.data.settings)}else{if(cats.includes('players')){const mp=mergePlayers(stage.playerLibrary||[],backup.data.players||[]);stage.playerLibrary=mp.players;idMap=mp.idMap}if(cats.includes('sessions')){(backup.data.sessions||[]).forEach(raw=>{const inc=remapSessionPlayers(raw,idMap),idx=stage.sessions.findIndex(x=>x.id===inc.id);if(idx<0)stage.sessions.push(inc);else if(!materiallyEqual(stage.sessions[idx],inc)){const replace=confirm('Sessieconflict: "'+(inc.name||inc.id)+'" bestaat lokaal met andere inhoud. OK = geïmporteerde sessie gebruiken; Annuleren = lokale sessie behouden.');if(replace)stage.sessions[idx]=inc}})}if(cats.includes('settings'))stage.prefs=Object.assign({},stage.prefs||{},deepClone(backup.data.settings||{}))}stage=migrateObject(stage);validateDatabaseShape(stage);return stage}
function promoteStaging(stage,destructive){const old=deepClone(DB);if(destructive&&!safeStorageSet(SAFETY_KEY,JSON.stringify(makeBackup({players:true,sessions:true,settings:true}))))throw new Error('De veiligheidskopie kon niet worden opgeslagen.');try{safeStorageSet('hhl:v12:staging',JSON.stringify(stage));validateDatabaseShape(JSON.parse(localStorage.getItem('hhl:v12:staging')));DB=stage;if(!persistNow())throw new Error('De actieve gegevens konden niet worden opgeslagen.');localStorage.removeItem('hhl:v12:staging');localStorage.removeItem(FAILED_KEY);return true}catch(e){DB=old;safeStorageSet(FAILED_KEY,JSON.stringify(stage));throw e}}
function performImport(requireFull=false){
  try{
    const b=UI.importFile;
    validateBackup(b,requireFull);
    const replaceMode=requireFull||UI.importMode==='replace';
    if(replaceMode&&!requireFull){
      const selected=(b.metadata.categories||[]).filter(c=>UI.importSelection[c]).map(c=>c==='players'?'spelers':c==='sessions'?'sessies en handen':'instellingen');
      const what=selected.length?selected.join(', '):'de geselecteerde gegevens';
      if(!confirm('Je staat op het punt '+what+' te vervangen. De app maakt eerst een veiligheidskopie van je huidige gegevens.\n\nDoorgaan?'))return;
    }
    const sel=requireFull?{players:true,sessions:true,settings:true}:UI.importSelection;
    const stage=buildImportedDatabase(b,replaceMode?'replace':'merge',sel);
    promoteStaging(stage,replaceMode);
    UI.importInfo=null;
    UI.importFile=null;
    EMERGENCY_MODE=false;
    alert('Import voltooid.');
    go('home');
  }catch(e){
    alert('Import niet uitgevoerd: '+e.message+' De actieve gegevens zijn niet gewijzigd.');
  }
}
function formatPlayerStartStack(s,h,p){if(s.type==='cash'){return p.stackChips!==''&&p.stackChips!=null&&num(p.stackChips)>0?money(s,p.stackChips):''}const bbv=p.stackBB!==''&&p.stackBB!=null&&num(p.stackBB)>0?fmtBB(p.stackBB):'',chips=p.stackChips!==''&&p.stackChips!=null&&num(p.stackChips)>0?fmtChips(p.stackChips):'';return bbv&&chips?bbv+' ('+chips+')':bbv||chips}
function mergeVillainFields(base,v){const out=deepClone(base);Object.keys(v).forEach(k=>{const cur=out[k],val=v[k];const empty=cur===undefined||cur===null||cur===''||(Array.isArray(cur)&&!cur.some(Boolean));if(empty&&val!==undefined&&val!==null&&val!=='')out[k]=deepClone(val);else if(k==='cards'&&Array.isArray(val)){out.cards=out.cards||[null,null];val.forEach((c,i)=>{if(!out.cards[i]&&c)out.cards[i]=c})}});return out}

/* ===== v2.6 RC2 overrides ===== */
function wzKnownStack(actor){
  const d=UI.draft,s=currentSession(),bb=num(d.bb);
  if(actor==='ik'){
    if(s.type==='cash')return d.heroStackChips!==''?num(d.heroStackChips):null;
    if(d.heroStackChips!==''&&bb)return num(d.heroStackChips)/bb;
    if(d.heroStackBB!=='')return num(d.heroStackBB);
    return null;
  }
  const pos=wzPosOf(actor),v=(d.villains||[]).find(x=>x.pos===pos);
  if(!v)return null;
  if(s.type==='cash')return v.stackChips!==''?num(v.stackChips):null;
  if(v.stackChips!==''&&bb)return num(v.stackChips)/bb;
  if(v.stackBB!=='')return num(v.stackBB);
  return null;
}
function wzUnitToBase(amt,unit,pot){
  if(amt===''||amt==null)return null;
  const d=UI.draft,s=currentSession(),bb=num(d.bb),n=num(amt);
  if(unit==='%')return pot*n/100;
  if(s.type==='cash')return unit==='bb'?n*bb:n;
  return unit==='chips'?(bb?n/bb:null):n;
}
function wzInitialStreetState(st){
  const d=UI.draft,s=currentSession(),actors=wzOrder(st);
  const state={street:st,actors:{},currentBet:0,lastFullRaise:0,lastAggressor:null,actedSinceRaise:new Set(),pending:[],closed:false};
  actors.forEach(a=>state.actors[a]={status:'active',contribution:0,raiseRight:true,acted:false});
  if(st==='pf'){
    const sbActor=wzActor(d.players===2?'BTN/SB':'SB'),bbActor=wzActor('BB');
    if(!d.sbNA&&state.actors[sbActor])state.actors[sbActor].contribution=currentSession().type==='cash'?num(d.sb):(num(d.bb)?num(d.sb)/num(d.bb):.5);
    if(state.actors[bbActor])state.actors[bbActor].contribution=currentSession().type==='cash'?num(d.bb):1;
    state.currentBet=currentSession().type==='cash'?num(d.bb):1;
    const ss=handStraddles(s,d);
    ss.forEach(x=>{
      const a=wzActor(x.pos),v=currentSession().type==='cash'?num(x.amount):(num(d.bb)?num(x.amount)/num(d.bb):0);
      if(state.actors[a])state.actors[a].contribution=v;
      if(v>state.currentBet){state.lastFullRaise=Math.max(state.lastFullRaise,v-state.currentBet);state.currentBet=v;state.lastAggressor=a}
    });
  }
  return state;
}
function wzReplayStreet(st,limit=null){
  const d=UI.draft,w=UI.wz,state=wzInitialStreetState(st),arr=d.streets[st]||[],max=limit==null?arr.length:limit;
  const potBefore=()=>analyze(currentSession(),d).potStart?.[st]||0;
  for(let i=0;i<max;i++){
    const a=arr[i],actor=a.pos,ps=state.actors[actor];
    if(!ps||ps.status!=='active')continue;
    const toCall=Math.max(0,state.currentBet-ps.contribution);
    if(a.act==='fold'){ps.status='folded';ps.acted=true;state.actedSinceRaise.add(actor);continue}
    if(a.act==='check'){ps.acted=true;state.actedSinceRaise.add(actor);continue}
    if(a.act==='call'){
      let add=toCall;
      const stack=wzKnownStack(actor);
      if(stack!=null)add=Math.min(add,Math.max(0,stack-ps.contribution));
      ps.contribution+=add;ps.acted=true;state.actedSinceRaise.add(actor);
      if(stack!=null&&Math.abs(ps.contribution-stack)<1e-7)ps.status='allin';
      continue;
    }
    if(['bet','raise','allin','jam'].includes(a.act)){
      const stack=wzKnownStack(actor),base=wzUnitToBase(a.amt,a.unit,potBefore());
      let target=base;
      if((a.act==='allin'||a.act==='jam')&&(target==null||target===0)&&stack!=null)target=stack;
      if(target==null){ps.status='allin';ps.acted=true;state.actedSinceRaise.add(actor);continue}
      if(stack!=null)target=Math.min(target,stack);
      const raiseSize=Math.max(0,target-state.currentBet);
      ps.contribution=Math.max(ps.contribution,target);ps.acted=true;
      if(target>state.currentBet+1e-7){
        const fullRaise=state.currentBet===0||raiseSize+1e-7>=Math.max(state.lastFullRaise,state.currentBet||0);
        if(fullRaise){
          state.lastFullRaise=state.currentBet===0?target:raiseSize;
          Object.entries(state.actors).forEach(([x,v])=>{if(v.status==='active'&&x!==actor)v.raiseRight=true});
        }else{
          Object.entries(state.actors).forEach(([x,v])=>{if(v.status==='active'&&state.actedSinceRaise.has(x))v.raiseRight=false});
        }
        state.currentBet=target;state.lastAggressor=actor;state.actedSinceRaise=new Set([actor]);
      }else state.actedSinceRaise.add(actor);
      if(a.act==='allin'||a.act==='jam'||(stack!=null&&Math.abs(ps.contribution-stack)<1e-7))ps.status='allin';
    }
  }
  const active=Object.entries(state.actors).filter(([,v])=>v.status==='active');
  state.pending=active.filter(([,v])=>!v.acted||v.contribution+1e-7<state.currentBet).map(([a])=>a);
  state.closed=state.pending.length===0;
  return state;
}
function wzLegalActions(){
  const w=UI.wz,state=wzReplayStreet(w.street),ps=state.actors[w.actor];
  if(!ps||ps.status!=='active')return[];
  const toCall=Math.max(0,state.currentBet-ps.contribution),stack=wzKnownStack(w.actor),remaining=stack==null?null:Math.max(0,stack-ps.contribution);
  const out=[];
  if(toCall>1e-7){out.push(['fold','Fold']);if(remaining==null||remaining>0)out.push(['call','Call']);if(ps.raiseRight&&(remaining==null||remaining>toCall))out.push(['raise','Raise'])}
  else{
    out.push(['check','Check']);
    if(state.currentBet<=1e-7)out.push(['bet','Bet']);
    else if(ps.raiseRight&&(remaining==null||remaining>0))out.push(['raise','Raise']);
  }
  if(remaining==null||remaining>0)out.push(['allin','All-in']);
  return out;
}
function wzNextPendingAfterAction(st,actor){
  const state=wzReplayStreet(st),order=wzOrder(st),start=order.indexOf(actor),pendingSet=new Set(state.pending),out=[];
  for(let i=1;i<=order.length;i++){const a=order[(start+i)%order.length];if(pendingSet.has(a))out.push(a)}
  return out;
}
function wzEligibleFirstActors(){
  const d=UI.draft,order=wzOrder('pf'),straddlers=new Set(handStraddles(currentSession(),d).map(x=>wzActor(x.pos)));
  const voluntary=order.filter(a=>!['SB','BB'].includes(wzPosOf(a))&&!straddlers.has(a));
  if(voluntary.length)return voluntary;
  const fallback=d.sbNA?wzActor('BB'):wzActor('SB');
  return fallback?[fallback]:[];
}
function wzFirst(){
  const eligible=wzEligibleFirstActors(),only=eligible.length===1;
  if(only){
    UI.wz.first=eligible[0];
    return`<div class="panel"><div class="wz-info">De eerste vrijwillige actor volgt automatisch uit de volledige straddleketen: <b>${esc(wzPosOf(eligible[0]))}${eligible[0]==='ik'?' (Ik)':''}</b>.</div>${wzTable()}<button class="btn" data-wz-auto-first>Start actie-invoer</button>${wzErr()}</div>`;
  }
  return`<div class="panel"><div class="wz-info">Kies de eerste vrijwillige actor. SB, BB en actieve straddlers zijn niet selecteerbaar.</div>${wzTable()}${wzErr()}</div>`;

/* ===== v2.6 RC3 overrides: transitions, min-raise and round-trip ===== */
function wzInitialStreetState(st){
  const d=UI.draft,s=currentSession(),actors=wzOrder(st);
  const state={
    street:st,actors:{},currentBet:0,lastFullRaise:0,lastAggressor:null,
    actedSinceRaise:new Set(),pending:[],closed:false
  };
  actors.forEach(a=>state.actors[a]={status:'active',contribution:0,raiseRight:true,acted:false});
  if(st==='pf'){
    const bbValue=s.type==='cash'?num(d.bb):1;
    const sbValue=s.type==='cash'?num(d.sb):(num(d.bb)?num(d.sb)/num(d.bb):0.5);
    const sbActor=wzActor(d.players===2?'BTN/SB':'SB');
    const bbActor=wzActor('BB');
    if(!d.sbNA&&state.actors[sbActor])state.actors[sbActor].contribution=sbValue;
    if(state.actors[bbActor])state.actors[bbActor].contribution=bbValue;
    state.currentBet=bbValue;
    state.lastFullRaise=bbValue; // minimum opening increment before voluntary action

    const straddles=handStraddles(s,d);
    let previousLevel=bbValue;
    straddles.forEach(x=>{
      const actor=wzActor(x.pos);
      const level=s.type==='cash'?num(x.amount):(num(d.bb)?num(x.amount)/num(d.bb):0);
      if(state.actors[actor])state.actors[actor].contribution=level;
      if(level>state.currentBet){
        const increment=level-previousLevel;
        state.lastFullRaise=increment>0?increment:level;
        state.currentBet=level;
        state.lastAggressor=actor;
        previousLevel=level;
      }
    });
  }
  return state;
}

function wzReplayStreet(st,limit=null){
  const d=UI.draft,state=wzInitialStreetState(st),arr=d.streets[st]||[];
  const max=limit==null?arr.length:Math.max(0,Math.min(limit,arr.length));

  for(let i=0;i<max;i++){
    const a=arr[i],actor=a.pos,ps=state.actors[actor];
    if(!ps||ps.status!=='active')continue;

    const toCall=Math.max(0,state.currentBet-ps.contribution);

    if(a.act==='fold'){
      ps.status='folded';ps.acted=true;state.actedSinceRaise.add(actor);continue;
    }
    if(a.act==='check'){
      ps.acted=true;state.actedSinceRaise.add(actor);continue;
    }
    if(a.act==='call'){
      let add=toCall;
      const stack=wzKnownStack(actor);
      if(stack!=null)add=Math.min(add,Math.max(0,stack-ps.contribution));
      ps.contribution+=add;ps.acted=true;state.actedSinceRaise.add(actor);
      if(stack!=null&&Math.abs(ps.contribution-stack)<1e-7)ps.status='allin';
      continue;
    }

    if(['bet','raise','allin','jam'].includes(a.act)){
      const stack=wzKnownStack(actor);
      let target=wzUnitToBase(a.amt,a.unit,analyze(currentSession(),d).potStart?.[st]||0);

      if((a.act==='allin'||a.act==='jam')&&(target==null||target===0)&&stack!=null)target=stack;
      if(target==null){
        ps.status='allin';ps.acted=true;state.actedSinceRaise.add(actor);continue;
      }
      if(stack!=null)target=Math.min(target,stack);

      const previousBet=state.currentBet;
      const raiseSize=Math.max(0,target-previousBet);
      ps.contribution=Math.max(ps.contribution,target);
      ps.acted=true;

      if(target>previousBet+1e-7){
        const requiredIncrement=previousBet<=1e-7
          ? target
          : Math.max(state.lastFullRaise, 0);
        const fullRaise=previousBet<=1e-7 || raiseSize+1e-7>=requiredIncrement;

        if(fullRaise){
          state.lastFullRaise=previousBet<=1e-7?target:raiseSize;
          Object.entries(state.actors).forEach(([x,v])=>{
            if(v.status==='active'&&x!==actor)v.raiseRight=true;
          });
          state.actedSinceRaise=new Set([actor]);
        }else{
          // Short raise/all-in: actors who already acted since the last full raise
          // must call/fold if needed, but do not regain the right to raise.
          Object.entries(state.actors).forEach(([x,v])=>{
            if(v.status==='active'&&state.actedSinceRaise.has(x))v.raiseRight=false;
          });
          state.actedSinceRaise.add(actor);
        }

        state.currentBet=target;
        state.lastAggressor=actor;
      }else{
        state.actedSinceRaise.add(actor);
      }

      if(a.act==='allin'||a.act==='jam'||(stack!=null&&Math.abs(ps.contribution-stack)<1e-7)){
        ps.status='allin';
      }
    }
  }

  const active=Object.entries(state.actors).filter(([,v])=>v.status==='active');
  state.pending=active
    .filter(([,v])=>!v.acted||v.contribution+1e-7<state.currentBet)
    .map(([a])=>a);
  state.closed=state.pending.length===0;
  return state;
}

function wzStart(st){
  const w=UI.wz,d=UI.draft;
  w.street=st;w.selected='';w.value='';w.unit=w.lastUnit;

  let order=wzOrder(st);
  const unavailable=new Set();

  for(const prior of ['pf','flop','turn','river']){
    if(STREET_INDEX[prior]>=STREET_INDEX[st])break;
    (d.streets[prior]||[]).forEach(a=>{
      if(['fold','allin','jam'].includes(a.act))unavailable.add(a.pos);
    });
  }
  order=order.filter(a=>!unavailable.has(a));

  if(st==='pf'&&d.preflopPrefix){
    const excluded=new Set(d.preflopPrefix.foldedPositions||[]);
    order=order.filter(a=>!excluded.has(a));
    const first=d.preflopPrefix.firstActor;
    const idx=order.indexOf(first);
    if(idx>0)order=order.slice(idx).concat(order.slice(0,idx));
  }

  w.order=order;
  const replay=wzReplayStreet(st);
  const pendingSet=new Set(replay.pending.length?replay.pending:order);
  w.pending=order.filter(a=>pendingSet.has(a));
  w.actor=w.pending[0]||'';
  w.step=w.pending.length<=1?'finish':'action';
  render();
}

function wzWinnersFromHand(h){
  if(!h)return[];
  if(h.outcome==='win'||h.winner==='hero')return['ik'];
  if(h.outcome==='chop'){
    // Older schema stores only "chop"; winner participants cannot always be
    // reconstructed. Keep empty so unchanged review does not overwrite the hand.
    return[];
  }
  if(h.outcome==='lose'){
    if(String(h.winner||'').startsWith('pos:'))return[String(h.winner).slice(4)].map(wzActor);
    const v=(h.villains||[]).find(x=>x.id===h.winner);
    if(v&&v.pos)return[wzActor(v.pos)];
  }
  return[];
}

function editHand(id){
  const s=currentSession(),h=s.hands.find(x=>x.id===id);if(!h)return;
  UI.hid=id;
  UI.draft=deepClone(h);

  if(!UI.draft.positionBySeat||!Object.keys(UI.draft.positionBySeat).length){
    const n=Number(h.players)||9,hs=Number(h.heroSeat)||1;
    const idx=wzPos(n).indexOf(h.heroPos);
    const button=((hs-1-Math.max(0,idx)+n)%n)+1;
    UI.draft.buttonSeat=button;
    UI.draft.positionBySeat=wzAssign(n,button);
  }
  if(UI.draft.heroStackExact===undefined)UI.draft.heroStackExact=false;
  if(UI.draft.bbaEnabled===undefined)UI.draft.bbaEnabled=!!UI.draft.ante;
  if(!UI.draft.preflopPrefix)UI.draft.preflopPrefix=null;

  UI.wz=wzFlow();
  UI.wz.street=h.activeStreet||'pf';
  UI.wz.review=h.activeStreet||'pf';
  UI.wz.step='review';
  UI.wz.winners=wzWinnersFromHand(h);
  UI.wz.originalOutcome=h.outcome||'';
  UI.wz.originalWinner=h.winner||'';
  UI.wz.editingExisting=true;
  go('hand');
}

function wzResumeAfterStructuralEdit(st,index,originalAction=null){
  const d=UI.draft,w=UI.wz,arr=d.streets[st];
  const actor=(originalAction&&originalAction.pos)||(arr[index]&&arr[index].pos);
  d.streets[st]=arr.slice(0,index);
  w.street=st;
  w.review=st;
  w.order=wzOrder(st).filter(a=>{
    const prior=['pf','flop','turn','river']
      .filter(x=>STREET_INDEX[x]<STREET_INDEX[st])
      .flatMap(x=>d.streets[x]||[]);
    return !prior.some(x=>x.pos===a&&['fold','allin','jam'].includes(x.act));
  });
  w.pending=actor?[actor]:[];
  w.actor=actor||w.order[0]||'';
  w.selected=originalAction?originalAction.act:'';
  w.value=originalAction?(originalAction.amt||''):'';
  w.unit=originalAction?(originalAction.unit||w.unit):w.unit;
  w.step='action';
  render();
}

function wzSave(){
  const s=currentSession(),d=UI.draft,w=UI.wz,dup=wzDuplicateCardErrors();
  if(dup.length){w.error=dup.join(' ');return render()}

  const v=validateHandFlow(s,d);
  if(v.errors.length){w.error=v.errors.join(' ');return render()}

  d.implicitFolds=v.derived.implicit;
  d.potReliable=!v.derived.unknownAllins.length;
  d.unknownAllInPositions=v.derived.unknownAllins;
  syncHeroStack(d);
  d.villains.forEach(x=>{syncVStack(d,x);updateSessionPlayerFromHand(s,x)});

  const all=Object.values(d.streets).flat();
  const heroFold=all.some(a=>a.pos==='ik'&&a.act==='fold');
  const live=wzAll().filter(a=>!all.some(x=>x.pos===a&&x.act==='fold'));

  if(heroFold){d.outcome='fold';d.winner=''}
  else if(live.length===1&&live[0]==='ik'){d.outcome='win';d.winner='hero'}
  else if(w.editingExisting&&w.winners.length===0&&w.originalOutcome){
    // Preserve an unchanged legacy outcome/winner when the old schema does not
    // contain enough information to reconstruct all chop participants.
    d.outcome=w.originalOutcome;
    d.winner=w.originalWinner;
  }else{
    if(!w.winners.length){w.error='Selecteer minimaal één winnaar.';return render()}
    if(w.winners.length>1){d.outcome='chop';d.winner='chop'}
    else if(w.winners[0]==='ik'){d.outcome='win';d.winner='hero'}
    else{
      d.outcome='lose';
      const p=wzPosOf(w.winners[0]),vi=d.villains.find(x=>x.pos===p);
      d.winner=vi?vi.id:'pos:'+p;
    }
  }

  d.activeStreet=w.street||d.activeStreet||'pf';
  const i=s.hands.findIndex(x=>x.id===d.id);
  if(i>=0)s.hands[i]=d;else s.hands.unshift(d);
  s.heroSeat=d.heroSeat;
  save();UI.wz=null;go('share',s.id,d.id);
}

  if(s.type!=='cash')return'';
  if(!(s.straddleEnabled||s.btnStraddleEnabled))return`<div class="disabled-feature">Straddles zijn voor deze sessie uitgeschakeld.</div>`;
  let h=`<h2>Straddles</h2><div class="seg"><button class="${!d.straddleType?'on':''}" data-set-render="h.straddleType:">Geen</button>${s.straddleEnabled?`<button class="${d.straddleType==='regular'?'on':''}" data-set-render="h.straddleType:regular" ${max?'':'disabled'}>Reg.</button>`:''}${s.btnStraddleEnabled?`<button class="${d.straddleType==='btn'?'on':''}" data-set-render="h.straddleType:btn">Btn.</button>`:''}</div>`;
  if(d.straddleType==='regular'&&max){h+=`<label>Aantal straddles</label><select data-path-render="h.straddleCount">${Array.from({length:max},(_,i)=>i+1).map(n=>`<option value="${n}" ${Number(d.straddleCount)===n?'selected':''}>${n}</option>`).join('')}</select>`+regularStraddleRows(s,d).map(x=>x.open?`<label>${x.pos} bedrag</label><input data-straddle-amt="${x.index}" data-chip="1" value="${esc(chipDisplay(d.straddleAmounts[x.index]||''))}">`:`<div class="note">${x.pos}: ${money(s,x.amount)}</div>`).join('')}
  if(d.straddleType==='btn')h+=s.btnStraddleOpen?`<label>BTN-straddle bedrag</label><input data-straddle-amt="0" data-chip="1" value="${esc(chipDisplay(d.straddleAmounts[0]||''))}">`:`<div class="note">BTN-straddle: ${money(s,s.btnStraddleFixed||0)}</div>`;
  return h;
}

function wzTags(){const d=UI.draft,c=wzCoords(d.players),tags=[];Object.entries(d.positionBySeat||{}).forEach(([seat,p])=>{const q=c[+seat-1];if(!q)return;const add=(txt,cl,dx=0,dy=7)=>tags.push(`<span class="wz-chip ${cl}" style="left:${q[0]+dx}%;top:${q[1]+dy}%">${esc(txt)}</span>`);if(p==='SB'&&!d.sbNA)add(chipDisplay(d.sb),'sb');if(p==='BB'){add(chipDisplay(d.bb),'bb');if(currentSession().type!=='cash'&&d.bbaEnabled&&d.ante)add('BBA '+chipDisplay(d.ante),'ante',8)} });handStraddles(currentSession(),d).forEach(st=>{const seat=wzSeatOf(st.pos),q=c[seat-1];if(q)tags.push(`<span class="wz-chip straddle" style="left:${q[0]}%;top:${q[1]+8}%">${esc(chipDisplay(st.amount))}</span>`)});return tags.join('')}

function wzAction(){const w=UI.wz,d=UI.draft,state=wzReplayStreet(w.street),ps=state.actors[w.actor],toCall=ps?Math.max(0,state.currentBet-ps.contribution):0,p=(d.streets[w.street]||[]).at(-1),isAllin=w.selected==='allin',known=wzKnownStack(w.actor),unit=isAllin?'chips':w.unit;let allinBox='';if(isAllin){if(w.actor==='ik'&&known!=null){allinBox=`<div class="wz-allin-box">All-inomvang: <b>${esc(rc5DisplayValue(known,'chips',true))}</b><button class="btn" data-wz-confirm>Bevestigen</button></div>`}else{allinBox=`<div class="wz-allin-box">Is de all-inomvang bekend?<div class="seg"><button class="${w.allinKnown===true?'on':''}" data-wz-allin-known="true">Ja</button><button class="${w.allinKnown===false?'on':''}" data-wz-allin-known="false">Nee</button></div>${w.allinKnown===true?`<label>Omvang in chips</label><input data-wz-value data-chip="1" value="${esc(w.value)}"><button class="btn" data-wz-confirm>Bevestigen</button>`:w.allinKnown===false?`<button class="btn" data-wz-confirm>All-in zonder omvang vastleggen</button>`:''}</div>`}}

function rc5NoFurtherDecision(st){const state=wzReplayStreet(st),entries=Object.values(state.actors),inHand=entries.filter(x=>x.status!=='folded'),canAct=inHand.filter(x=>x.status==='active');return inHand.length>=2&&canAct.length<=1&&inHand.some(x=>x.status==='allin')}

document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.suit&&UI.cardGroup&&UI.picker){e.preventDefault();e.stopImmediatePropagation();const card=UI.pickRank+t.dataset.suit,current=UI.picker;setCard(current,card);const idx=UI.cardGroup.indexOf(current),next=UI.cardGroup.slice(idx+1).find(p=>{const q=p.split('.');if(q[0]==='hero')return !UI.draft.heroCards[+q[1]];if(q[0]==='board')return !UI.draft.board[+q[1]];if(q[0]==='v')return !UI.draft.villains[+q[1]].cards[+q[2]];return false});if(next){UI.picker=next;UI.pickRank=null}else{UI.picker=null;UI.cardGroup=null;UI.pickRank=null}render()}},true);

document.addEventListener('input',e=>{if(!UI.wz)return;if(e.target.dataset.wzBb!==undefined){UI.draft.bb=e.target.value;if(UI.draft.bbaEnabled){UI.draft.ante=e.target.value;const ante=document.querySelector('[data-path="h.ante"]');if(ante)ante.value=e.target.value}}},true);
document.addEventListener('change',e=>{if(!UI.wz)return;if(e.target.dataset.wzSbna!==undefined){UI.draft.sbNA=e.target.checked;render()}if(e.target.dataset.wzVplayer!==undefined&&String(e.target.value).startsWith('lib:')){const i=+e.target.dataset.wzVplayer,id=String(e.target.value).slice(4),lp=libraryPlayer(id),s=currentSession();if(lp){let p=s.players.find(x=>x.id===id);if(!p){p={id:lp.id,name:lp.name,notes:'',seat:''};s.players.push(p)}UI.draft.villains[i].playerId=p.id;UI.draft.villains[i].name=p.name;render()}}},true);

const wzSaveRC5FinalBase=wzSave;
wzSave=function(){if(UI.wz?.resultMode==='chop'&&UI.wz.winners.length<2){UI.wz.error='Selecteer minimaal twee spelers voor een chop.';return render()}return wzSaveRC5FinalBase()}


/* RC5 final navigation/runout corrections */
const newHandRC5Base=newHand;
newHand=function(){newHandRC5Base();if(UI.draft){const max=rc5MaxPlayers();UI.draft.players=Math.max(2,Math.min(max,Number(currentSession().hands?.[1]?.players||currentSession().tableSeats)||max));UI.draft.positionBySeat={};UI.draft.buttonSeat='';if(UI.wz){UI.wz.furthestReached='config';UI.wz.navigationBack=false}render()}}

const rHandRC5NavBase=rHand;
rHand=function(){
  if(!UI.wz)return rHandV25();
  const w=UI.wz,b={config:wzConfig,button:wzButton,hero:wzHero,players:wzPlayers,first:wzFirst,action:wzAction,review:wzReview,board:wzBoard,finish:wzFinish}[w.step]();
  const early=['config','button','hero','players','first'].includes(w.step);
  const manualInitial=['config','players'].includes(w.step);
  const forward=rc5ForwardAllowed()&&(manualInitial||w.navigationBack);
  return`<div class="top"><button class="back" data-wz-header-prev ${w.step==='config'?'disabled':''}>← Vorige stap</button><h1>${UI.hid?'Hand bewerken':'Nieuwe hand'}</h1><button class="back wz-close" data-wz-close aria-label="Handregistratie sluiten">✕</button></div>${wzSteps()}${b}${early?`<div class="wz-footer"><div class="inner"><button class="btn sub" data-wz-prev ${w.step==='config'?'disabled':''}>Vorige stap</button><button class="btn" data-wz-next ${forward?'':'disabled'}>Volgende stap →</button></div></div>`:''}${w.closePrompt?`<div class="wz-close-dialog"><div class="wz-close-card"><h1>Handregistratie verlaten?</h1><p class="compact">Deze hand is nog niet afgerond.</p><button class="btn" data-wz-close-save>Concept bewaren</button><button class="btn danger" data-wz-close-delete>Concept verwijderen</button><button class="btn sub" data-wz-close-cancel>Doorgaan met registreren</button></div></div>`:''}`;
}

document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t||!UI.wz)return;const w=UI.wz,d=UI.draft;
 if(t.dataset.wzNext!==undefined){e.preventDefault();e.stopImmediatePropagation();if(rc5ForwardAllowed()&&(['config','players'].includes(w.step)||w.navigationBack))return rc5ForwardStep();return}
 if(t.dataset.wzSeat&&w.step==='hero'){e.preventDefault();e.stopImmediatePropagation();const seat=+t.dataset.wzSeat;d.heroSeat=String(seat);d.heroPos=d.positionBySeat[seat];w.furthestReached='players';w.navigationBack=false;w.step='players';return setTimeout(render,120)}
 if(t.dataset.wzBoardOk!==undefined&&d.runoutFrom){e.preventDefault();e.stopImmediatePropagation();const ix=w.street==='flop'?[0,1,2]:w.street==='turn'?[3]:[4];if(!ix.every(i=>d.board[i])){w.error='Vul alle boardkaarten in.';return render()}if(w.street==='flop'){w.street='turn';w.step='board'}else if(w.street==='turn'){w.street='river';w.step='board'}else{w.step='finish';w.winners=[]}return render()}
},true);

function rc5aRefreshForwardButton(){
  if(!UI.wz)return;
  const btn=document.querySelector('[data-wz-next]');
  if(!btn)return;
  const manualInitial=['config','players'].includes(UI.wz.step);
  btn.disabled=!(rc5ForwardAllowed()&&(manualInitial||UI.wz.navigationBack));
}
document.addEventListener('input',e=>{
  if(!UI.wz)return;
  if(e.target.matches('[data-path="h.sb"],[data-path="h.bb"],[data-wz-bb],[data-wz-stack],[data-wz-vstack]')){
